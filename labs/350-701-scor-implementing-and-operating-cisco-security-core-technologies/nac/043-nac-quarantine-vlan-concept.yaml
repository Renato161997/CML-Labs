lab:
  title: NAC Quarantine VLAN Concept
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# NAC Quarantine VLAN Concept


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-701-043-nac-quarantine-vlan-concept.md


    Four IOL reference nodes demonstrate the enforcement side of a NAC quarantine concept. An operator
    deliberately changes the port VLAN and the explicit IOL endpoint address/default route; no RADIUS,
    ISE, 802.1X, MAB or automatic admission engine is claimed. VLAN999 has a real routed ingress policy
    permitting only the documentation remediation loopback and denying other traffic. Once the endpoint
    has the quarantine address, remediation must succeed while the actual internal service fails with
    a deny counter. The service-side gateway remains healthy. Restoring the access VLAN and explicit endpoint
    configuration must recover the original service. VLAN movement alone is not falsely presented as a
    working posture or identity decision. Nominal RAM is4GiB.


    Objectives:

    - Distinguish a manual admission decision, access-port VLAN membership and routed quarantine policy.

    - Move the endpoint to quarantine and prove a working remediation path with blocked internal service.

    - Restore authorized membership and endpoint addressing, then verify normal service recovery.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: GW
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname GW\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Ethernet0/0\n no shutdown\n exit\ninterface Ethernet0/0.10\n encapsulation dot1Q\
      \ 10\n ip address 198.18.10.1 255.255.255.0\n no shutdown\n exit\ninterface Ethernet0/0.999\n encapsulation\
      \ dot1Q 999\n ip address 198.18.99.1 255.255.255.0\n no shutdown\n exit\ninterface Ethernet0/1\n\
      \ ip address 198.18.20.1 255.255.255.0\n no shutdown\n exit\ninterface Loopback0\n ip address 192.0.2.80\
      \ 255.255.255.255\n no shutdown\n exit\nip access-list extended QUARANTINE\n permit icmp 198.18.99.0\
      \ 0.0.0.255 host 192.0.2.80\n deny ip any any\n exit\ninterface Ethernet0/0.999\n ip access-group\
      \ QUARANTINE in\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
