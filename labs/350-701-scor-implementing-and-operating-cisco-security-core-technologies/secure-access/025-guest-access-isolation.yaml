      \ spanning-tree vlan 10 cost 4\n no shutdown\n exit\ninterface Ethernet0/1\n switchport mode access\n\
      \ switchport access vlan 10\n spanning-tree portfast\n no shutdown\n exit\ninterface Ethernet0/2\n\
      \ switchport mode access\n switchport access vlan 20\n spanning-tree portfast\n no shutdown\n exit\n\
