lab:
  title: Guest Access Isolation
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Guest Access Isolation


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-701-025-guest-access-isolation.md


    Four IOL reference nodes implement a trusted VLAN, a guest VLAN, real guest DHCP and gateway-local
    DNS for a documentation portal loopback. IOL models the guest endpoint: its address is acquired dynamically,
    while gateway and DNS client configuration are explicit; no desktop DHCP-option behavior is claimed.
    The guest ingress ACL permits DHCP/DNS, denies trusted-subnet destinations, allows only the guest
    source prefix for remaining traffic, and denies other sources. This is stateless policy, so guest
    replies toward trusted destinations are also denied; stateful trusted-initiated sessions are not claimed.
    An early permit must visibly bypass isolation, its removal must restore actual denies, and separate
    guest trunk pruning must preserve trusted portal availability. Restoring the trunk must first recover
    actual gateway reachability, then DNS/portal while retaining isolation. DNS command collection has
    a bounded90-second limit separate from Layer2 convergence. The portal is a local router loopback,
    not Internet access or a captive portal product. Nominal RAM is4GiB.


    Objectives:

    - Acquire a real guest DHCP lease and resolve an isolated portal through the allowed DNS path.

    - Prove routed guest isolation using actual deny counters while trusted service remains healthy.

    - Repair an early permit and distinguish policy enforcement from a pruned guest trunk.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: GW
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname GW\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\nip dns server\nip host portal.lab.example 192.0.2.80\ninterface Ethernet0/0\n no shutdown\n\
      \ exit\ninterface Ethernet0/0.10\n encapsulation dot1Q 10\n ip address 198.18.10.1 255.255.255.0\n\
      \ no shutdown\n exit\ninterface Ethernet0/0.20\n encapsulation dot1Q 20\n ip address 198.18.20.1\
      \ 255.255.255.0\n no shutdown\n exit\ninterface Loopback0\n ip address 192.0.2.80 255.255.255.255\n\
      \ no shutdown\n exit\nip dhcp excluded-address 198.18.20.1 198.18.20.99\nip dhcp pool GUESTS\n network\
      \ 198.18.20.0 255.255.255.0\n default-router 198.18.20.1\n dns-server 198.18.20.1\n exit\nip access-list\
      \ extended GUEST-POLICY\n 10 permit udp any eq bootpc any eq bootps\n 20 permit udp 198.18.20.0\
      \ 0.0.0.255 host 198.18.20.1 eq domain\n 30 permit tcp 198.18.20.0 0.0.0.255 host 198.18.20.1 eq\
      \ domain\n 40 deny ip any 198.18.10.0 0.0.0.255\n 50 permit ip 198.18.20.0 0.0.0.255 any\n 60 deny\
      \ ip any any\n exit\ninterface Ethernet0/0.20\n ip access-group GUEST-POLICY in\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
