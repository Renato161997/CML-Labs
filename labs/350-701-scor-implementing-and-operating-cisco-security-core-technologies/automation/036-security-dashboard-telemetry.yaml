lab:
  title: 'Telemetry: Fresh State and Honest Byte Rates'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Telemetry: Fresh State and Honest Byte Rates


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-701-036-security-dashboard-telemetry.md


    An IOL-XE router exposes a separate management link to TOOLS and data link to CLIENT. The new status-board
    collector uses the unchanged real Net-SNMP authPriv request implementation, not preconfigured metric
    strings. It verifies exact OID/type/value responses, actual agent R1 identity, discovers only the
    declared Ethernet0/1 within the fixed agent''s first sixteen interface rows, and reads actual ifOperStatus/ifInOctets/ifOutOctets
    plus uptime. A second uptime read rejects an agent restart during collection. Counter32 and uptime
    values are bounded unsigned values; sequential reads are not claimed to be an atomic hardware snapshot.


    The console board keeps a last valid sample inside the disposable collector and labels actual fresh
    availability, operational state and RX/TX bytes from the router interface''s perspective. Rates are
    bytes per elapsed collector-monotonic second, calculated only from two matching interface/agent series
    within sixty seconds. A counter decrease/wrap, agent-uptime reset, identity change or invalid/stale
    interval produces unknown rate metadata, not a fabricated large or zero rate. Authenticated idle counters
    may legitimately produce zero; an unavailable response instead has no fresh sample and no rates. Failed
    positive-rate acceptance does not advance its reference sample. No clock-to-UTC accuracy, hardware
    throughput or exclusive attribution of all background bytes to test pings is inferred.


    Actual CLIENT traffic must succeed and both interface byte counters must increase between the measured
    samples. Shutting only the data port must produce a fresh available/down state and failed data pings,
    while encrypted management SNMP and management IP controls remain healthy. Deliberately selecting
    the wrong public fixture auth key must produce explicit unavailable/null metrics, with the last valid
    cache retained; an independent correctly credentialed Net-SNMP probe must still work. Restoring the
    key and data path must recover real samples and positive measured rates. The optional `python3 /lab/d.py
    watch` provides a live terminal status board with a two-second pause after each collection; stop it
    before acceptance because the exercise uses one collector cache, not a concurrent dashboard service.
    No graphical browser UI, alerting platform or production monitoring deployment is claimed.


    All addresses/engine IDs/passwords are public classroom fixtures on closed links. SNMPv3 SHA1/AES128
    are the reference-image interoperability settings already verified by the separate SNMP exercise,
    not a production crypto recommendation. Collection is read-only and fixed to one agent; there is no
    external discovery, cloud account, Internet connector or real credential. Wiping only this imported
    lab removes the cache and all state.



    Objectives:

    - Read actual SNMPv3 interface/identity/counter observations and display their explicit freshness
    and availability.

    - Calculate defensible byte rates from matching measured samples while rejecting stale/reset/discontinuous
    series.

    - Distinguish real data-port down from collection/authentication failure, retain positive management
    controls and recover.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\nno logging console\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n\
      \ exit\ninterface Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\ninterface\
      \ Ethernet0/1\n ip address 198.18.1.1 255.255.255.252\n no shutdown\n exit\nip access-list standard\
      \ SNMP-SOURCES\n permit 198.18.0.2\n exit\nsnmp-server engineID local 8000000903AABBCC000001\nsnmp-server\
      \ view LABVIEW iso included\nsnmp-server view LABVIEW 1.3.6.1.2.1.1.5 included\nsnmp-server group\
      \ LAB v3 priv read LABVIEW access SNMP-SOURCES\nsnmp-server user CML-SNMP LAB v3 auth sha Cml-Snmp-Auth-Only-983\
      \ priv aes 128 Cml-Snmp-Priv-Only-984\nsnmp-server location ISOLATED-CML-LAB\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: TOOLS
  node_definition: net-tools
