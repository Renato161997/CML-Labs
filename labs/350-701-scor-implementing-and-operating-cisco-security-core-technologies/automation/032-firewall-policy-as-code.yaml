lab:
  title: 'Policy as Code: Guarded Artifacts, Real Deployment and Rollback'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Policy as Code: Guarded Artifacts, Real Deployment and Rollback


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-701-032-firewall-policy-as-code.md


    A native publisher compiles a deliberately closed JSON classroom intent into an actual IOS ACL merge
    artifact. Its only resources are source 198.18.10.10/32, service 198.18.20.20/32, application TCP
    8080 and administration-port fixture TCP 9090. It accepts application allow/deny but always denies
    administration and preserves ICMP. Extra fields, command injection, changed resources, noninteger/out-of-range
    versions and an administration allow are rejected before publication. Every rejected example must
    leave the complete previously approved artifact bytes unchanged. This is a finite teaching compiler,
    not a general policy language or universal security validator.


    The initial published version 1 allows the application, but the actual router reference starts with
    application deny. This intentionally distinguishes staged desired state from deployed running state.
    The router''s real HTTP client fetches the complete artifact from INSIDE 198.18.10.10:8081/approved
    and merges it into its actual running configuration. Four fixed ACL sequences are explicitly deleted/re-added
    while the ACL stays defined; this is not an atomic transactional device commit or a zero-loss change.
    Sequence 5 is a separate immutable, narrowly scoped stateless TCP-return exception for that router-originated
    artifact download. It is not identity authentication or a stateful firewall. No other client/admin
    permit is implied.


    After applying version 1, actual remote application HTTP must work with the observed client peer while
    the remote administration request remains blocked. Both local service listeners and three routed ICMP
    replies remain positive controls. Publish version 2 with application deny: running traffic must remain
    allowed until the router actually downloads/applies it. After real deployment the application must
    fail while administration stays blocked and controls remain healthy. Publish the previously stored
    accepted version-1 snapshot: traffic must remain blocked until the rollback is actually applied; then
    recover the original allow/deny matrix. Rejected unsafe intent must never alter the published artifact
    or deployed behavior.


    State stores intent, complete bytes and SHA256; every served artifact must match its validated intent
    and digest. This is representation consistency, not a digital signature. The HTTP path is read-only
    and intentionally plaintext inside an isolated link. CLI root fixture actions stage the two accepted
    intents; there is no authenticated production approval interface, signed supply chain, remote secret,
    cloud service, real CI deployment, vendor firewall manager or formal all-flow equivalence claim. No
    Internet connector or original user lab is touched. Only the imported copy may be stopped/wiped.



    Objectives:

    - Reject unsafe or out-of-scope desired intent before changing the published artifact.

    - Distinguish staged desired state from actual IOS configuration and actual service packets.

    - Perform real HTTP artifact deployment and rollback, preserving administration denial and independent
    controls.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: FW
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname FW\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\nno logging console\nfile prompt quiet\nip http client source-interface Ethernet0/0\nip access-list\
      \ extended POLICY-CODE\n 5 permit tcp host 198.18.10.10 eq 8081 host 198.18.10.1 established\n 10\
      \ deny tcp host 198.18.10.10 host 198.18.20.20 eq 8080\n 20 deny tcp any host 198.18.20.20 eq 9090\n\
      \ 30 permit icmp any any\n 40 deny ip any any\n exit\ninterface Ethernet0/0\n ip address 198.18.10.1\
      \ 255.255.255.0\n no shutdown\n ip access-group POLICY-CODE in\n exit\ninterface Ethernet0/1\n ip\
      \ address 198.18.20.1 255.255.255.0\n no shutdown\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
  ram: 1024
  cpus: 1
- id: n1
  label: INSIDE
  node_definition: net-tools
