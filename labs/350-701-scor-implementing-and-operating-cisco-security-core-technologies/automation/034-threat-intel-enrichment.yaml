lab:
  title: 'Indicator Feed: Revalidation, Revocation and Cache Integrity'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Indicator Feed: Revalidation, Revocation and Cache Integrity


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-701-034-threat-intel-enrichment.md


    Two actual isolated native Linux nodes exchange real HTTP on SOURCE 198.18.0.1:8080 and ANALYST 198.18.0.2.
    The source publishes five explicitly synthetic benchmark IPv4 indicators in a deliberately closed
    JSON/indicator exercise profile. Only literal IPv4 equality patterns are supported; this is not a
    conforming STIX/TAXII implementation, a general STIX parser, a vendor feed or live threat intelligence.
    Public fixture UUIDs are intentionally fixed. No actual malicious content, real-world IOC, production
    credential, external connector or Internet feed is involved.


    The field conventions are derived from the [OASIS STIX 2.1 indicator/common-property definitions](https://docs.oasis-open.org/cti/stix/v2.1/os/stix-v2.1-os.html).
    Producer confidence is bounded 0..100; the exercise chooses 70 as its alert threshold, not a probability
    or verified truth. A match also requires a supported literal pattern, current validity and no revocation.
    Missing confidence is unspecified. Separate low-confidence, expired, revoked and future-valid indicators
    must not match. The first indicator matches only until the source explicitly revokes it. Validity
    windows are one hour from initial fixture configuration; use a fresh imported copy if teaching is
    paused beyond that window.


    The analyst obtains a real initial 200 representation and uses its actual strong SHA256 ETag for conditional
    revalidation. An unchanged representation produces a real HTTP 304. Cached bytes must still match
    that tag and pass the closed profile before use. Revalidation proves communication and representation
    consistency, not source authentication, producer publication freshness or the accuracy of the intelligence.
    Isolated plaintext HTTP is not an Internet-ready secure feed transport.


    Controlled source 503 returns unknown despite a previously matched cached indicator. A separate source
    fault returns HTTP 200 with an invalid confidence field; transport success must still produce unknown
    and preserve the last valid cache. Three independent ICMP replies remain available during both source
    faults. Restore a valid response and recover a verified match. Publish revocation, observe a different
    ETag and a fresh 200, and require no match; no match does not establish benignness. Finally alter
    only local cached body bytes without updating their tag. The client must detect this mismatch, omit
    the unusable conditional tag, obtain a real 200, validate and replace the cache, and retain the observed
    revoked/no-match state. There is no automated firewall change, commercial integration, TLS-origin
    proof or malware classification claim.



    Objectives:

    - Enrich a synthetic IPv4 observation only from a successfully revalidated and structurally accepted
    source representation.

    - Exclude low-confidence, expired, revoked and future-valid indicators; distinguish no match from
    unknown and from benign.

    - Exercise actual 200/304/503 transitions, invalid content and cache corruption without promoting
    stale evidence.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
