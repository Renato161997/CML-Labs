lab:
  title: 'SOAR Events: Signature, Approval and Verified Route Remediation'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# SOAR Events: Signature, Approval and Verified Route Remediation


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-701-033-soar-webhook-remediation.md


    A separate native publisher sends actual HTTP event deliveries to a fixture gateway on TOOLS 198.18.1.1:8081.
    The gateway verifies a bounded UTF8 JSON body, exactly one SHA256 HMAC signature header, exact fields/scalar
    types, integer timestamp within 60seconds and the fixed business-event/resource allowlist. Duplicate
    JSON fields and ambiguous HTTP lengths/types/signatures are rejected. The only mappings are quarantine/withdraw-1
    -> remove 192.0.2.42/32, and release/repair-1 -> restore that same route through 198.18.0.2. No freeform
    commands, destinations, URLs or client-provided approval are forwarded.


    Accepted events call the unchanged controller northbound API; its separate root-owned exact-intent
    approval policy still applies. Its actual RESTCONF facts, key-pinned NETCONF device changes, readback
    and durable SQLite lifecycle record are independent of the event signature. The initial seed submits
    the already approved install-1 through that real controller, then independent CSR RIB and ICMP probes
    establish a usable initial route. Invalid signed/unsigned event cases must leave the complete device-job
    history unchanged and preserve actual route/facts.


    Withdrawal must genuinely remove the CSR host route and stop its service-loopback packets while connected
    management remains reachable. Two concurrent freshly signed redeliveries of the same committed business
    ID must both be reported as replays without another write or history event. The publisher preserves
    the business ID and refreshes its signed transport timestamp; an expired original body is rejected
    rather than silently exempted from freshness checks. A signed release must create exactly one additional
    successful job, restore the route and recover actual ICMP.


    The signature key and backend bearer token are explicitly public classroom fixtures. Northbound HTTP
    is plaintext on isolated links; this is not a secure Internet webhook product, encryption/confidentiality,
    a real external detector, a commercial SOAR/controller API, an end-user identity workflow or a distributed
    exactly-once guarantee. Approval changes are controlled root CLI fixture actions, not a human ticket
    system. CLIENT also holds the public operator fixture to seed/read the teaching controller for acceptance;
    no publisher/operator network trust separation is inferred. Only committed replay and the explicitly
    tested failure windows are claimed. Backend management uses real certificate/key verification. No
    production credential, cloud service, Internet connector, malware or existing user lab is used. Nominal
    RAM 4608MiB requires one explicitly selected reserved larger-case run.



    The first controlled policy fault withdraws only root fixture approval. A correctly signed and otherwise
    valid quarantine delivery must return 403, leave the entire job history unchanged and retain working
    packets. Restoring approval permits the same scoped event to remove the actual route. Concurrent committed
    redeliveries are harmless; a separately approved signed release restores forwarding. This does not
    integrate an actual external threat feed or real human approval interface.


    Objectives:

    - Validate real signed, fresh and fixed-scope event deliveries without letting authentication grant
    approval.

    - Observe real controller jobs plus independent device RIB/ICMP consequences and unchanged management
    reachability.

    - Replay committed business IDs without duplicate writes and recover the approved service route.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: API
  node_definition: csr1000v
  configuration:
  - name: iosxe_config.txt
    content: "hostname API\nno ip domain-lookup\nip domain name cml-lab.example\nusername CML-LAB privilege\
      \ 15 secret Cml-lab-only-984\naaa new-model\naaa authentication login default local\naaa authorization\
      \ exec default local\naaa authentication login CONSOLE none\nline console 0\n login authentication\
      \ CONSOLE\n privilege level 15\n exec-timeout 0 0\n logging synchronous\n exit\ninterface GigabitEthernet1\n\
      \ ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\nno ip http server\nno ip http secure-server\n\
      ip http authentication local\nip ssh version 2\nline vty 0 4\n login authentication default\n transport\
      \ input ssh\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet1
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet2
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet3
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet4
    type: physical
    slot: 3
  tags: []
  ram: 3072
  cpus: 2
- id: n1
  label: TOOLS
  node_definition: cml-labs-toolbox
