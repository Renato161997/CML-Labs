    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: TOOLS
  node_definition: net-tools
  configuration:
  - name: boot.sh
    content: '#!/bin/bash

      set -eu

      ip address add 198.18.0.2/30 dev eth1

      ip link set eth1 up

      ip route add 192.0.2.1/32 via 198.18.0.1 dev eth1

      mkdir -p /lab

      echo READY >/dev/console

      exit 0

      '
