lab:
  title: Syslog SIEM Correlation
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Syslog SIEM Correlation


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-701-027-syslog-siem-correlation.md


    This vendor-neutral SIEM exercise uses a small inspectable Python collector/correlator on native net-tools,
    rather than claiming a live commercial SIEM integration. Real traffic causes the IOL-XE ACL log; a
    real administrative change causes the spare Loopback1 event. The decoder groups by observed UDP source
    and compares collector monotonic receive times, avoiding assumptions about the router clock. A temporal
    pair is investigation evidence, not proof of an attack or causal relation. The single-event-family
    phase is an explicit negative control. UDP sender identity is not authenticated. The collector binds
    only its benchmark data interface; all archives are disposable lab files and remain until wipe.


    Objectives:

    - Collect actual router UDP syslog into a receiver-owned JSONL archive.

    - Generate an ingress ACL denial and verify that one event family alone is not a correlated incident.

    - Administratively disable a spare interface and pair the two real event families within a bounded
    receive-time window.

    - Restore forwarding and interface state while retaining the historical evidence.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Loopback1\n ip address 192.0.2.99 255.255.255.255\n no shutdown\n exit\ninterface Ethernet0/0\n\
      \ ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/1\n ip address\
      \ 198.18.1.1 255.255.255.252\n no shutdown\n exit\nlogging on\nlogging buffered 32768 informational\n\
      logging trap informational\nlogging source-interface Ethernet0/1\nlogging host 198.18.1.2 transport\
      \ udp port 514\nend\n"
