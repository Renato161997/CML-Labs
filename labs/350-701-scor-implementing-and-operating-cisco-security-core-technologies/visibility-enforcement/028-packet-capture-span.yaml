lab:
  title: Packet Capture SPAN
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Packet Capture SPAN


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-701-028-packet-capture-span.md


    One IOL-L2 switch, two Net-Tools endpoints and a separate 1 GiB automation toolbox capture guest implement
    actual local SPAN. Capture has no data IP or application server. Client-to-server requests enter source
    Ethernet0/0, so receive direction is deliberately significant. Changing to transmit-only can still
    mirror responses but must not supply the selected client GET tuple; successful independent HTTP and
    a complete quiet window distinguish that visibility gap from an application failure. Nominal RAM is
    3 GiB. The receive-only observer opens an actual Linux AFPacket socket in the isolated capture guest,
    requests promiscuous membership and filters only a fixed benchmark HTTP GET tuple. A successful capture
    requires a real one-frame Ethernet PCAP with consistent lengths, tuple and SHA256; a scalar claim
    without that file is rejected. Negative visibility requires the real bound listener to finish the
    entire 12-second window. This is absence of the selected fixture request, not absence of all network
    traffic. Phase-specific ports prevent old frames from satisfying recovery. The parser handles up to
    two VLAN tags and complete unfragmented IPv4/TCP GET packets; it is not a general PCAP/PCAPNG or TCP
    reassembly analyzer and does not validate transport checksums. No packet is transmitted by the observer.
    All endpoint/switch consoles are opened before arming, so console initialization does not consume
    the observation window. Primary configuration reference: https://www.cisco.com/c/en/us/td/docs/IIOT/switches/ie3x00/config/layer2/layer2_switch/g_configuring-span-and-rspan/configure-span-rspan.html
    . IOL-L2 feature support is accepted only if the recorded real-frame gates pass, not from accepted
    CLI text or vendor support inference.


    Objectives:

    - Observe a real mirrored client HTTP request and preserve an inspectable bounded PCAP.

    - Change only the source direction and prove a visibility gap while the actual HTTP service stays
    healthy.

    - Restore receive-direction mirroring and require a new-port packet observation.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: SW
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname SW\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nvlan 10\n name SERVICE\n exit\ninterface Ethernet0/0\n\
      \ switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n no shutdown\n exit\n\
      interface Ethernet0/1\n switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n\
      \ no shutdown\n exit\ninterface Ethernet0/2\n switchport mode access\n switchport access vlan 10\n\
      \ spanning-tree portfast\n no shutdown\n exit\nmonitor session 1 source interface Ethernet0/0 rx\n\
      monitor session 1 destination interface Ethernet0/2\nend\n"
