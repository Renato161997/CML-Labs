- id: n0
  label: GW
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname GW\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nno logging console\nip flow-export version 5\nip flow-export\
      \ source GigabitEthernet0/1\nip flow-export destination 198.18.20.20 2055\nip flow-cache timeout\
      \ active 1\nip flow-cache timeout inactive 10\ninterface GigabitEthernet0/0\n ip address 198.18.10.1\
      \ 255.255.255.0\n no shutdown\n ip flow ingress\n exit\ninterface GigabitEthernet0/1\n ip address\
      \ 198.18.30.1 255.255.255.252\n no shutdown\n exit\nip route 198.18.20.0 255.255.255.0 198.18.30.2\n\
      end\n"
