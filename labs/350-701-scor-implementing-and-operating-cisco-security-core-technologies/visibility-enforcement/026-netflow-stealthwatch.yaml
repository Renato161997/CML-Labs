lab:
  title: NetFlow Security Analytics and Triage
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# NetFlow Security Analytics and Triage


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-701-026-netflow-stealthwatch.md


    The analytics implementation is an explicit local teaching rule, not Cisco Secure Network Analytics/Stealthwatch.
    Real exported TCP records are grouped by the fixed fixture source/destination. Repeated HTTP to one
    port remains below threshold; seven bounded connection attempts to fixture ports10000-10006 must produce
    at least six distinct received destination ports and raise the toy alert. This rule is intentionally
    coarse and does not prove maliciousness. An optional analysis-only suppression must hide the alert
    while the raw observed distinct-port count remains at least six; removing suppression must restore
    the alert. Suppression is not network remediation or deletion of evidence. Four isolated reference
    guests use two IOSv routers and two official Net-Tools endpoints. GW exports real fixed-format NetFlowv5
    over UDP to OUTSIDE through FILTER; only GW ingress from INSIDE is monitored. The bounded collector
    parses actual24-byte headers/48-byte records and accepts the configured exporter source. This is legacy
    IPv4 NetFlowv5, not Flexible NetFlow/IPFIX or a reliable/authenticated transport. Source-IP filtering
    is not cryptographic authentication. Different destination ports8080/8081/8082 identify successive
    phases so old records cannot masquerade as current export recovery. The separate FILTER router applies
    ingress policy to transit export/SLA packets; the test does not assume a router output ACL necessarily
    filters its own locally generated packets. All HTTP services are local plaintext fixtures and all
    addresses are isolated benchmarks. Nominal RAM is2GiB. Wire format: https://www.cisco.com/c/en/us/td/docs/net_mgmt/netflow_collection_engine/3-6/user/guide/format.html
    .


    Objectives:

    - Collect real binary network flows and distinguish repeated service use from distinct-port cardinality.

    - Generate seven bounded fixture TCP attempts and detect their exported distinct destination ports.

    - Demonstrate that an analysis suppression hides the alert without erasing its underlying observations.

    '
