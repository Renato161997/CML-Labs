lab:
  title: Cryptography PKI and VPN Trust Boundaries
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Cryptography PKI and VPN Trust Boundaries


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-701-002-cryptography-pki-ipsec.md


    The PKI portion is an executable local workbench: a private training CA signs real X509 certificates
    with CA constraints, key usage, subject/authority identifiers, SAN and server-auth EKU. Python/OpenSSL
    performs actual TLS chain, validity and hostname verification; configured strings alone cannot pass.
    Each controlled failure is repaired against the same generated CA/service state. IPsec is a comparison
    topic here; its actual data-plane exercises are SCOR009 and ENARSI023, linked separately rather than
    falsely claimed as instantiated in this one-node TLS workbench. One disposable automation-toolbox
    guest contains the server and client processes. Their real TCP/TLS connections are bound to127.0.0.1:8443;
    no external interface, vendor controller, production credential or security product is used. Fresh
    RSA training CA, server and signer keys are generated inside the guest and remain in its protected
    temporary lab state until wipe. The root-owned fixture is inspectable teaching code, not a production
    identity boundary. The tokens are deliberately public exercise-only constants. The image must supply
    Python3, cryptography and OpenSSL through the documented toolbox build. Nominal RAM is1GiB.


    Objectives:

    - Verify a real CA chain and hostname through an actual TLS connection.

    - Distinguish an unrelated trust root, wrong peer identity, untrusted issuer and expired signed X509
    certificate.

    - Restore the same trusted service after every fault and relate PKI trust boundaries to the separately
    implemented IPsec labs.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
