lab:
  title: 'VPN Types: Policy IPsec and Routed VTI'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# VPN Types: Policy IPsec and Routed VTI


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-701-003-site-to-site-vpn-types.md


    Four IOSv guests provide two genuinely separate site-to-site paths in one closed exercise. P1/P2 use
    a crypto map with exact service-loopback selectors on the physical underlay; their actual service
    route selects the peer next hop. V1/V2 use tunnel-mode-ipsec VTI with an IPsec profile and an actual
    service route through Tunnel0. The second pair has distinct underlay, tunnel and service prefixes.
    It does not share routes, bridges or connectors with the first pair. Both pairs must establish actual
    IKE and bidirectional nonzero ESP encapsulation/decapsulation counters using AES256/SHA256/DH14/PFS14;
    a configured string, tunnel-up state or a plain ping cannot pass alone.


    First block only ESP on V2: VTI service packets must fail, the VTI peer underlay/IKE must remain healthy,
    its real ESP deny counter must increase, and the separate policy-based service must still work. Restore
    that filter and require protected data/counters again. Then apply the corresponding ESP-only fault
    to P2: its protected service must fail with healthy underlay/IKE and actual deny matches, while the
    independent VTI service stays usable. Restore the policy pair and recheck both actual routing/encapsulation
    models. This compares traffic selection and failure domains, rather than suggesting that one type
    is universally preferable.


    Nominal RAM is 2048 MiB across four software routers. IKEv1 and the deliberately published classroom
    PSKs are legacy interoperability fixtures, not current production authentication recommendations.
    No remote-access client, NAT traversal, IKEv2, cloud gateway, external connector, hardware throughput
    or production-resilience claim is made. All mutations affect only the imported copy, and all credentials
    are public exercise fixtures. The existing peer/profile configurations and actual-counter probes are
    reused unchanged in meaning from the separately verified policy-IPsec and VTI exercises, with explicit
    label/prefix remapping for this new independent topology. This comparison still requires its own complete
    fresh functional proof.



    Objectives:

    - Compare actual policy-selector IPsec and route-selected native VTI service paths.

    - Measure real IKE/ESP traffic and counters independently on both peer pairs.

    - Isolate an ESP-only failure to one pair, preserve the other pair and recover each protected path.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: P1
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname P1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nno logging console\ncrypto isakmp policy 10\n encr aes 256\n\
      \ hash sha256\n authentication pre-share\n group 14\n lifetime 3600\n exit\ncrypto isakmp key CML-LAB-PSK-only-984\
      \ address 198.18.0.2\ncrypto ipsec transform-set CML-ESP esp-aes 256 esp-sha256-hmac\n mode tunnel\n\
      \ exit\nip access-list extended CML-PROTECTED\n permit ip host 192.0.2.1 host 192.0.2.2\n exit\n\
      crypto map CML-VPN 10 ipsec-isakmp\n set peer 198.18.0.2\n set transform-set CML-ESP\n set pfs group14\n\
      \ match address CML-PROTECTED\n exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n\
      \ no shutdown\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.1 255.255.255.252\n no\
      \ shutdown\n crypto map CML-VPN\n exit\nip route 192.0.2.2 255.255.255.255 198.18.0.2\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
