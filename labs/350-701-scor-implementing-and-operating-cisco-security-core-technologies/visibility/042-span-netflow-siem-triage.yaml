lab:
  title: Independent Packet and Flow Triage
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Independent Packet and Flow Triage


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-701-042-span-netflow-siem-triage.md


    Two IOSv routers, one IOL-L2 switch, two Net-Tools endpoints and an automation capture guest provide
    independent raw-packet and binary NetFlowv5 witnesses. This is an explicit local triage exercise,
    not a deployed SIEM product. Each phase uses a previously unused destination port. The first fault
    changes only SPAN direction: HTTP and NetFlow must continue while packet evidence is absent over a
    full window. Both witnesses are restored before a separate FILTER ingress ACL rejects only exporter
    UDP. During that second fault, HTTP and the actual mirrored GET frame must remain healthy while the
    new flow record stays absent for 40 seconds and the ACL counts exporter drops. Final ACL removal requires
    a fresh 8084 packet and flow record. Nominal RAM is 4 GiB. UDP export is not authenticated or lossless;
    negative findings concern only the selected fixture tuple. The receive-only observer opens an actual
    Linux AFPacket socket in the isolated capture guest, requests promiscuous membership and filters only
    a fixed benchmark HTTP GET tuple. A successful capture requires a real one-frame Ethernet PCAP with
    consistent lengths, tuple and SHA256; a scalar claim without that file is rejected. Negative visibility
    requires the real bound listener to finish the entire 12-second window. This is absence of the selected
    fixture request, not absence of all network traffic. Phase-specific ports prevent old frames from
    satisfying recovery. The parser handles up to two VLAN tags and complete unfragmented IPv4/TCP GET
    packets; it is not a general PCAP/PCAPNG or TCP reassembly analyzer and does not validate transport
    checksums. No packet is transmitted by the observer. All endpoint/switch consoles are opened before
    arming, so console initialization does not consume the observation window. Primary configuration reference:
    https://www.cisco.com/c/en/us/td/docs/IIOT/switches/ie3x00/config/layer2/layer2_switch/g_configuring-span-and-rspan/configure-span-rspan.html
    . IOL-L2 feature support is accepted only if the recorded real-frame gates pass, not from accepted
    CLI text or vendor support inference.


    Objectives:

    - Correlate a real packet witness with real exported binary flow metadata for the same new HTTP service
    port.

    - Break only mirror direction and show that application service and NetFlow remain healthy.

    - Break only export UDP and retain an actual packet witness, then recover both independent visibility
    paths.

    '
