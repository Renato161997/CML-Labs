lab:
  title: SCOR Capstone Secure Edge
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# SCOR Capstone Secure Edge


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-701-045-scor-capstone-secure-edge.md


    An explicit outside ACL permits the chosen outside peer to the firewall8443 address and denies direct
    inside-subnet destinations. Static TCP NAT translates that publication to the inside fixture8080.
    A separate OUTSIDE-IN inspect policy matches the translated inside destination/port. The outside published
    request must succeed while direct inside-address requests fail. First an early outside ACL deny must
    break only the publication and count packets. After recovery, changing the zone classifier to the
    wrong translated port must break the publication while its static NAT mapping and outbound inspected
    service remain present. Restoring the classifier must recover the same published request. These are
    real ACL/NAT/zone stages, with educational addresses and local HTTP endpoints. One IOSv router and
    two official Net-Tools guests exchange real HTTP packets on isolated benchmark subnets. The endpoint
    server reports the peer address it actually observes. Both local servers are independently checked,
    and both guests have explicit routes through the firewall, so a blocked reverse request is not explained
    by a missing route or stopped service. HTTP is deliberately plaintext, including the published8443
    port in the capstone; no TLS or application-security product is implied. Cisco lists IOSv ZBFW as
    a feature that may work rather than an officially supported feature; the recorded result applies only
    to the exact tested image and behavior: https://developer.cisco.com/docs/modeling-labs/iosv/ . Nominal
    RAM is1536MiB. This is virtual software forwarding, not throughput or a vendor-appliance benchmark.


    Objectives:

    - Validate real outbound PAT/inspection and a narrowly published inbound TCP service.

    - Distinguish a pre-NAT ingress ACL fault from a post-NAT zone classification fault.

    - Recover the publication while direct inside-address access stays blocked.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: FW
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname FW\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nno logging console\nzone security INSIDE\nzone security OUTSIDE\n\
      class-map type inspect match-any CLIENT-TRAFFIC\n match protocol tcp\n match protocol icmp\n exit\n\
      policy-map type inspect STATEFUL-OUT\n class type inspect CLIENT-TRAFFIC\n  inspect\n  exit\n class\
      \ class-default\n  drop\n  exit\n exit\npolicy-map type inspect STATELESS-OUT\n class type inspect\
      \ CLIENT-TRAFFIC\n  pass\n  exit\n class class-default\n  drop\n  exit\n exit\nzone-pair security\
      \ INSIDE-OUT source INSIDE destination OUTSIDE\n service-policy type inspect STATEFUL-OUT\n exit\n\
      ip access-list standard INSIDE-NAT\n permit 198.18.10.0 0.0.0.255\n exit\nip nat inside source list\
      \ INSIDE-NAT interface GigabitEthernet0/1 overload\nip access-list extended PUBLIC-WEB\n 10 permit\
      \ tcp host 198.18.20.20 host 198.18.10.10 eq 8080\n exit\nclass-map type inspect match-any PUBLISHED-WEB\n\
      \ match access-group name PUBLIC-WEB\n exit\npolicy-map type inspect PUBLISHED-IN\n class type inspect\
      \ PUBLISHED-WEB\n  inspect\n  exit\n class class-default\n  drop\n  exit\n exit\nzone-pair security\
      \ OUTSIDE-IN source OUTSIDE destination INSIDE\n service-policy type inspect PUBLISHED-IN\n exit\n\
      ip access-list extended WAN-INGRESS\n 10 permit tcp host 198.18.20.20 host 198.18.20.1 eq 8443\n\
      \ 20 deny ip any 198.18.10.0 0.0.0.255\n 30 permit ip any any\n exit\nip nat inside source static\
      \ tcp 198.18.10.10 8080 interface GigabitEthernet0/1 8443\ninterface GigabitEthernet0/0\n ip address\
      \ 198.18.10.1 255.255.255.0\n no shutdown\n zone-member security INSIDE\n ip nat inside\n exit\n\
      interface GigabitEthernet0/1\n ip address 198.18.20.1 255.255.255.0\n no shutdown\n zone-member\
      \ security OUTSIDE\n ip nat outside\n ip access-group WAN-INGRESS in\n exit\nend\n"
