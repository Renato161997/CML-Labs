lab:
  title: Suspicious Host Containment
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Suspicious Host Containment


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-701-041-suspicious-host-containment.md


    Three IOL-XE routers implement a host, enforcement gateway and internal service. The incident signal
    is a stated training decision, not an EDR detection claim. An ingress source-IP containment ACL permits
    only the selected host remediation probe before denying its remaining traffic; unrelated sources retain
    normal policy. A counter and real negative service probe must identify enforcement while remediation
    and the service-side gateway remain healthy. An early permit intentionally bypasses containment, then
    its removal must restore the deny. Finally the ACL is detached and service traffic recovers. This
    is source-IP policy, not device identity, endpoint posture, stateful firewalling or automatic SOC
    integration. Nominal RAM is3GiB.


    Objectives:

    - Separate a simulated incident decision from actual network containment enforcement.

    - Block the selected source while preserving its remediation path and unrelated service connectivity.

    - Expose an incorrectly ordered permit, repair it and roll back containment.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: HOST
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname HOST\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Ethernet0/0\n ip address 198.18.10.10 255.255.255.0\n no shutdown\n exit\nip route\
      \ 0.0.0.0 0.0.0.0 198.18.10.1\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
