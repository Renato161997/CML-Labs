      \ Ethernet0/1\n ip address 198.18.20.1 255.255.255.0\n no shutdown\n exit\ninterface Loopback0\n\
      \ ip address 192.0.2.80 255.255.255.255\n no shutdown\n exit\nip access-list extended CONTAIN-HOST\n\
