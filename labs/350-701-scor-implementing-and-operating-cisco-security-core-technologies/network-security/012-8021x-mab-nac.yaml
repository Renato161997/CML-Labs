lab:
  title: 802.1X MAB NAC
  description: 350-701 SCOR - Implementing and Operating Cisco Security Core Technologies importable CML
    topology.
  notes: '350-701 SCOR blueprint lab: 802.1X MAB NAC


    Topics:

    - 802.1X

    - MAB

    - NAC


    Tasks:

    1. Model access session

    2. Define fallback

    3. Verify port state


    Useful checks:

    - show ip interface brief

    - show running-config

    - show ip route

    - show ip protocols

    - ping and traceroute between endpoints'
  version: 0.3.1
nodes:
- id: n0
  label: SW1
  node_definition: iosvl2
  x: 0
  y: 0
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nno ip domain-lookup\nbanner motd ^C SECCORE-SCOR 802.1X MAB NAC ^C\nvlan 10\n\
      \ name USERS\nvlan 20\n name SERVERS\nvlan 30\n name GUEST\nvlan 99\n name MGMT\ninterface range\
      \ GigabitEthernet0/1-3\n switchport mode access\n spanning-tree portfast\nend"
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  priority: 100
  tags: []
- id: n1
  label: PC1
  node_definition: desktop
  x: -180
  y: 160
  interfaces:
  - id: i0
    label: eth0
    type: physical
    slot: 0
  configuration: []
  priority: 99
  tags: []
- id: n2
  label: PC2
  node_definition: desktop
  x: 180
  y: 160
  interfaces:
  - id: i0
    label: eth0
    type: physical
    slot: 0
  configuration: []
  priority: 98
  tags: []
links:
- id: l0
  n1: n0
  i1: i2
  n2: n1
