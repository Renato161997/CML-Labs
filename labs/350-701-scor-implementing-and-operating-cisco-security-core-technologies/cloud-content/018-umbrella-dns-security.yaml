lab:
  title: 'DNS Security Concepts: Policy, Bypass and Unavailability'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# DNS Security Concepts: Policy, Bypass and Unavailability


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-701-018-umbrella-dns-security.md


    Two isolated automation-toolbox guests exchange actual DNS on UDP and TCP port 53. The native fixture
    uses the header/question/A-record framing from [RFC 1035](https://www.rfc-editor.org/rfc/rfc1035.html);
    the installed independent BIND dig client constructs queries and interprets responses. The server
    never performs recursive queries, contacts an upstream resolver or accepts an arbitrary forwarded
    destination. Its closed hostname profile contains allowed.lab.example and blocked.lab.example, both
    synthetic classroom names. It returns only one fixed benchmark IPv4 address with zero TTL, or the
    explicitly tested error status. Compressed questions, EDNS, extra records, nonstandard opcodes and
    malformed packets are outside this bounded teaching profile and receive FORMERR. Unsupported type/class
    receives NOTIMP; unknown names receive REFUSED. This is not a general DNS server or standards conformance
    suite.


    In enforce mode the allowed name must produce its exact IN A answer and the blocked name must produce
    NXDOMAIN with no answer, independently over UDP and TCP. Deliberately bypassing only the local block
    policy must let that previously blocked name resolve; restoring enforcement must recover denial. A
    controlled unavailable-policy mode returns actual SERVFAIL for both known names while unknown names
    remain REFUSED. SERVFAIL is not a timeout or NXDOMAIN, and no stale successful address is fabricated.
    Restoring the policy must recover legitimate resolution and intentional blocking. This is a local
    response-policy exercise, not a test of Cisco Umbrella, reputation/category intelligence, a commercial
    tenant or a cloud API.


    Independent ICMP and both local and remote HTTP controls must remain healthy through every DNS change.
    In particular, a direct-IP HTTP request still succeeds while name policy blocks the corresponding
    synthetic name. DNS filtering alone is not packet access control: this topology does not force endpoints
    to use the resolver, prevent alternate DNS/DoH or prohibit known-IP access. It makes no phishing,
    malware, browser or TLS-inspection claim. No resolv.conf, host OS DNS, production network, licensed
    vendor image, paid account, real credential or external connector is changed. Wiping the disposable
    copy removes the fixture state and listeners.



    Objectives:

    - Observe real allowed, policy-denied, refused and unsupported DNS responses over both UDP and TCP.

    - Detect deliberate policy bypass and distinguish DNS unavailability from an intentional domain block.

    - Recover filtering with independent IP/service controls and demonstrate the boundary of DNS-only
    enforcement.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
