lab:
  title: IP SLA Tracking
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# IP SLA Tracking


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-024-ip-sla-tracking.md


    Two isolated paths share a remote router. An ingress ACL selectively drops only the primary ICMP echo
    probe while leaving both Ethernet carriers and other traffic intact. This deliberately differs from
    a simple interface-shutdown test: IP SLA must detect a silent reachability failure, remove the tracked
    route and expose the floating route. Recovery removes the ACL attachment and proves both tracker and
    primary forwarding return. No throughput or independent-provider resilience is claimed.


    Objectives:

    - Separate carrier state from measured service reachability.

    - Drop only primary SLA probes without shutting either link and verify tracked-route withdrawal.

    - Preserve payload forwarding on the floating path and restore primary preference.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nno logging console\ninterface Loopback0\n ip address 192.0.2.1\
      \ 255.255.255.255\n no shutdown\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.1 255.255.255.252\n\
      \ no shutdown\n exit\ninterface GigabitEthernet0/1\n ip address 198.18.1.1 255.255.255.252\n no\
      \ shutdown\n exit\nip sla 10\n icmp-echo 198.18.0.2 source-interface GigabitEthernet0/0\n timeout\
      \ 1000\n frequency 3\n exit\nip sla schedule 10 life forever start-time now\ntrack 10 ip sla 10\
      \ reachability\n exit\nip route 192.0.2.2 255.255.255.255 198.18.0.2 track 10\nip route 192.0.2.2\
      \ 255.255.255.255 198.18.1.2 200\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nno logging console\ninterface Loopback0\n ip address 192.0.2.2\
      \ 255.255.255.255\n no shutdown\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.2 255.255.255.252\n\
      \ no shutdown\n exit\ninterface GigabitEthernet0/1\n ip address 198.18.1.2 255.255.255.252\n no\
      \ shutdown\n exit\nip route 192.0.2.1 255.255.255.255 198.18.0.1\nip route 192.0.2.1 255.255.255.255\
      \ 198.18.1.1 200\nip access-list extended DROP-SLA\n deny icmp host 198.18.0.1 host 198.18.0.2 echo\n\
      \ permit ip any any\n exit\nend\n"
  cpu_limit: 100
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
- id: l1
  n1: n0
  i1: i2
  n2: n1
  i2: i2
annotations: []
smart_annotations: []
