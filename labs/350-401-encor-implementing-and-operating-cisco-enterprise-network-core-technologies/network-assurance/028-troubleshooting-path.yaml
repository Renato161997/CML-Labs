lab:
  title: Troubleshooting Path
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Troubleshooting Path


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-028-troubleshooting-path.md


    Three IOL-XE routers form a routed linear path, with loopback endpoints192.0.2.1 and192.0.2.80 and
    separate /30 transport links. Every primary service probe explicitly uses the client loopback source;
    a default egress-interface source would conceal a missing endpoint return route. Removing only the
    service return route must fail that exchange while the first hop and TRANSIT-originated final-hop
    probe stay healthy. A separate transit ACL denies only client-to-service echo requests: reverse-originated
    echo traffic must still complete, intended routes stay installed and the actual deny counter must
    increment. A third fault replaces the client destination route with Null0, while neighboring and final-hop
    controls remain healthy; it is a local forwarding decision, not an application outage. Each distinct
    repair restores sourced traffic and both routes. This is actual isolated packet-path diagnosis, not
    a controller assurance product, Internet reachability or application availability guarantee. Nominal
    RAM is3GiB.


    Objectives:

    - Validate independent source/service traffic, the first and final hop, and explicit routes in both
    directions.

    - Distinguish a missing return route from a directional transit ACL using healthy neighboring and
    reverse-request controls.

    - Diagnose a source Null0 route independently of service health, then restore the complete path.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: EDGE
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname EDGE\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.12.1 255.255.255.252\n no shutdown\n exit\nip route 192.0.2.80\
      \ 255.255.255.255 198.18.12.2\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
