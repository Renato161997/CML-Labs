lab:
  title: ENCOR Capstone Campus Core
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# ENCOR Capstone Campus Core


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-051-encor-capstone-campus-core.md


    Two IOSv gateway routers, one IOL-L2 access switch and a separate IOL-XE service router form a redundant
    campus. ACCESS is an explicitly modeled sourced SVI endpoint, not an independent workstation. Both
    cores advertise the campus /24 through separate OSPF uplinks to SERVICE; its loopback198.19.0.80 is
    a single actual remote endpoint, with a real OSPF return path. HSRP10 supplies the access next hop198.18.10.1,
    on the shared access VLAN. The initial untracked HSRP configuration is deliberately an incomplete
    resilience policy. Making only CORE1 OSPF uplink passive removes that adjacency and service route
    without shutting its physical link or LAN SVI. The virtual IP remains reachable/active on CORE1, the
    access service fails, and CORE2 independently reaches the same service. Attaching the already configured
    route-reachability object with decrement30 must lower CORE1 below the preempting CORE2 and recover
    actual sourced traffic; the access LAN stays operational. Restoring OSPF must recover the tracked
    route and preferred HSRP ownership. This proves prefix tracking and control-plane failure recovery,
    not IP SLA application probes, BFD, physical failure timing or stateful application continuity. Nominal
    RAM is3GiB.


    Objectives:

    - Correlate the access LAN, HSRP active gateway, OSPF service routes and actual access-SVI traffic.

    - Lose only the active core OSPF adjacency while its LAN carrier and virtual gateway stay healthy;
    prove untracked HSRP does not repair upstream routing loss.

    - Apply real route-object tracking to transfer the first hop to the healthy core, then recover OSPF
    and preferred ownership.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: CORE1
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname CORE1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.10.2 255.255.255.0\n\
      \ no shutdown\n standby version 2\n standby 10 ip 198.18.10.1\n standby 10 priority 110\n standby\
      \ 10 preempt\n exit\ninterface GigabitEthernet0/1\n ip address 198.18.12.1 255.255.255.252\n no\
      \ shutdown\n ip ospf hello-interval 2\n ip ospf dead-interval 8\n exit\nrouter ospf 1\n router-id\
      \ 192.0.2.1\n passive-interface default\n no passive-interface GigabitEthernet0/1\n network 198.18.12.0\
      \ 0.0.0.3 area 0\n network 198.18.10.0 0.0.0.255 area 0\n exit\ntrack 1 ip route 198.19.0.80 255.255.255.255\
      \ reachability\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: CORE2
