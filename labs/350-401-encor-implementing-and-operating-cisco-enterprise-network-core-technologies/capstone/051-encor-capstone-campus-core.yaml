      \ switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n no shutdown\n exit\n\
      interface Ethernet0/1\n switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n\
      \ no shutdown\n exit\ninterface Vlan10\n ip address 198.18.10.10 255.255.255.0\n no shutdown\n exit\n\
      ip route 198.19.0.80 255.255.255.255 198.18.10.1\nend\n"
  cpu_limit: 100
