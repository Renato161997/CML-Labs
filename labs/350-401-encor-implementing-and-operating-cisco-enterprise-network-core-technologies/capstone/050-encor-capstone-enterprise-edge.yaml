lab:
  title: ENCOR Capstone Enterprise Edge
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# ENCOR Capstone Enterprise Edge


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-050-encor-capstone-enterprise-edge.md


    Three IOL-XE routers form a dual-provider eBGP edge. EDGE advertises only192.0.2.1/32; each separate
    provider advertises only192.0.2.80/32 and owns an equivalent isolated loopback endpoint. Local preference200
    vs100 selects ISP1. Actual edge requests explicitly source Loopback0, so provider return learning
    is required. Fresh per-provider ingress ACL counters identify the request path: the selected receiver
    must count packets and the other must have no selected echo-request matches, independently of route
    text or successful ping. Withdrawing ISP1 service origination must move forwarding to ISP2 while the
    alternate session remains healthy. Restoring the advertisement must reselect ISP1. A deliberate ISP2
    local-preference250 error, applied with inbound soft refresh, must move traffic to ISP2 despite both
    sessions being up; restoring100 must restore intended forwarding. The equal service loopbacks model
    an anycast-style equivalent endpoint, not preservation of a stateful application. No Internet, physical
    provider, RPKI, BFD, WAN encryption or production firewall is instantiated. Nominal RAM is3GiB.


    Objectives:

    - Verify both real eBGP sessions, per-provider prefix controls, preferred installed route and actual
    receiver-side packet path.

    - Withdraw only the preferred service advertisement and prove continued traffic through the alternate
    provider.

    - Recover the advertisement, introduce a local-preference mistake with both sessions healthy, and
    restore the intended provider path.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: EDGE
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname EDGE\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.1.1 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/1\n\
      \ ip address 198.18.2.1 255.255.255.252\n no shutdown\n exit\nip prefix-list EDGE-ONLY permit 192.0.2.1/32\n\
      route-map ISP1-IN permit 10\n set local-preference 200\n exit\nroute-map ISP2-IN permit 10\n set\
      \ local-preference 100\n exit\nrouter bgp 65001\n bgp router-id 192.0.2.1\n network 192.0.2.1 mask\
      \ 255.255.255.255\n neighbor 198.18.1.2 remote-as 65002\n neighbor 198.18.1.2 timers 3 9\n neighbor\
      \ 198.18.1.2 route-map ISP1-IN in\n neighbor 198.18.1.2 prefix-list EDGE-ONLY out\n neighbor 198.18.2.2\
      \ remote-as 65003\n neighbor 198.18.2.2 timers 3 9\n neighbor 198.18.2.2 route-map ISP2-IN in\n\
      \ neighbor 198.18.2.2 prefix-list EDGE-ONLY out\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: ISP1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname ISP1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.80 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.1.2 255.255.255.252\n no shutdown\n ip access-group PATH-MEASURE\
      \ in\n exit\nip access-list extended PATH-MEASURE\n permit icmp host 192.0.2.1 host 192.0.2.80 echo\n\
      \ permit ip any any\n exit\nip prefix-list SERVICE-ONLY permit 192.0.2.80/32\nrouter bgp 65002\n\
      \ bgp router-id 203.0.113.1\n network 192.0.2.80 mask 255.255.255.255\n neighbor 198.18.1.1 remote-as\
      \ 65001\n neighbor 198.18.1.1 timers 3 9\n neighbor 198.18.1.1 prefix-list SERVICE-ONLY out\n exit\n\
      end\n"
  cpu_limit: 100
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n2
  label: ISP2
