lab:
  title: EIGRP Named Mode
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# EIGRP Named Mode


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-015-eigrp-named-mode.md


    Two IOL-XE nodes run named EIGRP CAMPUS with IPv4 AS100. Default interfaces are passive; only the
    transit AF-interface sends hellos. The fault changes the AF-interface on R2, not the link or AS number.
    Peer state, installed RIB entries and real source-loopback probes are all checked. This is a single
    address-family exercise, not proof of IPv6 or multi-VRF EIGRP behavior.


    Objectives:

    - Trace the named process, IPv4 address family, topology base and interface submode.

    - Make only the transit AF-interface passive and observe the lost peer and route.

    - Restore the adjacency and forwarding without changing the endpoint addresses.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\nrouter eigrp CAMPUS\n\
      \ address-family ipv4 unicast autonomous-system 100\n  network 198.18.0.0 0.0.0.3\n  network 192.0.2.1\
      \ 0.0.0.0\n  af-interface default\n   passive-interface\n  exit-af-interface\n  af-interface Ethernet0/0\n\
      \   no passive-interface\n   hello-interval 2\n   hold-time 6\n  exit-af-interface\n  topology base\n\
      \   no auto-summary\n  exit-af-topology\n exit-address-family\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.2 255.255.255.252\n no shutdown\n exit\nrouter eigrp CAMPUS\n\
      \ address-family ipv4 unicast autonomous-system 100\n  network 198.18.0.0 0.0.0.3\n  network 192.0.2.2\
      \ 0.0.0.0\n  af-interface default\n   passive-interface\n  exit-af-interface\n  af-interface Ethernet0/0\n\
      \   no passive-interface\n   hello-interval 2\n   hold-time 6\n  exit-af-interface\n  topology base\n\
      \   no auto-summary\n  exit-af-topology\n exit-address-family\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
annotations: []
smart_annotations: []
