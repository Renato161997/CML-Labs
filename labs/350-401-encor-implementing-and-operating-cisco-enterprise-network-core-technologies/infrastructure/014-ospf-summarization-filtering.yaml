lab:
  title: OSPF Summarization Filtering
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# OSPF Summarization Filtering


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-014-ospf-summarization-filtering.md


    Three IOL-XE nodes model areas0 and10 with R2 as the ABR. Two host routes are represented by192.0.2.0/24.
    An outbound area prefix-list denies that range and its more-specifics while permitting other inter-area
    prefixes. Positive controls distinguish selective Type3 export from a failed adjacency or lost transit
    link. The route table and real endpoint probes are checked; this is not a convergence-time benchmark.


    Objectives:

    - Inspect an actual inter-area aggregate and forward to both represented endpoints.

    - Filter only the endpoint aggregate/member set at the ABR area boundary.

    - Prove that transit reachability and intra-area endpoint routes remain healthy, then restore export.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 203.0.113.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.12.1 255.255.255.252\n no shutdown\n exit\nrouter ospf 1\n router-id\
      \ 203.0.113.1\n passive-interface Loopback0\n network 198.18.12.0 0.0.0.3 area 0\n network 203.0.113.1\
      \ 0.0.0.0 area 0\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 203.0.113.2 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.12.2 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/1\n\
      \ ip address 198.18.23.1 255.255.255.252\n no shutdown\n exit\nrouter ospf 1\n router-id 203.0.113.2\n\
      \ passive-interface Loopback0\n network 198.18.12.0 0.0.0.3 area 0\n network 198.18.23.0 0.0.0.3\
      \ area 10\n network 203.0.113.2 0.0.0.0 area 0\n area 10 range 192.0.2.0 255.255.255.0 advertise\n\
      \ exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n2
  label: R3
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R3\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Loopback1\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n exit\ninterface Ethernet0/0\n\
      \ ip address 198.18.23.2 255.255.255.252\n no shutdown\n exit\nrouter ospf 1\n router-id 203.0.113.3\n\
      \ passive-interface Loopback0\n network 198.18.23.0 0.0.0.3 area 10\n network 192.0.2.0 0.0.0.3\
      \ area 10\n exit\nend\n"
  cpu_limit: 50
  priority: 98
  x: 520
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
