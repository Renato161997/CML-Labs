      \ Ethernet0/0\n ip address 198.18.23.2 255.255.255.252\n no shutdown\n exit\nrouter eigrp 100\n\
      \ no auto-summary\n network 198.18.23.0 0.0.0.3\n network 192.0.2.3 0.0.0.0\n passive-interface\
      \ Loopback0\n exit\nend\n"
  cpu_limit: 50
