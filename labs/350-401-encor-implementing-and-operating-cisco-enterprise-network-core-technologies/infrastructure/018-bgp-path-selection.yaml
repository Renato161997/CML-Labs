lab:
  title: BGP Path Selection
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# BGP Path Selection


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-018-bgp-path-selection.md


    Two IOL-XE routers use independent eBGP links A and B. The higher local preference on R1 initially
    selects B; adding two prepends makes that AS_PATH longer without changing its local preference. Fresh
    R2 ACL request counters identify the chosen ingress link, so successful pings cannot hide a policy
    change. Reply paths can be asymmetric. Default weights/origin/MED are unchanged; this demonstrates
    the listed best-path ordering, not all BGP tie-breakers or multipath throughput.


    Objectives:

    - Observe a higher-local-preference best path and its real request ingress port.

    - Prepend the same external AS on B and prove that local preference still wins.

    - Equalize local preference, verify the shorter A path in both RIB and fresh counters, and restore
    the original preference.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/1\n\
      \ ip address 198.18.1.1 255.255.255.252\n no shutdown\n exit\nroute-map PREFER-B permit 10\n set\
      \ local-preference 200\n exit\nrouter bgp 65001\n bgp router-id 192.0.2.1\n network 192.0.2.1 mask\
      \ 255.255.255.255\n neighbor 198.18.0.2 remote-as 65002\n neighbor 198.18.1.2 remote-as 65002\n\
      \ neighbor 198.18.1.2 route-map PREFER-B in\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.2 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/1\n\
      \ ip address 198.18.1.2 255.255.255.252\n no shutdown\n exit\nip access-list extended AD-PRIMARY\n\
      \ permit icmp host 192.0.2.1 host 192.0.2.2\n permit ip any any\n exit\ninterface Ethernet0/0\n\
      \ ip access-group AD-PRIMARY in\n exit\nip access-list extended AD-SECONDARY\n permit icmp host\
      \ 192.0.2.1 host 192.0.2.2\n permit ip any any\n exit\ninterface Ethernet0/1\n ip access-group AD-SECONDARY\
      \ in\n exit\nrouter bgp 65002\n bgp router-id 192.0.2.2\n network 192.0.2.2 mask 255.255.255.255\n\
      \ neighbor 198.18.0.1 remote-as 65001\n neighbor 198.18.1.1 remote-as 65001\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
- id: l1
  n1: n0
  i1: i2
  n2: n1
  i2: i2
annotations: []
smart_annotations: []
