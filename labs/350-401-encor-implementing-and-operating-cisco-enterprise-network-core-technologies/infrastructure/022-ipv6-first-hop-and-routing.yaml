lab:
  title: IPv6 First Hop And Routing
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# IPv6 First Hop And Routing


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-022-ipv6-first-hop-and-routing.md


    Three IOL-XE reference nodes integrate an actual SLAAC client and RA-derived default with a two-router
    OSPFv3 path. The CLIENT model is an IOS router configured with ipv6 address autoconfig default and
    no manually configured global address or default route. RA transmissions from CLIENT are suppressed.
    R1 advertises the LAN prefix and a30-second default-router lifetime every5seconds. IPv4-format OSPF
    router IDs are identifiers; no data interface is assigned an IPv4 address. A zero RA lifetime must
    remove the client default while its global address and local gateway remain usable and R1 still reaches
    R2. A separate transit-area mismatch must remove the service OSPF route while the client ND default
    and local gateway remain. This does not claim a particular desktop OS or physical first-hop security
    implementation. Nominal RAM is3GiB. Command background: https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipv6/command/ipv6-cr-book/ipv6-i1.html
    .


    Objectives:

    - Verify a real SLAAC prefix, an ND-derived default and a separate OSPFv3 service route.

    - Withdraw RA default-router lifetime while preserving on-link ND and upstream routing.

    - Break the transit OSPF area and distinguish that failure from a healthy first hop.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\nipv6 unicast-routing\nipv6 router ospf 10\n router-id 192.0.2.1\n passive-interface Ethernet0/0\n\
      \ exit\ninterface Ethernet0/1\n no ip address\n ipv6 address 2001:db8:12::1/64\n no shutdown\n ipv6\
      \ address fe80::b link-local\n ipv6 ospf 10 area 0\n ipv6 ospf hello-interval 2\n ipv6 ospf dead-interval\
      \ 8\n exit\ninterface Ethernet0/0\n no ip address\n ipv6 address 2001:db8:10::1/64\n no shutdown\n\
      \ ipv6 address fe80::1 link-local\n ipv6 nd ra interval 5\n ipv6 nd ra lifetime 30\n ipv6 ospf 10\
      \ area 0\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
