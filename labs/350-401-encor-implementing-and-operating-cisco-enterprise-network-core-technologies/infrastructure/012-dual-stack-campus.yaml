lab:
  title: Dual Stack Campus
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Dual Stack Campus


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-012-dual-stack-campus.md


    Three IOL reference nodes form a dual-stack routed campus. Documentation IPv6 prefixes and benchmark
    IPv4 addresses are used. Router images act as observable endpoints and have explicit IPv4/IPv6 default
    routes. The fault is a global IPv6 forwarding change on CORE; it does not shut a physical link or
    claim to model wireless or FHRP.


    Objectives:

    - Verify independent IPv4 and IPv6 forwarding between real VLAN endpoints.

    - Disable only IPv6 forwarding and distinguish a responding gateway from a working routed path.

    - Restore IPv6 while checking that IPv4 remained available.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: CORE
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname CORE\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nip routing\nvlan 10\n name USERS\n exit\nvlan 20\n name\
      \ SERVICES\n exit\nipv6 unicast-routing\ninterface Vlan10\n ip address 198.18.10.1 255.255.255.0\n\
      \ no shutdown\n ipv6 enable\n ipv6 address 2001:db8:10::1/64\n exit\ninterface Vlan20\n ip address\
      \ 198.18.20.1 255.255.255.0\n no shutdown\n ipv6 enable\n ipv6 address 2001:db8:20::1/64\n exit\n\
      interface Ethernet0/0\n switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n\
      \ no shutdown\n exit\ninterface Ethernet0/1\n switchport mode access\n switchport access vlan 20\n\
      \ spanning-tree portfast\n no shutdown\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
