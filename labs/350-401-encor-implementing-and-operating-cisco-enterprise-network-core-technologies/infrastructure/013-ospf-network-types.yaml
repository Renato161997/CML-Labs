lab:
  title: OSPF Network Types
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# OSPF Network Types


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-013-ospf-network-types.md


    Two IOL-XE routers use a shared Ethernet segment. Broadcast and point-to-point OSPF modes are compared
    on the same endpoints. An intermediate one-sided conversion checks only the changed local network
    type; it does not assume that mismatched network types always prevent adjacency. Matching final configurations
    must establish FULL adjacency and route loopback traffic. Election timing and physical failure convergence
    are outside scope.


    Objectives:

    - Observe broadcast adjacency roles and a real routed endpoint path.

    - Convert both ends to point-to-point and inspect the changed operational role.

    - Restore broadcast mode and verify adjacency and forwarding.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\nrouter ospf 1\n router-id\
      \ 192.0.2.1\n network 192.0.2.1 0.0.0.0 area 0\n network 198.18.0.0 0.0.0.3 area 0\n passive-interface\
      \ Loopback0\n exit\ninterface Ethernet0/0\n ip ospf hello-interval 2\n ip ospf dead-interval 8\n\
      \ exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.2 255.255.255.252\n no shutdown\n exit\nrouter ospf 1\n router-id\
      \ 192.0.2.2\n network 192.0.2.2 0.0.0.0 area 0\n network 198.18.0.0 0.0.0.3 area 0\n passive-interface\
      \ Loopback0\n exit\ninterface Ethernet0/0\n ip ospf hello-interval 2\n ip ospf dead-interval 8\n\
      \ exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
annotations: []
smart_annotations: []
