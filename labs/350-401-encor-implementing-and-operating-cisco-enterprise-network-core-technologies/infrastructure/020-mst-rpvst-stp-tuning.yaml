lab:
  title: MST RPVST STP Tuning
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# MST RPVST STP Tuning


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-020-mst-rpvst-stp-tuning.md


    Two IOL-L2 switches form one region with VLAN 10 in MST1 and VLAN 20 in MST2. The conversion is staged
    across both peers; intermediate steps verify configuration, not convergence or lossless interoperability.
    Final acceptance checks the actual roots and both VLAN data paths. This small topology teaches root/instance
    control, not redundant-path failure timing.


    Objectives:

    - Inspect a common MST region with distinct VLAN-to-instance mappings and roots.

    - Convert both peers to Rapid-PVST and establish the intended per-VLAN roots.

    - Restore MST and verify both instance roots and tagged VLAN traffic.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: SW1
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nvlan 10\n exit\nvlan 20\n exit\nspanning-tree mst configuration\n\
      \ name CMLREGION\n revision 1\n instance 1 vlan 10\n instance 2 vlan 20\n exit\nspanning-tree mode\
      \ mst\nspanning-tree mst 1 priority 4096\ninterface Ethernet0/0\n switchport trunk encapsulation\
      \ dot1q\n switchport mode trunk\n switchport trunk allowed vlan 10,20\n no shutdown\n exit\ninterface\
      \ Vlan10\n ip address 192.0.2.1 255.255.255.0\n no shutdown\n exit\ninterface Vlan20\n ip address\
      \ 198.51.100.1 255.255.255.0\n no shutdown\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: SW2
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname SW2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nvlan 10\n exit\nvlan 20\n exit\nspanning-tree mst configuration\n\
      \ name CMLREGION\n revision 1\n instance 1 vlan 10\n instance 2 vlan 20\n exit\nspanning-tree mode\
      \ mst\nspanning-tree mst 2 priority 4096\ninterface Ethernet0/0\n switchport trunk encapsulation\
      \ dot1q\n switchport mode trunk\n switchport trunk allowed vlan 10,20\n no shutdown\n exit\ninterface\
      \ Vlan10\n ip address 192.0.2.2 255.255.255.0\n no shutdown\n exit\ninterface Vlan20\n ip address\
      \ 198.51.100.2 255.255.255.0\n no shutdown\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
annotations: []
smart_annotations: []
