lab:
  title: LACP PAgP EtherChannel
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# LACP PAgP EtherChannel


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-021-lacp-pagp-etherchannel.md


    Two IOL-L2 reference switches use two physical members. Each protocol conversion removes the old memberships
    and logical interface before recreating the bundle, avoiding an invalid mixed-protocol configuration.
    An intermediate mismatch is checked as non-bundled; no particular traffic outcome is claimed for standalone/suspended
    members. The complete matching configurations must negotiate and forward before the stage passes.
    No aggregated-throughput claim is made.


    Objectives:

    - Verify an actual desirable/auto PAgP bundle and its data path.

    - Convert both peers to active/passive LACP, explicitly observing the protocol mismatch between stages.

    - Restore PAgP and verify both members and forwarding.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: SW1
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nvlan 10\n exit\ninterface Ethernet0/0\n switchport trunk\
      \ encapsulation dot1q\n switchport mode trunk\n switchport trunk allowed vlan 10,20\n no shutdown\n\
      \ exit\ninterface Ethernet0/0\n channel-protocol pagp\n channel-group 1 mode desirable\n exit\n\
      interface Ethernet0/1\n switchport trunk encapsulation dot1q\n switchport mode trunk\n switchport\
      \ trunk allowed vlan 10,20\n no shutdown\n exit\ninterface Ethernet0/1\n channel-protocol pagp\n\
      \ channel-group 1 mode desirable\n exit\ninterface Port-channel1\n switchport trunk encapsulation\
      \ dot1q\n switchport mode trunk\n switchport trunk allowed vlan 10,20\n no shutdown\n exit\ninterface\
      \ Vlan10\n ip address 192.0.2.1 255.255.255.0\n no shutdown\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: SW2
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname SW2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nvlan 10\n exit\ninterface Ethernet0/0\n switchport trunk\
      \ encapsulation dot1q\n switchport mode trunk\n switchport trunk allowed vlan 10,20\n no shutdown\n\
      \ exit\ninterface Ethernet0/0\n channel-protocol pagp\n channel-group 1 mode auto\n exit\ninterface\
      \ Ethernet0/1\n switchport trunk encapsulation dot1q\n switchport mode trunk\n switchport trunk\
      \ allowed vlan 10,20\n no shutdown\n exit\ninterface Ethernet0/1\n channel-protocol pagp\n channel-group\
      \ 1 mode auto\n exit\ninterface Port-channel1\n switchport trunk encapsulation dot1q\n switchport\
      \ mode trunk\n switchport trunk allowed vlan 10,20\n no shutdown\n exit\ninterface Vlan10\n ip address\
      \ 192.0.2.2 255.255.255.0\n no shutdown\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
