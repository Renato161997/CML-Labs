lab:
  title: eBGP And iBGP Basics
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# eBGP And iBGP Basics


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-017-ebgp-ibgp-basics.md


    Three IOL-XE routers form AS65001 and AS65002. R1 has no route to the external transit subnet, so
    preserving R3 next-hop on the internal advertisement makes its received endpoint path inaccessible.
    Route reception alone is insufficient: the RIB and actual source-loopback traffic must both work.
    Soft outbound refresh is explicit; no TCP session reset or full Internet table is modeled.


    Objectives:

    - Follow the same endpoint routes across an internal and external BGP session.

    - Withdraw next-hop-self without resetting either session and inspect a received but unusable path.

    - Restore the next hop and the actual end-to-end flow.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.12.1 255.255.255.252\n no shutdown\n exit\nrouter bgp 65001\n\
      \ bgp router-id 192.0.2.1\n network 192.0.2.1 mask 255.255.255.255\n neighbor 198.18.12.2 remote-as\
      \ 65001\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iol-xe
  configuration:
