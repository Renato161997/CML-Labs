      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.12.2 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/1\n\
      \ ip address 198.18.23.1 255.255.255.252\n no shutdown\n exit\nrouter bgp 65001\n bgp router-id\
      \ 192.0.2.2\n neighbor 198.18.12.1 remote-as 65001\n neighbor 198.18.12.1 next-hop-self\n neighbor\
      \ 198.18.23.2 remote-as 65002\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
