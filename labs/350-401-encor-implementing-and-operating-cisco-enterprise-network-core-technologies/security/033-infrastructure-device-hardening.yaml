lab:
  title: 'Infrastructure Hardening: AAA, Accounting and VTY Policy'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Infrastructure Hardening: AAA, Accounting and VTY Policy


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-033-infrastructure-device-hardening.md


    A real IOL-XE SSH server authenticates viewer sessions against separate native FreeRADIUS and tac_plus
    services. CLIENT uses actual OpenSSH, not a mocked authentication API. The public viewer credential
    starts at privilege1 and cannot enter configuration mode. There is no local viewer account and no
    local/if-authenticated fallback in the network method lists. The serial console deliberately remains
    unauthenticated and privileged so the owner can repair the disposable exercise. Both services emit
    actual exec accounting: evidence requires fresh viewer Start/Stop records sharing a session ID, with
    owned logs truncated immediately before each test session. Truncation preserves existing ownership/mode
    and never creates a substitute file. Repeated log copies are not extra sessions. Shell command accounting
    and commercial Cisco ISE are not claimed.


    NAS front Ethernet0/0 is 198.18.0.1, RADIUS Ethernet0/1 is 198.18.1.1 and TACACS+ Ethernet0/2 is 198.18.2.1.
    Only declared data links are wired; native eth0 management is unwired. FreeRADIUS allowlists the single
    NAS source and requires Message-Authenticator for Access-Request authentication. The RAD-GROUP authentication
    method retains send-ma and validate-ma; a separate RAD-ACCT group sends legacy accounting with its
    normal Request Authenticator. Sending MA from the initial combined IOL group caused accounting packets
    to be rejected with an invalid-Message-Authenticator diagnostic in this tested image combination.
    The accepted separation must produce actual correlated Start/Stop records; authentication password
    logging is disabled. Teaching shared keys and passwords are public isolated fixtures. RADIUS is not
    RadSec, and this legacy TACACS+ interoperability fixture is not a modern secure transport recommendation.
    Ephemeral RSA3072 identity and accept-new per-instance client trust are classroom initialization only;
    changed host identities are rejected. No external credentials or Internet connection is used. A wrong
    TACACS+ key must cause actual SSH authentication denial while TCP22 and independent IP paths remain
    healthy, followed by recovered sessions and fresh accounting. Stop/wipe only this imported copy to
    reset. The hardening variant adds a separately routed untrusted client on Ethernet0/3. Removing only
    the VTY source binding must admit its actual privilege1 session; restoring the binding must reject
    its transport while the authorized client still works.


    Objectives:

    - Use real centrally authenticated SSH sessions with least-privilege checks.

    - Correlate fresh exec accounting Start/Stop by session identifier for both server types.

    - Break one shared-key relationship, observe correct-credential rejection and recover.

    - Withdraw and restore only VTY source admission with two real clients.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\ninterface\
      \ Ethernet0/1\n ip address 198.18.1.1 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/2\n\
      \ ip address 198.18.2.1 255.255.255.252\n no shutdown\n exit\naaa new-model\naaa authentication\
      \ login CONSOLE none\nline console 0\n login authentication CONSOLE\n privilege level 15\n exit\n\
      ip radius source-interface Ethernet0/1\nip tacacs source-interface Ethernet0/2\nradius server LAB-RADIUS\n\
      \ address ipv4 198.18.1.2 auth-port 1812 acct-port 1813\n timeout 2\n retransmit 0\n key 0 Cml-Radius-Lab-Only-983\n\
      \ exit\ntacacs server LAB-TACACS\n address ipv4 198.18.2.2\n timeout 2\n key 0 Cml-Tacacs-Lab-Only-983\n\
      \ exit\naaa group server radius RAD-GROUP\n server name LAB-RADIUS\n send-ma\n validate-ma\n exit\n\
      aaa group server tacacs+ TAC-GROUP\n server name LAB-TACACS\n exit\naaa group server radius RAD-ACCT\n\
      \ server name LAB-RADIUS\n no send-ma\n exit\naaa authentication login VTY-RAD group RAD-GROUP\n\
      aaa authorization exec VTY-RAD group RAD-GROUP\naaa accounting exec VTY-RAD start-stop group RAD-ACCT\n\
      aaa authentication login VTY-TAC group TAC-GROUP\naaa authorization exec VTY-TAC group TAC-GROUP\n\
      aaa accounting exec VTY-TAC start-stop group TAC-GROUP\nno logging console\nip domain name lab.example\n\
      ip ssh version 2\nip ssh time-out 5\nip ssh authentication-retries 1\nno ip http server\nno ip http\
      \ secure-server\nbanner motd ^CML-SSH-LAB^\nip access-list standard MGMT\n permit host 198.18.0.2\n\
      \ deny any\n exit\nline vty 0 4\n transport input ssh\n login authentication VTY-RAD\n authorization\
      \ exec VTY-RAD\n accounting exec VTY-RAD\n access-class MGMT in\n exit\ninterface Ethernet0/3\n\
      \ ip address 198.18.3.1 255.255.255.252\n no shutdown\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
  ram: 1024
  cpus: 1
- id: n1
  label: RADIUS
  node_definition: radius
  configuration:
  - name: radiusd.conf
    content: "# Basic freeRADIUS onfiguration\n\nprefix = /usr\nexec_prefix = /usr\nsysconfdir = /etc\n\
      localstatedir = /var\nsbindir = ${exec_prefix}/sbin\nlogdir = /var/log/freeradius\nraddbdir = /etc/freeradius/3.0\n\
      radacctdir = ${logdir}/radacct\nname = freeradius\nconfdir = ${raddbdir}\nmodconfdir = ${confdir}/mods-config\n\
      certdir = ${confdir}/certs\ncadir   = ${confdir}/certs\nrun_dir = ${localstatedir}/run/${name}\n\
      db_dir = ${raddbdir}\nlibdir = /usr/lib/freeradius\npidfile = ${run_dir}/${name}.pid\nmax_request_time\
      \ = 30\ncleanup_delay = 5\nmax_requests = 16384\nhostname_lookups = no\n\nlog {\n    destination\
      \ = syslog\n    colourise = no\n    file = ${logdir}/radius.log\n    syslog_facility = daemon\n\
      \    stripped_names = no\n    auth = yes\n    auth_reject = yes\n    auth_badpass = no\n    auth_goodpass\
      \ = no\n    msg_denied = \"You are already logged in - access denied\"\n}\n\ncheckrad = ${sbindir}/checkrad\n\
      \n#ENV {\n#}\n\nsecurity {\n    user = freerad\n    group = freerad\n    allow_core_dumps = no\n\
      \    max_attributes = 200\n    reject_delay = 1\n    status_server = yes\n}\n\nproxy_requests =\
      \ no\n#$INCLUDE proxy.conf\n\n#$INCLUDE clients.conf\nclient all-devices {\n    ipaddr = 198.18.1.1/32\n\
      \    secret = Cml-Radius-Lab-Only-983\n    require_message_authenticator = yes\n    nas_type = cisco\n\
      }\n\nthread pool {\n    start_servers = 5\n    max_servers = 32\n    min_spare_servers = 3\n   \
      \ max_spare_servers = 10\n    max_requests_per_server = 0\n    auto_limit_acct = no\n}\n\nmodules\
      \ {\n    $INCLUDE mods-enabled/\n}\n\n#instantiate {\n#}\n\npolicy {\n    $INCLUDE policy.d/\n}\n\
      \n$INCLUDE sites-enabled/"
  - name: users
    content: "viewer Cleartext-Password := \"CML-LAB-ONLY\"\n    Service-Type = NAS-Prompt-User,\n   \
