lab:
  title: 'Software First-Hop: DHCP Bindings, ARP and Source Inspection'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Software First-Hop: DHCP Bindings, ARP and Source Inspection


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-034-dhcp-snooping-dai-ipsg.md


    This is a bounded software first-hop inspection exercise on three native Services guests, not Cisco
    DHCP-snooping/DAI/IPSG CLI, switch ASIC validation or a full DHCP client/server implementation. Four
    previous Cisco reference-image trials did not establish the required IPSG behavior; this alternative
    explicitly changes the implementation under test. CLIENT eth1 -> GUARD eth1/eth2 -> SERVER eth1 is
    the only data path. A separate CLIENT eth2/GUARD eth3 control link has an independently verified unreachable
    route to the data subnet. GUARD has no data IPv4 address or kernel bridge; a live raw-Ethernet worker
    forwards only admitted frames. No external connector, host sysctl changes, new capabilities or production
    network are used.


    The narrow selecting DORA profile follows the packet layout and message/options definitions in [RFC
    2131](https://www.rfc-editor.org/rfc/rfc2131) and [RFC 2132](https://www.rfc-editor.org/rfc/rfc2132).
    Independent tcpdump decoding must recognize constructed Discover, Offer, Request and ACK packets without
    a bad IPv4 checksum. The live client then actually transmits and receives these messages over the
    inspected links with a fresh transaction nonce. Only a correctly sequenced ACK from the physically
    trusted ingress installs the fixed client''s MAC/IP/ingress/lease binding. The helper assigns its
    kernel IPv4 address only after receiving that ACK. Configuring a binding string or matching the parser
    to its own constructor is insufficient acceptance.


    The untrusted client injects syntactically valid rogue server ACKs and coherent ARP replies with a
    spoofed sender MAC. Fresh inspector counters must show their rejection; SERVER''s actual neighbor
    entry must retain the admitted client MAC and legitimate data must still work. Assigning an additional
    real kernel source IP must yield zero of three data replies; removing only that secondary address
    must preserve the original address and recover two consecutive complete three-reply trains within
    the fixed recovery deadline. Incomplete ping output or late recovery fails.


    The trusted server next offers an actual three-second lease. After the client receives it, the inspector
    must expire its learned binding and reject data even while the deliberately stale client retains its
    address. This tests inspector lease enforcement, not automatic operating-system lease removal or renewal.
    A fresh 600-second DORA exchange must relearn admission and restore real packets. The separate control
    link and local SERVER HTTP listener remain positive controls. The temporary control-path host route
    must not bypass inspection, and its removal must restore the normal path.


    Scope is one fixed client and server, untagged non-fragmented IPv4, Ethernet/IPv4 checksums and the
    explicitly supported DHCP options. Relay, renew/rebind, general broadcast discovery, IPv6, VLAN tags
    and fragmented packets are unsupported; malformed/unsupported untrusted traffic fails closed. This
    fixture is not a standards conformance suite, throughput benchmark, production gateway or protection
    against a compromised trusted server. Cloning the admitted MAC and IP on the same permitted ingress
    is outside its identity assurance. All state and processes disappear with the disposable copy.



    Objectives:

    - Learn a software first-hop binding only from a real correctly sequenced trusted DHCP ACK.

    - Reject rogue server messages, forged ARP senders and unauthorized IPv4 sources while preserving
    legitimate traffic.

    - Expire an observed wire lease, distinguish stale addressing from admission and recover through a
    new exchange.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
