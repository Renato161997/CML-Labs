lab:
  title: Control Plane Policing
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Control Plane Policing


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-031-control-plane-policing.md


    Only INSIDE echo requests to the router loopback match CPU-SOURCES. Attaching COPP-GUARD must drop
    those requests and count real selected packets while OUTSIDE router-local ICMP and INSIDE-to-OUTSIDE
    HTTP still succeed. Removing the policy must recover the same source probe. One IOSv router and two
    official Net-Tools guests separate router-local ICMP from actual transit HTTP. The selector ACL is
    used by an MQC control-plane policy, not applied as an interface ACL. For a deterministic enforcement
    demonstration, both conforming and exceeding selected packets are dropped at8000bps; this is not a
    throughput or burst-capacity benchmark. A directly tested trusted source and transit application remain
    healthy. IOSv QoS/CoPP behavior is experimental and the evidence applies only to the exact tested
    image; no production CPU-offload or hardware-rate claim is made. All addresses and plaintext HTTP
    endpoints are isolated fixtures. Nominal RAM is1536MiB.


    Objectives:

    - Identify a working router-local probe and an independent transit application.

    - Apply a selective CoPP drop and prove actual class hits without blocking the trusted source or forwarded
    HTTP.

    - Remove the policy and recover the original router-local probe.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: FW
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname FW\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nno logging console\nip access-list extended CPU-SOURCES\n 10\
      \ permit icmp host 198.18.10.10 host 192.0.2.80 echo\n exit\nclass-map match-all CPU-SELECT\n match\
      \ access-group name CPU-SOURCES\n exit\npolicy-map COPP-GUARD\n class CPU-SELECT\n  police 8000\
      \ conform-action drop exceed-action drop\n  exit\n exit\ninterface GigabitEthernet0/0\n ip address\
      \ 198.18.10.1 255.255.255.0\n no shutdown\n exit\ninterface GigabitEthernet0/1\n ip address 198.18.20.1\
      \ 255.255.255.0\n no shutdown\n exit\ninterface Loopback0\n ip address 192.0.2.80 255.255.255.255\n\
      \ no shutdown\n exit\nend\n"
