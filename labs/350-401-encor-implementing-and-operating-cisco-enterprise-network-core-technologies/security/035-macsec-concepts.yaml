lab:
  title: 'MACsec: Kernel Encryption, Wrong-Key Drops and Recovery'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# MACsec: Kernel Encryption, Wrong-Key Drops and Recovery


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-035-macsec-concepts.md


    Two native net-tools endpoints use the actual Linux kernel MACsec SecY, not a simulated API. Only
    eth1 is wired. LEFT and RIGHT plain underlay addresses are 198.18.0.1/30 and 198.18.0.2/30; macsec0
    protected endpoints are 198.19.0.1/30 and 198.19.0.2/30. The software configuration requires GCM-AES-128,
    16-byte ICV, encryption/protection, explicit SCI, strict validation and replay protection with window
    0. The native model shares its execution kernel; the exact kernel release is recorded with observations.
    This is not a Cisco ASIC, physical offload or MKA exercise.


    This isolated two-endpoint classroom uses public known teaching keys and benign benchmark packets.
    It makes no confidentiality or authenticated peer-discovery claim for real data. Each fresh configuration
    chooses a new random locally administered data MAC and hence SCI; the two controlled peers learn SCI
    from actual encrypted ARP frames on their exclusive point-to-point link before installing their manual
    receive associations. This controlled classroom provisioning is not production key management. A repeat
    configuration must retain existing security associations. The helper refuses unknown preexisting SecY
    state; stop and wipe only the imported pair to reset a failed experiment. Fresh SCI reduces accidental
    reuse between copies, while production use requires fresh secret keys and an appropriate key-management
    protocol. Never reuse a key/IV combination.


    SA0 uses matching keys in both directions, with distinct endpoint SCIs. LEFT additionally has a deliberately
    wrong-key TX SA1; RIGHT has a differently keyed expected RX SA1. The fault changes only LEFT encoding_sa
    from 0 to 1. It must not recreate SA0, reset its packet number, remove addresses or break the underlay.
    RIGHT must see three failed protected requests, at least three fresh encrypted wire frames for the
    actual peer SCI and AN1, and an increase of at least three RX SA1 InPktsNotValid events. Both plain
    underlay directions remain healthy. Repair selects the retained SA0 and must recover three protected
    replies, fresh peer AN0 frames and RX SA0 InPktsOK deltas. Every phase checks strict state and monotonic
    SA0 packet numbers. Wire parsing observes headers and lengths; kernel counters and actual packet behavior
    establish the cryptographic outcome, rather than treating header inspection as tag verification. Counters
    use fresh before/after windows, not historical totals. Nominal RAM is 1024 MiB for two 512 MiB native
    endpoints.


    Objectives:

    - Inspect real software SecY state, encrypted Ethernet frames and authenticated receive counters.

    - Select a differently keyed transmit association without changing the data path or resetting SA0
    packet numbers.

    - Observe actual wrong-key rejection with healthy plain controls, then restore the retained valid
    association and real traffic.

    '
