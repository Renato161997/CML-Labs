lab:
  title: ACL VACL PACL
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# ACL VACL PACL


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-032-acl-vacl-pacl.md


    An IOL-L2 switch and three IOL-XE endpoints exchange actual ICMP in isolated VLAN10. CLIENT-A and
    CLIENT-B enter different access ports. The port ACL denies only echo requests to SERVER on CLIENT-A
    ingress: A service probes must fail, B service probes and both management paths must work, and SERVER-to-A
    probes must work because echo replies are not the selected request type. The VLAN access map instead
    selects those same echo requests on the entire VLAN, so both clients must lose service while management/reverse
    controls stay healthy. An ACL permit inside VACL-SELECT is a classifier; the access-map action performs
    the drop, and a separate explicit forward entry preserves unmatched traffic. The final detached policies
    restore both clients. This is tested virtual software forwarding, not an ASIC, throughput or production
    access-control guarantee. Nominal RAM is4GiB. Scope depends on actual independent-port traffic results,
    not accepted configuration text. IOSvL2 documents port/VLAN ACL capabilities at https://developer.cisco.com/docs/modeling-labs/iosvl2/
    ; the recorded IOL-L2 image must independently pass these packet gates.


    Objectives:

    - Measure working traffic from two separate ingress ports in the same VLAN.

    - Apply a port ACL and prove only the selected ingress loses its service request while the other ingress
    remains healthy.

    - Replace the ingress policy with a VLAN access map and verify VLAN-wide scope, allowed management/reverse
    traffic and final rollback.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: SW
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname SW\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nvlan 10\n name POLICY-LAB\n exit\ninterface Ethernet0/0\n\
      \ switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n no shutdown\n exit\n\
      interface Ethernet0/1\n switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n\
      \ no shutdown\n exit\ninterface Ethernet0/2\n switchport mode access\n switchport access vlan 10\n\
      \ spanning-tree portfast\n no shutdown\n exit\ninterface Vlan10\n ip address 198.18.10.1 255.255.255.0\n\
      \ no shutdown\n exit\nip access-list extended CLIENT-POLICY\n deny icmp any host 198.18.10.20 echo\n\
      \ permit ip any any\n exit\nip access-list extended VACL-SELECT\n permit icmp any host 198.18.10.20\
      \ echo\n exit\nvlan access-map SERVICE-GUARD 10\n match ip address VACL-SELECT\n action drop\n exit\n\
      vlan access-map SERVICE-GUARD 20\n action forward\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
