lab:
  title: Ansible Network Baseline
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Ansible Network Baseline


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-039-ansible-network-baseline.md


    A real CSR1000v 17.3.8a and the open-source CML-Labs toolbox exchange NETCONF and RESTCONF over an
    isolated benchmark network. Nominal RAM is 3072+1024 MiB, with two router vCPUs. The registered iosxe-api-v1
    preparation is implementation-digest-bound: it creates fresh RSA3072 keys and an explicit DNS-SAN
    certificate, sets only the disposable guest clock, waits for YANG daemons, exports public trust material
    over authenticated CML serial, matches ssh-keyscan against those serial-derived public keys, and checksum-verifies
    transfer to the client. No private key or CML administrator credential enters the guest client. TLS
    verification remains enabled, and NETCONF uses an explicit key pin plus a strict IOSXE ncclient handler:
    the stock ncclient0.6.17 IOSXE callback accepts unknown keys and is deliberately overridden. Wrong-password,
    wrong-hostname and wrong-key negative controls precede a fresh valid connection. All credentials in
    this file are public isolated training fixtures. This tested legacy CSR reference platform is an interoperability
    exercise, not a production cryptographic recommendation. No Internet, external connector or existing
    lab is used; stop/wipe only your imported copy to reset. The harness performs preparation automatically;
    its source scripts/iosxe_prepare.py also documents the serial steps and the known certificate-enrollment
    dialogue. Do not bypass verification if a certificate or key differs. Ansible actually runs against
    the CSR, using ansible.netcommon.netconf_get and netconf_config. The explicit default ncclient device
    handler preserves strict unknown-host behavior; stock IOS XE permissive callbacks are not used. Its
    known-hosts file contains only the public key pinned through the authenticated serial preparation.
    Each invocation uses a fresh persistent-control directory so the wrong-key test cannot reuse a trusted
    connection. Reapply is checked for equal observed device state; no claim is made about an Ansible
    changed=false report. A finally path independently restores the hostname. All account values are public
    training fixtures.


    Objectives:

    - Build a real Ansible NETCONF inventory for the isolated device with host identity checking enabled.

    - Apply the hostname baseline through actual Ansible modules, repeat it and observe the device through
    NETCONF readback.

    - Restore the hostname even on task failure and reject a mismatching server key with a fresh control
    socket.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: API
  node_definition: csr1000v
  configuration:
  - name: iosxe_config.txt
    content: "hostname API\nno ip domain-lookup\nip domain name cml-lab.example\nusername CML-LAB privilege\
      \ 15 secret Cml-lab-only-984\naaa new-model\naaa authentication login default local\naaa authorization\
      \ exec default local\naaa authentication login CONSOLE none\nline console 0\n login authentication\
      \ CONSOLE\n privilege level 15\n exec-timeout 0 0\n logging synchronous\n exit\ninterface GigabitEthernet1\n\
      \ ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\nno ip http server\nno ip http secure-server\n\
      ip http authentication local\nip ssh version 2\nline vty 0 4\n login authentication default\n transport\
      \ input ssh\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet1
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet2
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet3
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet4
    type: physical
    slot: 3
  tags: []
  ram: 3072
  cpus: 2
- id: n1
  label: TOOLS
  node_definition: cml-labs-toolbox
