      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nip routing\ninterface Loopback0\n ip address 192.0.2.1\
      \ 255.255.255.255\n no shutdown\n exit\ninterface Loopback0\n ip ospf 10 area 0\n exit\nrouter ospf\
      \ 10\n router-id 192.0.2.1\n passive-interface Loopback0\n exit\ninterface Ethernet0/0\n no switchport\n\
