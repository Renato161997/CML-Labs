lab:
  title: Campus Two Tier Three Tier HA
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Campus Two Tier Three Tier HA


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-001-campus-two-three-tier-ha.md


    Four IOL-L2 reference switches implement an actual routed-access, two-tier collapsed-core campus.
    All interswitch links are routed no-switchport interfaces; OSPF area0 carries explicit access service
    loopbacks. Both distribution paths have equal cost and must appear in the actual RIB. The first fault
    removes one access uplink. The second shuts both DIST2 data links, modeling data-plane isolation without
    powering off its CML VM. Each fault must retain endpoint forwarding through the remaining path. Recovery
    must restore both ECMP next hops. The workbook contrasts a separate three-tier core conceptually;
    it does not claim to instantiate a third tier or measure physical HA timing. Nominal RAM is4GiB.


    Objectives:

    - Identify a two-tier collapsed distribution/core design with two routed access switches.

    - Verify actual OSPF ECMP and service-loopback forwarding across both distribution paths.

    - Remove an access uplink and then isolate an entire distribution node data plane, recovering the
    original paths.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: DIST1
  node_definition: ioll2-xe
  configuration:
