lab:
  title: FHRP Design HSRP VRRP
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# FHRP Design HSRP VRRP


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-002-fhrp-design-hsrp-vrrp.md


    Four IOL reference nodes compare two real IPv4 first-hop protocols on separate VLANs. HSRPv2 group10
    prefers CORE1; VRRPv2 group20 prefers CORE2. A routed IOL endpoint has explicit service host routes
    through the corresponding VIPs. Each core hosts the same two isolated loopback identities, deliberately
    modeling service availability behind the selected gateway; this is not an external application or
    a duplicate IP on a shared Ethernet segment. Shutting one core trunk isolates both of its SVIs without
    powering off its CML VM. The surviving core must take both active roles and forward both endpoint
    probes. Recovery must restore the opposite preferred roles. This tests protocol behavior, not physical
    HA timing, stateful application failover or forwarding throughput. Nominal RAM is4GiB.


    Objectives:

    - Compare actual HSRPv2 active/standby with VRRPv2 master/backup on separate VLANs.

    - Use opposite preferred cores and prove real traffic through both virtual gateways.

    - Isolate each core in turn and recover preferred roles with preemption.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: CORE1
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname CORE1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nvlan 10\n exit\nvlan 20\n exit\ninterface Ethernet0/0\n\
      \ switchport trunk encapsulation dot1q\n switchport mode trunk\n switchport trunk allowed vlan 10,20\n\
      \ spanning-tree vlan 10 cost 4\n no shutdown\n exit\ninterface Vlan10\n ip address 198.18.10.2 255.255.255.0\n\
      \ no shutdown\n exit\ninterface Vlan10\n standby version 2\n standby 10 ip 198.18.10.1\n standby\
      \ 10 priority 110\n standby 10 preempt\n exit\ninterface Loopback10\n ip address 192.0.2.10 255.255.255.255\n\
      \ no shutdown\n exit\ninterface Vlan20\n ip address 198.18.20.2 255.255.255.0\n no shutdown\n exit\n\
      interface Vlan20\n vrrp 20 ip 198.18.20.1\n vrrp 20 priority 100\n vrrp 20 preempt\n exit\ninterface\
      \ Loopback20\n ip address 192.0.2.20 255.255.255.255\n no shutdown\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
