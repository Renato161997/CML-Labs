lab:
  title: CEF CAM TCAM RIB FIB
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# CEF CAM TCAM RIB FIB


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-006-cef-cam-tcam-rib-fib.md


    Two IOL-XE routers communicate through an IOL-L2 switch in VLAN10. The first fault removes a static
    route; the second uses an ingress ICMP classifier on R2. Separate positive controls prevent a healthy
    CAM or RIB from being mistaken for successful end-to-end forwarding. CAM aging is fixed at600seconds
    for the short exercise. TCAM is discussed as the physical implementation of classifiers: virtual IOL
    does not expose physical ASIC allocation, TCAM capacity or hardware forwarding performance, and none
    is claimed as tested.


    Objectives:

    - Correlate a successful flow with distinct RIB, software CEF and learned CAM evidence.

    - Withdraw only the destination route while leaving learned L2 connectivity intact.

    - Apply an ingress packet filter with healthy route tables and observe real deny counters.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
