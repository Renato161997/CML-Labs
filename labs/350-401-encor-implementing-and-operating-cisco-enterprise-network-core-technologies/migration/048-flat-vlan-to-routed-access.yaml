lab:
  title: Flat VLAN To Routed Access
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Flat VLAN To Routed Access


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-048-flat-vlan-to-routed-access.md


    Three IOL reference nodes start with VLAN10 stretched from the endpoint access switch to a distribution
    SVI. An explicit endpoint default models client gateway configuration; no DHCP option behavior is
    claimed. The access SVI suppresses ICMP redirects so the intermediate same-interface forwarding does
    not change endpoint routing implicitly. Migration first points the endpoint to the existing access
    SVI, then deliberately interrupts the service while changing both uplink ends to no-switchport IPv4
    transit. The distribution SVI is shut, a return route is installed, and the access default moves to
    transit. Actual interface mode, client forwarding and reverse source-loopback traffic prove the migrated
    design. A missing distribution return route must break the service while the local access gateway
    remains healthy. Separate documented rollback steps restore the original Layer2 baseline and endpoint
    gateway. This is a maintenance-window exercise, not a zero-downtime migration claim. Nominal RAM is3GiB.


    Objectives:

    - Record a working stretched client VLAN with the gateway on distribution.

    - Move the endpoint gateway to access and convert the interswitch trunk to an actual routed transit.

    - Prove the new return route, isolate its failure, then execute a complete rollback.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: DIST
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname DIST\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nip routing\nvlan 10\n exit\ninterface Ethernet0/0\n switchport\
      \ trunk encapsulation dot1q\n switchport mode trunk\n switchport trunk allowed vlan 10,20\n spanning-tree\
      \ vlan 10 cost 4\n no shutdown\n exit\ninterface Vlan10\n ip address 198.18.10.1 255.255.255.0\n\
      \ no shutdown\n exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n\
      \ exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
