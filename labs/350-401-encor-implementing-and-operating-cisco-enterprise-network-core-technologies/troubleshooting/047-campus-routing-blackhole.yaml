lab:
  title: Campus Routing Blackhole
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Campus Routing Blackhole


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-047-campus-routing-blackhole.md


    Three isolated IOL-XE routers carry service loopbacks through OSPF area0. A static Null0 host route
    on the transit router wins over the learned service host route; actual RIB selection, failed service
    probes, a healthy remote transit probe and a FULL neighbor distinguish this forwarding blackhole from
    adjacency failure. After restoring OSPF selection, a separate R2 ingress ACL on the R3-facing link
    drops only echo replies from the service to the originating loopback. Its actual deny counter, healthy
    route and unaffected transit probe distinguish the return-path policy fault. Both faults are fully
    removed and the same service probe must recover. No external service, hardware forwarding capacity
    or physical campus failure timing is claimed. Nominal RAM is3GiB.


    Objectives:

    - Separate healthy OSPF adjacency and transit reachability from service forwarding.

    - Install a preferred static discard for the service and verify its actual RIB selection.

    - Distinguish a return-direction ACL blackhole using packet counters, then recover the service.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Loopback0\n ip ospf 10 area 0\n exit\nrouter ospf 10\n router-id 192.0.2.1\n passive-interface\
      \ Loopback0\n exit\ninterface Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n\
      \ ip ospf 10 area 0\n ip ospf hello-interval 2\n ip ospf dead-interval 8\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
