lab:
  title: IPsec GRE Design
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# IPsec GRE Design


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-009-ipsec-gre-design.md


    Two IOSv routers run point-to-point GRE protected by an IPsec transport-mode profile. The overlay
    is GRE/IP; the outside wire protocol is encrypted ESP. An outer ingress deny for GRE must leave the
    protected service operational and must not count clear GRE packets. Adding an earlier ESP deny must
    block the service and count actual ESP drops while IKE and peer-IP reachability remain healthy. Removing
    that ESP deny must restore traffic even while the GRE deny remains. This distinguishes encapsulation,
    encryption and ACL placement through actual probes and counters rather than tunnel-up state. Nominal
    RAM is1GiB. IKEv1 and the public exercise-only PSK are legacy interoperability fixtures, not production
    authentication guidance. All peers and prefixes are isolated. This verifies software protocol and
    packet behavior, not hardware cryptographic throughput.


    Objectives:

    - Separate the actual GRE overlay from the outer ESP encryption transport.

    - Show that an outer GRE deny does not block encrypted GRE packets.

    - Add a selective ESP deny, identify actual packet drops and restore forwarding.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nno logging console\ncrypto isakmp policy 10\n encryption aes\
      \ 256\n hash sha256\n authentication pre-share\n group 14\n lifetime 3600\n exit\ncrypto isakmp\
      \ key CML-VPN-DESIGN-PUBLIC-ONLY address 198.18.0.2\ncrypto ipsec transform-set DESIGN-SET esp-aes\
      \ 256 esp-sha256-hmac\n mode transport\n exit\ncrypto ipsec profile DESIGN-PROFILE\n set transform-set\
      \ DESIGN-SET\n set pfs group14\n exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n\
      \ no shutdown\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.1 255.255.255.252\n no\
      \ shutdown\n exit\ninterface Tunnel0\n ip address 172.16.0.1 255.255.255.252\n ip mtu 1400\n tunnel\
      \ source GigabitEthernet0/0\n tunnel destination 198.18.0.2\n tunnel mode gre ip\n tunnel protection\
      \ ipsec profile DESIGN-PROFILE\n no shutdown\n exit\nip route 192.0.2.2 255.255.255.255 Tunnel0\n\
      end\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
