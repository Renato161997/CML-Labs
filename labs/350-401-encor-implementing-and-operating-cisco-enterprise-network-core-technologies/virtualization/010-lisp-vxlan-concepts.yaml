lab:
  title: 'VXLAN: Encapsulation, VNI Mismatch and Recovery'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# VXLAN: Encapsulation, VNI Mismatch and Recovery


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-010-lisp-vxlan-concepts.md


    The overlay is an actual native Linux VXLAN tunnel, with two independent endpoint namespaces bridged
    through native VTEP namespaces. VTEP eth1 is the underlay interface and eth2 connects its local endpoint.
    Each VTEP bridges only eth2 and vx0 through br0; br0 has no data IP. LEFT 198.19.0.1/30 and RIGHT
    198.19.0.2/30 share the overlay, while VTEP underlay addresses use distinct 198.18 benchmark space.
    Only declared point-to-point links exist; native management eth0 is unwired.


    VXLAN starts at VNI100 with explicit local/remote unicast peers, UDP destination 4789 and outer TTL
    64. The static classroom peer configuration uses no multicast group and is not EVPN, LISP or a proprietary
    controller. Small interface-bound IPv4 probes measure actual underlay and overlay behavior. Probe
    warm-up precedes each three-packet measurement. Actual device state, preserved endpoint addressing
    and both forwarding bridge ports accompany the packet controls.


    Only VTEP2 changes to VNI101. Changing this immutable tunnel identifier recreates only its own vx0
    bridge port with the same underlay, remote peer, UDP port and TTL. Underlay addressing/routes and
    both endpoint addresses remain unchanged. Both overlay directions must fail while both underlay directions
    retain three replies. A fresh packet-socket window on VTEP2 eth1 must nevertheless observe the expected
    VTEP1 UDP4789 packet carrying an actual selected inner LEFT-to-RIGHT ARP or echo request. Its decoded
    wire VNI100 must differ from actual receiver VNI101. After local VNI100 repair, fresh wire evidence,
    bidirectional overlay delivery and underlay controls must recover.


    The capture worker belongs to this guest only, has an explicit PID/command identity and atomically
    acknowledges new evidence generations. It records bounded counters and decoded header facts, not arbitrary
    media or production traffic. Header/payload length bounds, the basic VXLAN I flag, peer addresses,
    inner request tuple and expected TTL are checked. This is the declared untagged small-packet scope,
    not a general traffic decoder, fragmentation/MTU test, encryption/authentication mechanism or performance
    benchmark. Native images share their execution kernel; actual kernel release is recorded. No external
    connector, Internet service or production credentials are required. Stop/wipe only your imported copy
    to reset.


    VTEP1 underlay is 198.18.0.1/30 and VTEP2 is 198.18.0.2/30 on a direct link. The observed incoming
    outer TTL must be 64. The historical filename mentions LISP; this selected exercise validates VXLAN
    dataplane behavior only and makes no LISP control-plane claim.


    Objectives:

    - Separate actual underlay transport from bridged overlay addressing and delivery.

    - Decode expected-peer VXLAN VNI/TTL and selected inner request fields from a fresh real wire window.

    - Break only receiver VNI, retain underlay controls, and recover actual bidirectional overlay traffic.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
