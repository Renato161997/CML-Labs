lab:
  title: 'Virtual Switching: VLAN Isolation and Dynamic MAC Learning'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Virtual Switching: VLAN Isolation and Dynamic MAC Learning


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-011-virtual-switching-paths.md


    A real native Linux kernel bridge forwards between two independent native endpoints. SW eth1 connects
    LEFT eth1 and SW eth2 connects RIGHT eth1. Only these point-to-point links exist; native management
    eth0 is unwired. Untagged data ports start in VLAN10 with PVID10. VLAN99 stays tagged on both physical
    ports and terminates on SW br0.99, while endpoint eth1.99 interfaces provide an independent control
    path on the same physical links.


    LEFT untagged data is 198.18.0.1/30 and RIGHT is 198.18.0.2/30. Tagged control addresses are SW 198.18.1.1/29,
    LEFT 198.18.1.2/29 and RIGHT 198.18.1.3/29. No data IP is assigned to br0 itself, and no routing between
    the data VLANs is configured. Actual interface-bound IPv4 probes establish connectivity; a warm-up
    packet precedes each measured three-packet sample. The control ping must succeed even when data isolation
    is expected. Missing interfaces, addresses or a disabled port cannot substitute for VLAN isolation.


    The fault moves only SW eth2 untagged/PVID membership from VLAN10 to VLAN20 and preserves tagged VLAN99.
    Both data directions must fail while both tagged control paths still receive three replies. Repair
    restores VLAN10 and requires real bidirectional data recovery plus dynamically learned data-VLAN MAC
    entries. Those entries must match peer identities observed independently in the tagged control neighbor
    table; static, self, sticky and externally imported FDB entries cannot pass as learned traffic. CLI
    policy operations inspect actual state and refuse unknown or leaking membership rather than blindly
    rewriting it.


    This uses software bridge forwarding and the actual execution kernel, whose release is recorded. It
    is not a VMware/Hyper-V/OVS deployment or physical-switch throughput benchmark. All three native net-tools
    guests reserve 512 MiB each, totaling 1536 MiB. No external service, production credential or Internet
    connector is required. Stop/wipe only your imported copy to reset.


    Objectives:

    - Inspect actual VLAN-aware bridge ports, forwarding state and dynamic MAC learning.

    - Isolate only the untagged data path while preserving a tagged control path on the same physical
    interfaces.

    - Recover both data directions and verify actual dynamic forwarding entries against independently
    observed peer MACs.

    '
