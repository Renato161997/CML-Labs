lab:
  title: GRE Overlay Underlay
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# GRE Overlay Underlay


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-008-gre-overlay-underlay.md


    Two IOL-XE routers provide an unencrypted GRE overlay with routed loopback endpoints. The tunnel IP
    MTU is deliberately limited to1400, below the underlying Ethernet limit; a1401-byte DF request provides
    a precise negative control. Both directions are tested independently because an echo reply need not
    copy the request DF bit. This measures configured L3 tunnel limits, not an unknown physical path MTU,
    encryption, wire capture or hardware fragmentation performance.


    Objectives:

    - Separate direct underlay reachability from GRE overlay endpoint routing.

    - Measure both request directions at the configured tunnel IP MTU with DF set.

    - Increase and restore both tunnel MTUs while checking the unchanged underlay.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\ninterface Tunnel0\n\
      \ ip address 172.16.0.1 255.255.255.252\n ip mtu 1400\n tunnel source Ethernet0/0\n tunnel destination\
      \ 198.18.0.2\n tunnel mode gre ip\n no shutdown\n exit\nip route 192.0.2.2 255.255.255.255 172.16.0.2\n\
      end\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.2 255.255.255.252\n no shutdown\n exit\ninterface Tunnel0\n\
      \ ip address 172.16.0.2 255.255.255.252\n ip mtu 1400\n tunnel source Ethernet0/0\n tunnel destination\
      \ 198.18.0.1\n tunnel mode gre ip\n no shutdown\n exit\nip route 192.0.2.1 255.255.255.255 172.16.0.1\n\
      end\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
annotations: []
smart_annotations: []
