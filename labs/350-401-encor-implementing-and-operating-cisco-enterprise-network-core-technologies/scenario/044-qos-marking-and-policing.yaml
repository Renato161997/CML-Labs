lab:
  title: 'QoS: Receiver-Verified DSCP and Selective Policing'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# QoS: Receiver-Verified DSCP and Selective Policing


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-044-qos-marking-and-policing.md


    A real IOL-XE router forwards between two native Linux endpoints. UDP destination 9000 is the only
    selected data class; an egress MQC policy sets its actual DSCP to EF. The receiver obtains each datagram''s
    real IP_TOS ancillary value, requiring 184 (DSCP 46, ECN 0). Source sockets explicitly send TOS 0.
    Four independent UDP 9001 controls must all arrive with TOS 0 in every phase. No configured marking
    string can replace receiver evidence.


    Every probe creates an acknowledged fresh evidence generation over an isolated HTTP control fixture,
    then sends exactly 16 distinct data datagrams of 1000-byte UDP payload and four 100-byte controls,
    paced 10ms apart. The receiver rejects malformed payloads and duplicate sequence evidence; older generations
    cannot supply current results. A bounded settling window precedes acceptance. These are small finite
    correctness probes, not a benchmark or calibrated rate/throughput test.


    Remove the marking attachment: all 16 data packets must still arrive but now with observed TOS 0.
    Restore marking and require actual TOS 184 again. Attach only the ingress data-class policer, CIR
    8000bit/s and burst 1500bytes, conform transmit/exceed drop. Its fresh exceeded counter must initially
    be zero. The bounded burst must then deliver some but fewer than 16 data packets, all still EF, while
    all four unselected controls survive; the actual policer must show both conformed and exceeded packets.
    Finally detach policing and recover all 16 EF packets and four controls.


    The fixture HTTP 8081 interface exists solely for resetting/reading the disposable receiver''s bounded
    counters. It accepts only the declared client source and exact generation fields; it is not an authenticated
    production API or a latency/packet-loss monitor. Images, virtual scheduling, IOL-XE software rate
    behavior and host load constrain observations. No hardware QoS accuracy, queuing fairness, congestion
    avoidance or service guarantee is inferred. No external connector, installed production policy or
    credential is required. Stop/wipe only the imported copy to reset.



    Objectives:

    - Observe actual receiver TOS and exact per-generation UDP sequence sets independently of router configuration.

    - Remove/restore marking while retaining complete data and control delivery.

    - Observe real selective ingress policing with fresh counter evidence and unpoliced controls, then
    recover full delivery.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
