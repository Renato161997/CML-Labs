lab:
  title: VRF Lite Shared Services
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# VRF Lite Shared Services


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-043-vrf-lite-shared-services.md


    Four IOL-XE routers implement local VRF-Lite/shared-services routing with actual BGP route-target
    import on PE. There are no BGP neighbors and no MPLS provider core: the tested BGP behavior is local
    VPNv4 import, not a remote controller or a labeled WAN. BLUE, RED and SERVICES have distinct RDs;
    tenant RTs are10/20 and the shared-service RT is99. CE loopbacks use documentation addresses and every
    CE has an explicit return/default route. PE exports actual static customer routes; imported tenant
    routes are not re-originated as service exports. All three PE interfaces belong to their own VRF.
    Nominal RAM is4x1024MiB. The shared-service VRF imports each tenant return route, while the tenants
    import only the service RT. Removing the service import from BLUE must affect that tenant alone; RED
    access and tenant isolation remain healthy, then the original service path is restored.


    Objectives:

    - Verify separate tenant RIBs, real local VPNv4 route-target imports and sourced shared-service forwarding.

    - Prove tenant-to-tenant isolation and the absence of a global fallback route.

    - Change only the intended import or ingress policy, observe the corresponding data-plane effect and
    recover.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: PE
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname PE\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\nno logging console\nip vrf BLUE\n rd 65000:10\n route-target export 65000:10\n route-target\
      \ import 65000:99\n exit\nip vrf RED\n rd 65000:20\n route-target export 65000:20\n route-target\
      \ import 65000:99\n exit\nip vrf SERVICES\n rd 65000:99\n route-target export 65000:99\n route-target\
      \ import 65000:10\n route-target import 65000:20\n exit\ninterface Ethernet0/0\n ip vrf forwarding\
      \ BLUE\n ip address 198.18.10.1 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/1\n ip\
      \ vrf forwarding RED\n ip address 198.18.20.1 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/2\n\
      \ ip vrf forwarding SERVICES\n ip address 198.18.99.1 255.255.255.252\n no shutdown\n exit\nip route\
      \ vrf BLUE 192.0.2.10 255.255.255.255 198.18.10.2\nip route vrf RED 198.51.100.20 255.255.255.255\
      \ 198.18.20.2\nip route vrf SERVICES 203.0.113.80 255.255.255.255 198.18.99.2\nip route vrf SERVICES\
      \ 203.0.113.81 255.255.255.255 198.18.99.2\nrouter bgp 65000\n bgp router-id 192.0.2.254\n no bgp\
      \ default ipv4-unicast\n address-family ipv4 vrf BLUE\n  redistribute static\n exit-address-family\n\
      \ address-family ipv4 vrf RED\n  redistribute static\n exit-address-family\n address-family ipv4\
      \ vrf SERVICES\n  redistribute static\n exit-address-family\n exit\nend\n"
