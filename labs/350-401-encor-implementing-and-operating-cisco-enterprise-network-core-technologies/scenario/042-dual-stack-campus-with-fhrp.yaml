lab:
  title: Dual Stack Campus With FHRP
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Dual Stack Campus With FHRP


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-042-dual-stack-campus-with-fhrp.md


    Four IOL nodes form a real redundant Layer2 campus with two gateway cores, an access switch and an
    independent client. IPv4 uses HSRPv2 group10 and virtual198.18.10.1. IPv6 uses separate group11 and
    the explicitly configured virtual link-local FE80::10; CLIENT has an interface-qualified static IPv6
    route through that next hop. Checks identify the IPv6 group row explicitly rather than accepting the
    IPv4 Active row as IPv6 proof. Each core owns the same isolated training loopback service in each
    family, so this proves first-hop forwarding failover to an equivalent endpoint, not persistence of
    a stateful application. Shutting CORE1 Vlan10 keeps its Layer2 links present but transfers both first-hop
    roles to CORE2. Restoring it must preempt both roles. Withdrawing only the explicit client IPv6 service
    route breaks the IPv6 service while IPv4 service and both HSRP roles remain healthy; HA alone cannot
    correct a missing endpoint route. All traffic is isolated, with no external connector. Nominal RAM
    is4GiB. Syntax reference: https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/113216-ipv6-hsrp-00.html
    and https://www.cisco.com/c/en/us/td/docs/ios/ipv6/command/reference/ipv6_book/ipv6_17.html ; actual
    support is established only by the recorded image-specific traffic tests.


    Objectives:

    - Verify separate IPv4 and IPv6 HSRPv2 groups and actual endpoint traffic in both families.

    - Fail the preferred core SVI and require both virtual first hops and data paths to recover through
    the other core.

    - Restore preemption, isolate an IPv6-only endpoint route fault while IPv4 remains healthy, and recover
    both families.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: CORE1
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname CORE1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nvlan 10\n name CAMPUS\n exit\nspanning-tree vlan 10 priority\
      \ 4096\nspanning-tree mode rapid-pvst\ninterface Ethernet0/0\n switchport trunk encapsulation dot1q\n\
      \ switchport mode trunk\n switchport trunk allowed vlan 10\n spanning-tree vlan 10 cost 4\n no shutdown\n\
      \ exit\ninterface Ethernet0/1\n switchport trunk encapsulation dot1q\n switchport mode trunk\n switchport\
      \ trunk allowed vlan 10\n spanning-tree vlan 10 cost 4\n no shutdown\n exit\ninterface Vlan10\n\
      \ ip address 198.18.10.2 255.255.255.0\n standby version 2\n standby 10 ip 198.18.10.1\n standby\
      \ 10 priority 110\n standby 10 preempt\n no shutdown\n exit\ninterface Loopback0\n ip address 192.0.2.80\
      \ 255.255.255.255\n no shutdown\n exit\n\nipv6 unicast-routing\ninterface Vlan10\n ipv6 address\
      \ FE80::2 link-local\n ipv6 address 2001:DB8:10::2/64\n standby 11 ipv6 FE80::10\n standby 11 priority\
      \ 110\n standby 11 preempt\n exit\ninterface Loopback0\n ipv6 address 2001:DB8:FFFF::80/128\n exitend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
