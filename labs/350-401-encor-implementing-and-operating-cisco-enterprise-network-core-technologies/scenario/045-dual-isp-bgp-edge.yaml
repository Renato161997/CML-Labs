lab:
  title: Dual ISP BGP Edge
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Dual ISP BGP Edge


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-401-045-dual-isp-bgp-edge.md


    Three isolated IOL-XE routers implement an enterprise edge and two independent eBGP provider ASes.
    Both providers own the same isolated service loopback203.0.113.9, deliberately modeling a replicated
    service identity rather than Internet reachability. The edge exports only its own probe loopback and
    accepts only the service prefix. Local preference200 versus100 selects the primary. Peer shutdown
    must change the actual RIB next hop and preserve the same source-loopback service probe. The backup
    also advertises203.0.113.66; retained received-routes prove it exists before an intentional prefix-list
    expansion admits it. Removing that expansion must withdraw it again while the expected service stays
    healthy. All sessions and prefixes remain inside the isolated lab. Nominal RAM is3GiB.


    Objectives:

    - Inspect two real eBGP service paths and the primary local-preference decision.

    - Administratively remove only the primary BGP peer and prove backup forwarding.

    - Expose and repair an inbound prefix-policy mistake while preventing enterprise transit export.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: EDGE
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname EDGE\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/1\n\
      \ ip address 198.18.0.5 255.255.255.252\n no shutdown\n exit\nip prefix-list EDGE-ONLY seq 10 permit\
      \ 192.0.2.1/32\nip prefix-list SERVICE-ONLY seq 10 permit 203.0.113.9/32\nroute-map PRIMARY-IN permit\
      \ 10\n match ip address prefix-list SERVICE-ONLY\n set local-preference 200\n exit\nroute-map SECONDARY-IN\
      \ permit 10\n match ip address prefix-list SERVICE-ONLY\n set local-preference 100\n exit\nrouter\
      \ bgp 65000\n bgp router-id 192.0.2.1\n network 192.0.2.1 mask 255.255.255.255\n neighbor 198.18.0.2\
      \ remote-as 65001\n neighbor 198.18.0.2 route-map PRIMARY-IN in\n neighbor 198.18.0.2 prefix-list\
      \ EDGE-ONLY out\n neighbor 198.18.0.2 soft-reconfiguration inbound\n neighbor 198.18.0.6 remote-as\
      \ 65002\n neighbor 198.18.0.6 route-map SECONDARY-IN in\n neighbor 198.18.0.6 prefix-list EDGE-ONLY\
      \ out\n neighbor 198.18.0.6 soft-reconfiguration inbound\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: ISP1
  node_definition: iol-xe
