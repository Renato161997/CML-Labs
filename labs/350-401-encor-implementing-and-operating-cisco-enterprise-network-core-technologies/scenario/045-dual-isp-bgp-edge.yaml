      \ Loopback0\n ip address 203.0.113.9 255.255.255.255\n no shutdown\n exit\nrouter bgp 65001\n bgp\
      \ router-id 192.0.2.2\n neighbor 198.18.0.1 remote-as 65000\n network 203.0.113.9 mask 255.255.255.255\n\
      \ exit\nend\n"
  cpu_limit: 100
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
