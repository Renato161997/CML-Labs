lab:
  title: DEVCOR Capstone Controller Integration
  description: 350-901 DEVCOR - Developing Applications Using Cisco Core Platforms and APIs scenario-based
    CML lab.
  notes: '350-901 DEVCOR scenario lab: DEVCOR Capstone Controller Integration


    Lab type: capstone


    Scenario:

    You are taking over a partially built network. Use the topology, startup configs, and this note as
    the work order.


    Objectives:

    - Model controller inventory, policy update, and validation.

    - Handle API failure and rollback conditions.

    - Produce a reusable automation plan.


    Suggested verification:

    - show ip interface brief

    - show ip route

    - show running-config


    Stretch goals:

    - Document the final design.

    - Add one extra validation command for each requirement.

    - Make one controlled change and prove that the network still works.'
  version: 0.3.1
