lab:
  title: Webhook Receiver Config Validation
  description: Strict intent validation, allowlists and a safe approval boundary. Offline teaching service,
    no changes to real devices.
  notes: See docs/workbooks/035-webhook-receiver-config-validation.md. Wait for CML-LABS-READY and a root
    console. Receiver binds to localhost only. A fresh ephemeral secret is generated inside this disposable
    VM; do not publish it. This lab uses console autologin in an isolated guest and must not be bridged
    externally. It is a legacy DEVCOR exercise, not a claim of full AUTOCOR coverage.
  version: 0.3.1
nodes:
- id: n0
  label: DEVBOX
  node_definition: ubuntu
  configuration:
  - name: user-data
    content: "#cloud-config\nhostname: DEVBOX\nmanage_etc_hosts: true\nwrite_files:\n- path: /opt/cml-webhook/receiver.py\n\
      \  permissions: '0644'\n  encoding: b64\n  content: \n\
      - path: /opt/cml-webhook/probe.py\n  permissions: '0644'\n  encoding: b64\n  content: \n\
      - path: /etc/systemd/system/cml-webhook.service\n  permissions: '0644'\n  content: '[Unit]\n\n \
      \   Description=Isolated CML webhook exercise\n\n    After=network.target\n\n    [Service]\n\n \
      \   EnvironmentFile=/run/cml-webhook.env\n\n    ExecStart=/usr/bin/python3 /opt/cml-webhook/receiver.py\n\
      \n    User=root\n\n    NoNewPrivileges=true\n\n    ProtectSystem=strict\n\n    ProtectHome=true\n\
      \n    PrivateTmp=true\n\n    [Install]\n\n    WantedBy=multi-user.target\n\n    '\n- path: /etc/systemd/system/serial-getty@ttyS0.service.d/autologin.conf\n\
      \  permissions: '0644'\n  content: '[Service]\n\n    ExecStart=\n\n    ExecStart=-/sbin/agetty --autologin\
      \ root --noclear %I $TERM\n\n    '\n- path: /root/.bash_profile\n  permissions: '0600'\n  content:\
      \ 'set -a\n\n    . /run/cml-webhook.env\n\n    set +a\n\n    '\nruncmd:\n- - sh\n  - -c\n  - umask\
      \ 077; printf 'LAB_WEBHOOK_SECRET=%s\\n' \"$(python3 -c 'import secrets; print(secrets.token_hex(24))')\"\
      \n    > /run/cml-webhook.env\n- - systemctl\n  - daemon-reload\n- - systemctl\n  - enable\n  - --now\n\
      \  - cml-webhook.service\n- - sh\n  - -c\n  - set -a; . /run/cml-webhook.env; set +a; python3 /opt/cml-webhook/probe.py\
      \ > /var/log/cml-webhook-acceptance.json\n- - sh\n  - -c\n  - echo CML-LABS-READY > /dev/ttyS0\n\
      - - systemctl\n  - restart\n  - serial-getty@ttyS0.service\n"
  - name: network-config
    content: "#network-config\nnetwork:\n  version: 2\n  ethernets:\n    ens2:\n      dhcp4: false\n \
      \     optional: true\n      addresses: [198.18.250.1/24]\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  tags: []
  interfaces:
  - id: i0
    label: ens2
    type: physical
    slot: 0
links: []
annotations: []
smart_annotations: []
