lab:
  title: 'Local CI/CD: Committed Policy, Test Gates and Real Deployment'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Local CI/CD: Committed Policy, Test Gates and Real Deployment


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-901-020-ci-cd-for-network-automation.md


    Three isolated guests implement a local Git-to-tested-policy-to-device pipeline. INSIDE has a real
    local Git repository containing only intent.json; no remote repository, GitHub credential, webhook
    or production runner is used. FW is an actual IOL-XE router enforcing the unchanged closed ACL compiler''s
    output, and OUTSIDE has real application/admin HTTP listeners. The software publisher starts with
    a version-1 application-deny artifact, matching the router''s initial deny behavior. The first committed
    candidate permits only the classroom application. These are public synthetic policy resources, not
    a general security policy language.


    Each build requires a clean worktree, a literal committed Git object ID and one regular-mode source
    blob. It reads the committed bytes, not an unchecked worktree path, and runs eight fixed policy tests
    in a separate Python process. The candidate itself must satisfy the closed compiler, preserve admin
    denial/control and reject the fixed unsafe-field/type/scope examples. The accepted bundle binds the
    exact commit, source SHA-256, intent, complete compiled bytes and artifact SHA-256. These hashes provide
    consistency/provenance within the root-owned fixture, not a signature or protection from a compromised
    publisher/root user. The compiler and gate code are fixed reviewed inputs outside the candidate repository;
    untrusted candidate code is never executed. Git''s SHA-1 object identifier is an opaque local revision
    identity here, not a cryptographic trust anchor.


    Building does not publish, publishing does not deploy and a command echo does not establish forwarding.
    Root-only classroom promotion revalidates the full bundle against its committed source and requires
    the current clean HEAD. Staging a new deny commit must make the old build stale; an attempted promotion
    must be rejected with the complete old bundle and publication bytes unchanged. A new tested deny build
    can then be promoted. The router''s real HTTP client separately fetches and merges the approved artifact.
    Actual client application HTTP must change only after that device step; administration remains denied,
    both local listeners stay available and independent routed ICMP remains healthy.


    The first accepted allow bundle is retained for explicit rollback. Historical rollback verifies that
    bundle against its original committed bytes without rewriting Git history; actual traffic remains
    denied until the router applies it. A subsequently committed unsafe admin-allow request must make
    the actual gate process fail, preserving the previous bundle, published bytes and safe traffic. A
    final valid commit/build/promotion/device application restores the reference state. Gate success alone
    does not prove all possible flows or all policies; the fixed actual packet matrix supplies separate
    deployment evidence.


    The unchanged publisher uses read-only plaintext HTTP on the closed link, and IOS merges fixed ACL
    sequences while the ACL stays defined. This is not an atomic commit, zero-loss change, signed supply
    chain, authenticated production approval system or hosted CI service. The immutable narrow TCP-return
    exception for the router-originated artifact fetch is not a stateful firewall. The lab has no Internet
    connector, external account, production secret or original user lab. Wiping only the imported copy
    removes its Git repository, artifacts and processes.



    Objectives:

    - Build a deterministic guarded ACL artifact from actual committed Git bytes and a separate test process.

    - Reject stale promotion and unsafe source while distinguishing builds, publication and actual device
    deployment.

    - Roll back a verified historical artifact and require real packet-level recovery before declaring
    success.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: FW
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname FW\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\nno logging console\nfile prompt quiet\nip http client source-interface Ethernet0/0\nip access-list\
      \ extended POLICY-CODE\n 5 permit tcp host 198.18.10.10 eq 8081 host 198.18.10.1 established\n 10\
      \ deny tcp host 198.18.10.10 host 198.18.20.20 eq 8080\n 20 deny tcp any host 198.18.20.20 eq 9090\n\
      \ 30 permit icmp any any\n 40 deny ip any any\n exit\ninterface Ethernet0/0\n ip address 198.18.10.1\
      \ 255.255.255.0\n no shutdown\n ip access-group POLICY-CODE in\n exit\ninterface Ethernet0/1\n ip\
      \ address 198.18.20.1 255.255.255.0\n no shutdown\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
  ram: 1024
  cpus: 1
- id: n1
  label: INSIDE
  node_definition: cml-labs-toolbox
