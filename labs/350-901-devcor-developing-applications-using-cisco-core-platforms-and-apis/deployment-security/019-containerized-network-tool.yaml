lab:
  title: 'Container Security: A Real Unprivileged Network Workload'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Container Security: A Real Unprivileged Network Workload


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-901-019-containerized-network-tool.md


    Two actual CML Docker protocol-services guests use the immutable separately published OCI image and
    their registered configuration payloads. SERVER 198.18.0.1:8080 is the unchanged OpenAPI/JSON-Schema
    teaching endpoint; CLIENT 198.18.0.2 first performs root-only network/bootstrap setup, then starts
    a separate short-lived Python HTTP workload with actual UID/GID 65534, no supplementary groups, no
    effective/permitted/inheritable/ambient capabilities and kernel no-new-privileges set before exec.
    The child reads its own real /proc/self/status and must be unable to regain UID zero. It still performs
    actual authenticated HTTP and pinned contract/schema validation, creates a mode-0600 result owned
    by that UID, reads it back and removes it before exiting. The parent observes the completed child
    and a PID different from its own. Kernel SYS_ADMIN must be absent in the bootstrap container too.
    This is a finite measured privilege profile, not a general container-escape or host-boundary proof.


    The only image bind is the existing declared CML boot configuration; there is no nested Docker daemon,
    host-network mode, extra host mount, paid service or production credential. The classroom API key
    is deliberately public source, not a secret protected by this exercise. The root-only file is an explicitly
    PUBLIC permission-test sentinel, never a real key. Actual UID-65534 reads must fail in the secure
    mode and succeed only after the controlled root chmod-0644 fault; restoring chmod-0600 must deny reads
    again without breaking legitimate API requests. These file tests do not protect data from container
    root. HTTP is plaintext on closed lab links, not an Internet deployment pattern. Every file/process
    disappears when the imported copy is wiped.


    The [separate services image build](../../services/README.md) records real OCI config digest, source
    revision and Debian package inventory. CML''s registered Docker kind plus the actual guest observations
    support the runtime claim; a copied Docker marker alone is not an isolation assessment. The exercise
    does not run docker build inside a privileged nested guest or claim a container power-cycle. Source-contract
    faults are rejected by the unchanged real JSON Schema client while independent kernel carrier and
    ICMP stay healthy. Container/UID success and API semantic success are separate observations.



    Objectives:

    - Connect the actual immutable Docker artifact, registered payload and independently measured guest
    runtime.

    - Observe a genuinely unprivileged API workload, denied root regain and scoped file-permission outcomes.

    - Reject actual source/authorization faults without mistaking container liveness for API correctness,
    then recover.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
