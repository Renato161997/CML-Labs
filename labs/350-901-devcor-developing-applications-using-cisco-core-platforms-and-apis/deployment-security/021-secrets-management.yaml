lab:
  title: 'Secrets: OS Ownership, Scoped Injection and Live Rotation'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Secrets: OS Ownership, Scoped Injection and Live Rotation


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-901-021-secrets-management.md


    One isolated native Linux guest runs actual processes with service UID/GID 1500 and untrusted UID/GID
    1501, both without supplementary groups. The service key is freshly generated inside each imported
    copy; no production key or CML credential enters this exercise. Its parent directory is root-owned
    0755, and the root-owned key is group 1500 readable with mode 0440. Both non-root identities must
    be unable to open the file for writing. Symbolic links, multiple hard links, unexpected ownership
    and modes outside the explicit exercise states are refused.


    A real loopback HTTP service runs as UID 1500, reads the current key on every protected request and
    verifies the exact canonical Bearer value. The legitimate UID reads the key from the file and reaches
    HTTP 200; UID 1501 cannot read it and gets HTTP 401 without a key. The service checks its actual own
    process command line/environment for the active key and returns only a boolean plus its observed UID.
    Clean child environments and argument vectors contain no key; the captured old key is delegated for
    replay only through a process stdin pipe, never argv/environment.


    The controlled fault changes only mode 0440 to 0444. UID 1501 must now genuinely read the file and
    authenticate with HTTP 200; both identities still lack write permission. A root-private 0600 copy
    records the now-compromised training key solely for the recovery probe. Repair restores 0440 and atomically
    installs a different fresh root-owned/group-readable value while the same service process remains
    running. UID 1501 must again fail to read the replacement, and its actually cached old key must get
    401. The legitimate reader gets 200 with the new value. The obsolete root-private replay fixture remains
    only until the imported node is wiped.


    This teaches local OS ownership, scoped file-based injection and live rotation/revocation consequences.
    The loopback API is a bounded authentication fixture, not OAuth, an OpenBao/Vault server, an external
    identity provider or a real Cisco management API. HTTP is restricted to this guest loopback; TLS,
    remote secret transport, encryption at rest, KMS/HSM, multi-tenant container security and a production
    secret broker are outside scope. Numeric identities are disposable process credentials, not host/user
    accounts. Native guests share their execution kernel. No external connector, installed host agent
    or Internet service is needed. Only the imported copy may be stopped/wiped.



    Objectives:

    - Verify real read/write access decisions under distinct OS identities, plus live authenticated requests.

    - Observe an actual credential exposure through an intentionally widened file read mode.

    - Restore scoped access, rotate atomically and reject replay of the captured old value without stopping
    the service.

    '
