lab:
  title: API Pagination
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# API Pagination


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-901-008-api-pagination.md


    Two native Linux guests exchange actual HTTP requests over a private benchmark-address link. The inspectable
    Python server is vendor-neutral training software, not a mock claimed to be a live Cisco controller.
    Both source files are embedded and checked against the repository. The control header is a public
    fixture used only to inject a named fault into this disposable service. HTTP is deliberately plaintext
    inside the isolated topology: this exercise does not demonstrate production transport security, OAuth
    or external API integration. SQLite is an actual on-disk transactional store, not an in-memory substitute.
    The observability case uses a bounded event archive, monotonic request counters and request-ID correlation;
    it does not claim an OpenTelemetry deployment or distributed multi-service tracing. The cache fault
    is detected by comparing an independent fresh representation with cached content, rather than assuming
    a 304 alone can reveal a lying origin. Source files and generated data remain in /lab until wipe.
    No Internet, package download, real tokens or external connector is required.


    Objectives:

    - Retrieve seven unique records across three real HTTP pages.

    - Reject invalid page size and detect an actual repeated cursor without an infinite scan.

    - Restore cursor progression and prove the complete inventory is recovered.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
