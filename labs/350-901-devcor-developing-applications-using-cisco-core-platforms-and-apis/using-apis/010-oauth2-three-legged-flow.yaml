lab:
  title: Authorization Code and PKCE with Synthetic Consent
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Authorization Code and PKCE with Synthetic Consent


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-901-010-oauth2-three-legged-flow.md


    Two isolated Net-Tools guests exchange real HTTP on198.18.0.1:8080. AUTH co-locates a small authorization-server
    and resource-server fixture; CLIENT scripts the application and the resource-owner browser response.
    The owner and consent decision are explicitly synthetic fixtures, not authenticated humans or a real
    identity provider. The client parses an exact allowlisted callback Location; it does not run a browser
    or host a callback listener. The fixed public client has no client secret. This is an OAuth2 teaching
    subset with opaque credentials, not OpenID Connect, JWT, production registration or a production TLS
    deployment. Plain HTTP is deliberately confined to the private benchmark link. No external connector,
    real account, vendor API or production secret is used. A deliberately public fixture-control header
    injects named unsafe policies for this exercise; the code must not serve real users. SQLite stores
    hashes rather than issued credential values. Probe output contains assertions/results and never prints
    credentials; state is removed by wiping this disposable lab. Nominal RAM is1GiB. The client generates
    a fresh verifier and state. The authorization endpoint returns an actual redirect with a short-lived
    code; client state/callback validation happens before the token request. Wrong verifier and wrong
    redirect must fail without consuming the legitimate grant. Correct redemption must access the protected
    fixture resource. Redeeming that same code again must reject the replay and close its issued token
    family. Synthetic denial must return no usable code. During the controlled weak-PKCE fault a wrong
    verifier must actually receive a token that can read the protected resource, rather than merely reporting
    a mode flag. Restoring healthy policy repeats all rejection and successful-flow checks. PKCE and state
    have separate roles in this script. References: https://www.rfc-editor.org/rfc/rfc7636.html and https://www.rfc-editor.org/rfc/rfc9700.html
    .


    Objectives:

    - Exchange a real one-use authorization code bound to an exact callback and S256 PKCE verifier.

    - Reject a callback for the wrong local transaction, wrong verifier, wrong redirect, code replay and
    synthetic consent denial.

    - Inject a weak-PKCE policy, observe a wrong verifier actually obtaining usable access, then restore
    the binding checks.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
