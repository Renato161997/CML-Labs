lab:
  title: API Contract OpenAPI
  description: 350-901 DEVCOR - Developing Applications Using Cisco Core Platforms and APIs importable
    CML topology.
  notes: '350-901 DEVCOR blueprint lab: API Contract OpenAPI


    Topics:

    - OpenAPI

    - schema

    - contract testing


    Tasks:

    1. Read schema

    2. Validate payload

    3. Document endpoint


    Useful checks:

    - show ip interface brief

    - show running-config

    - show ip route

    - show ip protocols

    - ping and traceroute between endpoints'
  version: 0.3.1
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: -180
  y: 0
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nbanner motd ^C DEVCORE-AUTOCOR API Contract OpenAPI ^C\n\
      interface GigabitEthernet0/0\n description DEVCORE-AUTOCOR API Contract OpenAPI\n ip address 10.255.0.1\
      \ 255.255.255.0\n no shutdown\ninterface Loopback0\n description DEVCORE-AUTOCOR API Contract OpenAPI\n\
      \ ip address 10.255.255.1 255.255.255.255\n no shutdown\nend"
  interfaces:
