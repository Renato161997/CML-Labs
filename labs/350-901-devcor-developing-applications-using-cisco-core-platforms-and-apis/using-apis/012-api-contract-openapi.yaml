lab:
  title: 'OpenAPI: Pinned Contracts, Response Drift and Factual Limits'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# OpenAPI: Pinned Contracts, Response Drift and Factual Limits


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/350-901-012-api-contract-openapi.md


    Two isolated native protocol-services guests exchange real HTTP between CLIENT 198.18.0.2 and SERVER
    198.18.0.1:8080. The fixed teaching OpenAPI 3.1.1 document declares GET /devices/{device_id}, a path
    parameter, a public classroom API-key header, documented status/media responses and local Device/Error
    schemas. The default Schema Object dialect is explicitly JSON Schema Draft 2020-12, as described in
    the [OpenAPI specification](https://spec.openapis.org/oas/v3.1.1.html). The client uses the actual
    [jsonschema validator/check_schema implementation](https://python-jsonschema.readthedocs.io/en/stable/validate/)
    for the selected component schema. This exercise is not a general OpenAPI document validator, all-version
    conformance test or Cisco product API.


    The client carries its agreed contract snapshot and rejects a changed remote document before accepting
    a response or a schema reference. Only the fixed local component references are allowed; no remote
    reference or server-selected destination is fetched. HTTP 200 alone is insufficient: the documented
    response status, exact JSON media type, required fields/types and additional-property restrictions
    must all hold. Duplicate JSON fields, non-JSON numeric constants and oversized responses are rejected.
    The normal Device response reports the guest''s actual eth1 carrier through its kernel sysfs file.
    It does not represent a physical router inventory.


    An authorized GET establishes the baseline. Real missing-key 401, invalid-parameter 400 and missing-device
    404 bodies must satisfy the declared error schema. An undocumented POST must actually return 405 with
    Allow: GET. Controlled faults then return a string instead of a boolean, an undeclared 201, an incorrect
    media type and a changed contract version; each must be rejected while independent ICMP remains usable,
    then recovered. Finally the source deliberately reports carrier false with otherwise valid structure.
    The validator must accept that schema-valid value, while an independent server sysfs read and actual
    packets prove the interface is up. This counterexample demonstrates that structural validation alone
    does not prove factual truth or provenance. Restore actual facts and recover the baseline.


    The API key is an explicit public training fixture. HTTP is plaintext on a closed link; a pinned document
    hash is an agreed-byte comparison, not authenticated source identity or encryption. No device change,
    live vendor service, production credential, external connector or Internet reference is used. Native
    guests share their compute kernel. Only the imported copy may be stopped/wiped. Each protocol-services
    node budgets 1024MiB.



    Objectives:

    - Use a pinned operation contract plus actual JSON Schema validation on real HTTP responses.

    - Distinguish authentication/resource errors, schema drift, wrong media/status and contract changes
    from network loss.

    - Demonstrate why schema-valid data still needs independent factual and source evidence.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
