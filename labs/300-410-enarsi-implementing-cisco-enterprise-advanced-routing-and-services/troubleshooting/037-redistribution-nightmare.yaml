lab:
  title: Redistribution Nightmare
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Redistribution Nightmare


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-037-redistribution-nightmare.md


    Four IOL-XE routers form two routing domains with two ASBRs. The live service is LEFT Loopback100203.0.113.100/32;
    LEFT Loopback0192.0.2.1/32 is an independent healthy control. Explicit prefix lists limit redistribution
    to the exercise endpoints. OSPF-origin routes receive tag100 in EIGRP; EIGRP-origin routes receive
    tag200 in OSPF. Both boundaries initially reject returned-origin tags. B3 external EIGRP distance
    is deliberately lowered to90 before removing its E2O tag100 rejection and B2 O2E tag200 rejection.
    Both sides of the returned-origin protection must be disabled to sustain feedback. Acceptance requires
    the changed route selection and an actual external LSA advertised by B3, not just configuration presence.
    With the original service interface shut down, a route must persist through redistribution feedback
    while the real service fails and the independent endpoint remains healthy. Restoring the tag guard
    and normal distance must withdraw that ghost route before the service is restored. This is a bounded
    four-router control-plane feedback exercise, not a production convergence or general loop-freedom
    proof. Nominal RAM is4GiB.


    Objectives:

    - Trace a real OSPF-origin service through two independent OSPF/EIGRP redistribution boundaries.

    - Change the second boundary external administrative distance, then remove its origin-tag export guard
    and observe an actual reflected external LSA.

    - Withdraw the original service and distinguish a persistent feedback route from real reachability;
    repair origin filtering and distance before restoring service.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: LEFT
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname LEFT\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Loopback100\n ip address 203.0.113.100 255.255.255.255\n no shutdown\n exit\ninterface Ethernet0/0\n\
      \ ip address 198.18.12.1 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/1\n ip address\
      \ 198.18.13.1 255.255.255.252\n no shutdown\n exit\nrouter ospf 1\n router-id 192.0.2.1\n passive-interface\
      \ default\n no passive-interface Ethernet0/0\n no passive-interface Ethernet0/1\n no passive-interface\
      \ Loopback0\n no passive-interface Loopback100\n exit\ninterface Ethernet0/0\n ip ospf 1 area 0\n\
      \ ip ospf network point-to-point\n exit\ninterface Ethernet0/1\n ip ospf 1 area 0\n ip ospf network\
      \ point-to-point\n exit\ninterface Loopback0\n ip ospf 1 area 0\n ip ospf network point-to-point\n\
      \ exit\ninterface Loopback100\n ip ospf 1 area 0\n ip ospf network point-to-point\n exit\nend\n"
