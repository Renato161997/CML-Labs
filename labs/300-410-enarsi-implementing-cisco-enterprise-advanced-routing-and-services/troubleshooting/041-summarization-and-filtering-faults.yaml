lab:
  title: Summarization And Filtering Faults
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Summarization And Filtering Faults


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-041-summarization-and-filtering-faults.md


    Requires three IOL-XE nodes. R2 is the area 0/10 ABR and summarizes two real /32 loopbacks into 192.0.2.0/24.
    The unused .99 address is deliberately not an endpoint; its covering route does not imply reachability.
    The filter fault uses the explicit area-range not-advertise flag, suppressing the aggregate and its
    components outside area 10. The test checks route withdrawal and packet loss separately from adjacency
    health, then restores advertisement.


    Objectives:

    - Verify an ABR aggregate and both real component endpoints.

    - Explain the summary discard route and why an unused covered address is not a live endpoint.

    - Suppress and restore the range advertisement while verifying that both OSPF adjacencies remain healthy.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 203.0.113.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.12.1 255.255.255.252\n no shutdown\n exit\nrouter ospf 1\n router-id\
      \ 203.0.113.1\n network 198.18.12.0 0.0.0.3 area 0\n network 203.0.113.1 0.0.0.0 area 0\n exit\n\
      end\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
