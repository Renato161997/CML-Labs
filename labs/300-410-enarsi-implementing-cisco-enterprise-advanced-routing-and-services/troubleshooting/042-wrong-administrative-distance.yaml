lab:
  title: Wrong Administrative Distance
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Wrong Administrative Distance


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-042-wrong-administrative-distance.md


    Requires two IOL-XE nodes. OSPF runs only over the primary /30; a second link carries distance-250
    backup routes. The fault changes only R1 administrative preference, not link health or OSPF configuration.
    A successful ping can hide this policy error, so fresh receiver ACL counters prove which link actually
    carried requests. Replies may remain asymmetric. This is an administrative-distance exercise, not
    a physical-link failover or throughput test.


    Objectives:

    - Verify that OSPF wins over a genuinely floating static route.

    - Lower the static administrative distance and diagnose the changed RIB and real request ingress path.

    - Restore the distance without resetting the healthy OSPF adjacency.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/1\n\
      \ ip address 198.18.1.1 255.255.255.252\n no shutdown\n exit\nip route 192.0.2.2 255.255.255.255\
      \ 198.18.1.2 250\nrouter ospf 1\n router-id 192.0.2.1\n network 198.18.0.0 0.0.0.3 area 0\n network\
      \ 192.0.2.1 0.0.0.0 area 0\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.2 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/1\n\
      \ ip address 198.18.1.2 255.255.255.252\n no shutdown\n exit\nip route 192.0.2.1 255.255.255.255\
      \ 198.18.1.1 250\nrouter ospf 1\n router-id 192.0.2.2\n network 198.18.0.0 0.0.0.3 area 0\n network\
      \ 192.0.2.2 0.0.0.0 area 0\n exit\nip access-list extended AD-PRIMARY\n permit icmp host 192.0.2.1\
      \ host 192.0.2.2\n permit ip any any\n exit\ninterface Ethernet0/0\n ip access-group AD-PRIMARY\
      \ in\n exit\nip access-list extended AD-SECONDARY\n permit icmp host 192.0.2.1 host 192.0.2.2\n\
      \ permit ip any any\n exit\ninterface Ethernet0/1\n ip access-group AD-SECONDARY in\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
- id: l1
  n1: n0
  i1: i2
  n2: n1
  i2: i2
annotations: []
smart_annotations: []
