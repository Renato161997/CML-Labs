lab:
  title: MPLS L3VPN Concepts
  description: 300-410 ENARSI - Implementing Cisco Enterprise Advanced Routing and Services importable
    CML topology.
  notes: '300-410 ENARSI blueprint lab: MPLS L3VPN Concepts


    Topics:

    - MPLS

    - L3VPN

    - PE/CE


    Tasks:

    1. Identify PE/CE roles

    2. Model VPN routing

    3. Trace customer route exchange


    Useful checks:

    - show ip interface brief

    - show running-config

    - show ip route

    - show ip protocols

    - ping and traceroute between endpoints'
