lab:
  title: MPLS L3VPN Concepts
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# MPLS L3VPN Concepts


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-024-mpls-l3vpn-concepts.md


    Distinct per-PE route distinguishers share one explicit import/export route target. Five IOSv guests
    implement a real small MPLS L3VPN, not GRE renamed as MPLS. VPNv4 convergence has an explicit bounded
    wait because the initial BGP TCP attempt can precede OSPF reachability; a process-up indication is
    never accepted as a route. PE-CE static routes supply customer prefixes, OSPF supplies provider loopbacks,
    LDP supplies transport labels and VPNv4 BGP carries labeled VPN routes with route-target communities.
    The transit P router must lack the customer /32 in its global routing table yet switch actual labeled
    bytes. Route-target withdrawal must remove only the imported VPN route while transport stays healthy.
    All interfaces are isolated and all addresses educational. Nominal RAM is 5x512 MiB. This is software
    forwarding and protocol validation, not hardware throughput, carrier design scale or entitlement to
    redistribute IOSv. Cisco lists MPLS L3VPN among IOSv features: https://developer.cisco.com/docs/modeling-labs/iosv/
    .


    Objectives:

    - Establish actual OSPF transport, LDP labels and VPNv4 BGP between provider edge routers.

    - Carry real customer loopback traffic while the transit router has no global customer route.

    - Remove only the import route target, observe VPN failure with healthy provider transport, and restore
    it.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: PE1
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname PE1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nno logging console\nip vrf CUST\n rd 65000:1\n route-target\
      \ both 65000:10\n exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n\
      \ exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n mpls\
      \ ip\n exit\ninterface GigabitEthernet0/1\n ip vrf forwarding CUST\n ip address 198.18.10.1 255.255.255.252\n\
      \ no shutdown\n exit\nmpls label protocol ldp\nmpls ldp router-id Loopback0 force\nrouter ospf 1\n\
      \ router-id 192.0.2.1\n network 192.0.2.1 0.0.0.0 area 0\n network 198.18.0.0 0.0.0.3 area 0\n exit\n\
      ip route vrf CUST 192.0.2.10 255.255.255.255 198.18.10.2\nrouter bgp 65000\n bgp router-id 192.0.2.1\n\
      \ no bgp default ipv4-unicast\n neighbor 192.0.2.3 remote-as 65000\n neighbor 192.0.2.3 update-source\
      \ Loopback0\n address-family vpnv4\n  neighbor 192.0.2.3 activate\n  neighbor 192.0.2.3 send-community\
      \ extended\n exit-address-family\n address-family ipv4 vrf CUST\n  redistribute static\n exit-address-family\n\
      \ exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
