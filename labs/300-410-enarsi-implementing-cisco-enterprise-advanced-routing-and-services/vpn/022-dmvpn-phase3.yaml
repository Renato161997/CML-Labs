lab:
  title: DMVPN Phase 3
  description: 300-410 ENARSI - Implementing Cisco Enterprise Advanced Routing and Services importable
    CML topology.
  notes: '300-410 ENARSI blueprint lab: DMVPN Phase 3


    Topics:

    - DMVPN phase 3

    - NHRP redirect


    Tasks:

    1. Enable redirects

    2. Optimize spoke paths

    3. Verify NHRP cache


    Useful checks:

    - show ip interface brief

    - show running-config

    - show ip route

    - show ip protocols

    - ping and traceroute between endpoints'
  version: 0.3.1
