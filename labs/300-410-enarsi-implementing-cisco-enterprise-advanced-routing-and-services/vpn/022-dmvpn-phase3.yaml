lab:
  title: DMVPN Phase 3
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# DMVPN Phase 3


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-022-dmvpn-phase3.md


    Three IOSv routers share an isolated Layer2 benchmark-address underlay. The hub and both spokes use
    mGRE, NHRP and AES256/SHA256 IPsec transport protection with PFS14. Phase2 disables hub EIGRP next-hop-self
    so spokes learn direct overlay next hops. Phase3 retains the hub next hop, advertises a /24 summary
    and uses actual NHRP redirect/shortcut processing to install a more-specific path. Direct-peer NHRP
    and IPsec packet counters are checked separately from hub registration and routed pings. IKEv1 and
    the PUBLIC CML-DMVPN-PUBLIC-ONLY / CMLONLY strings are disposable legacy interoperability fixtures,
    never production credentials or a production security recommendation. MTU/MSS are conservative lab
    settings; scale, throughput and Internet NAT traversal are outside scope. Nominal RAM is 3x512+768
    MiB. A protocol-specific ESP ingress ACL drops only direct SPOKE-A to SPOKE-B encrypted packets while
    ICMP underlay and the encrypted hub path remain healthy; removing that attachment restores payload
    forwarding.


    Objectives:

    - Register real NHRP mappings over mGRE protected with actual IPsec.

    - Verify the distinct Phase2 next-hop or Phase3 aggregate/shortcut behavior with real spoke-to-spoke
    traffic.

    - Isolate the intended authentication or ESP forwarding fault while preserving the healthy underlay,
    then recover.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: HUB
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname HUB\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nno logging console\ninterface Loopback0\n ip address 192.0.2.1\
      \ 255.255.255.255\n no shutdown\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.1 255.255.255.0\n\
      \ no shutdown\n exit\ncrypto isakmp policy 10\n encryption aes 256\n hash sha256\n authentication\
      \ pre-share\n group 14\n lifetime 3600\n exit\ncrypto isakmp key CML-DMVPN-PUBLIC-ONLY address 0.0.0.0\
      \ 0.0.0.0\ncrypto ipsec transform-set DMVPN-SET esp-aes 256 esp-sha256-hmac\n mode transport\n exit\n\
      crypto ipsec profile DMVPN-PROFILE\n set transform-set DMVPN-SET\n set pfs group14\n exit\ninterface\
      \ Tunnel0\n ip address 172.16.0.1 255.255.255.0\n ip mtu 1400\n ip tcp adjust-mss 1360\n no ip redirects\n\
      \ ip nhrp authentication CMLONLY\n ip nhrp network-id 100\n ip nhrp holdtime 180\n ip nhrp map multicast\
      \ dynamic\n no ip split-horizon eigrp 100\n ip nhrp redirect\n ip summary-address eigrp 100 192.0.2.0\
      \ 255.255.255.0\n tunnel source GigabitEthernet0/0\n tunnel mode gre multipoint\n tunnel key 100\n\
      \ tunnel protection ipsec profile DMVPN-PROFILE\n no shutdown\n exit\nrouter eigrp 100\n no auto-summary\n\
      \ network 172.16.0.0 0.0.0.255\n network 192.0.2.1 0.0.0.0\n passive-interface Loopback0\n exit\n\
      end\n"
