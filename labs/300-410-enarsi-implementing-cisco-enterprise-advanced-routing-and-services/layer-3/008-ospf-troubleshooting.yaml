lab:
  title: OSPF Troubleshooting
  description: Deliberately broken exercise; diagnose and repair before acceptance.
  notes: '# OSPF Troubleshooting


    Deliberately broken: R2 advertises area 1 on the transit segment while R1 expects area 0. No external
    connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-008-ospf-troubleshooting.md


    Requires IOL-XE. This is an intentional area mismatch, not an image import error. R2 must join area
    0 on both its endpoint and transit interface.


    Objectives:

    - Compare area IDs on the same broadcast segment.

    - Separate working Ethernet/IP from a rejected OSPF neighbor.

    - Repair the area and prove endpoint forwarding.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Loopback0\n ip ospf 1 area 0\n exit\ninterface Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n\
      \ no shutdown\n ip ospf 1 area 0\n exit\nrouter ospf 1\n router-id 192.0.2.1\n passive-interface\
      \ Loopback0\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Loopback0\n ip ospf 1 area 1\n exit\ninterface Ethernet0/0\n ip address 198.18.0.2 255.255.255.252\n\
      \ no shutdown\n ip ospf 1 area 1\n exit\nrouter ospf 1\n router-id 192.0.2.2\n passive-interface\
      \ Loopback0\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
annotations: []
smart_annotations: []
