lab:
  title: Route Map Filtering
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Route Map Filtering


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-010-route-map-filtering.md


    Requires IOL-XE. A route-map with no matching permit has an implicit deny for route filtering. The
    change is made to the prefix-list entry, followed by a soft outbound refresh. No external network
    or production BGP session exists.


    Objectives:

    - Follow a route through prefix-list matching and route-map permit behavior.

    - Add an explicit permit and verify actual advertised reachability.

    - Restore the deny and verify withdrawal without resetting unrelated peers.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\nip bgp-community\
      \ new-format\ninterface Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\n\
      router bgp 65001\n bgp router-id 192.0.2.1\n network 192.0.2.1 mask 255.255.255.255\n neighbor 198.18.0.2\
      \ remote-as 65002\n neighbor 198.18.0.2 advertisement-interval 0\n neighbor 198.18.0.2 send-community\n\
      \ exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n exit\nip bgp-community\
      \ new-format\ninterface Ethernet0/0\n ip address 198.18.0.2 255.255.255.252\n no shutdown\n exit\n\
      interface Ethernet0/1\n ip address 198.18.1.1 255.255.255.252\n no shutdown\n exit\nip prefix-list\
      \ PUBLISH seq 5 permit 192.0.2.2/32\nip prefix-list PUBLISH seq 10 deny 192.0.2.3/32\nroute-map\
      \ EXPORT permit 10\n match ip address prefix-list PUBLISH\n exit\nrouter bgp 65002\n bgp router-id\
      \ 192.0.2.2\n network 192.0.2.2 mask 255.255.255.255\n neighbor 198.18.0.1 remote-as 65001\n neighbor\
      \ 198.18.0.1 advertisement-interval 0\n neighbor 198.18.0.1 send-community\n neighbor 198.18.1.2\
      \ remote-as 65003\n neighbor 198.18.1.2 advertisement-interval 0\n neighbor 198.18.1.2 send-community\n\
      \ neighbor 198.18.0.1 route-map EXPORT out\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n2
  label: R3
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R3\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.3 255.255.255.255\n no shutdown\n exit\nip bgp-community\
      \ new-format\ninterface Ethernet0/0\n ip address 198.18.1.2 255.255.255.252\n no shutdown\n exit\n\
      router bgp 65003\n bgp router-id 192.0.2.3\n network 192.0.2.3 mask 255.255.255.255\n neighbor 198.18.1.1\
      \ remote-as 65002\n neighbor 198.18.1.1 advertisement-interval 0\n neighbor 198.18.1.1 send-community\n\
      \ exit\nend\n"
  cpu_limit: 50
