lab:
  title: OSPF Stub And NSSA
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# OSPF Stub And NSSA


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-006-ospf-stub-nssa.md


    Requires three IOL-XE nodes. R2 is the area 0/10 ABR; R3 exports only its loopback through an explicit
    connected-route map. A stub area cannot host this ASBR export, so the exercise removes redistribution
    before converting both ends. The withdrawal is evidence of removing that export, not proof that a
    stub silently accepts an ASBR and filters it. The stub default and matching adjacency are checked
    separately. The complete NSSA baseline is restored at the end.


    Objectives:

    - Observe NSSA Type-7 export and actual ABR Type-5 translation.

    - Remove the ASBR export before converting the area to a stub, then verify its default route.

    - Restore matching NSSA settings and external redistribution, verifying forwarding again.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.12.1 255.255.255.252\n no shutdown\n exit\nrouter ospf 1\n router-id\
      \ 192.0.2.1\n network 198.18.12.0 0.0.0.3 area 0\n network 192.0.2.1 0.0.0.0 area 0\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.12.2 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/1\n\
      \ ip address 198.18.23.1 255.255.255.252\n no shutdown\n exit\nrouter ospf 1\n router-id 192.0.2.2\n\
      \ network 198.18.12.0 0.0.0.3 area 0\n network 198.18.23.0 0.0.0.3 area 10\n network 192.0.2.2 0.0.0.0\
      \ area 0\n area 10 nssa\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n2
  label: R3
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R3\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.3 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.23.2 255.255.255.252\n no shutdown\n exit\nip prefix-list EXPORT-LOOP\
      \ permit 192.0.2.3/32\nroute-map EXPORT-LOOP permit 10\n match ip address prefix-list EXPORT-LOOP\n\
      \ exit\nrouter ospf 1\n router-id 192.0.2.3\n network 198.18.23.0 0.0.0.3 area 10\n area 10 nssa\n\
      \ redistribute connected subnets route-map EXPORT-LOOP\n exit\nend\n"
  cpu_limit: 50
  priority: 98
  x: 520
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
- id: l1
  n1: n1
  i1: i2
  n2: n2
  i2: i1
annotations: []
