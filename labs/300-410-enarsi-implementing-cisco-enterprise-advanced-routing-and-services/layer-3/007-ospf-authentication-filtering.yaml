lab:
  title: OSPF Authentication Filtering
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# OSPF Authentication Filtering


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-007-ospf-authentication-filtering.md


    Requires three IOL-XE nodes. CML-OSPF-LAB is a PUBLIC disposable MD5 exercise key, not a secret or
    a current production cryptography recommendation. Both ends of the authenticated link use matching
    2-second hello and 8-second dead timers. A distribute-list filters local RIB installation, not the
    OSPF link-state database; the exercise explicitly shows the resulting transit black hole even while
    R1 retains the advertised destination. No external connector is present.


    Objectives:

    - Verify an authenticated adjacency and real end-to-end forwarding.

    - Mismatch and restore the public exercise-only MD5 key, observing adjacency-dependent route withdrawal.

    - Apply a local OSPF RIB filter and distinguish unchanged LSA propagation from failed transit forwarding.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.12.1 255.255.255.252\n no shutdown\n ip ospf authentication message-digest\n\
      \ ip ospf message-digest-key 1 md5 CML-OSPF-LAB\n ip ospf hello-interval 2\n ip ospf dead-interval\
      \ 8\n exit\nrouter ospf 1\n router-id 192.0.2.1\n network 198.18.12.0 0.0.0.3 area 0\n network 192.0.2.1\
      \ 0.0.0.0 area 0\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
