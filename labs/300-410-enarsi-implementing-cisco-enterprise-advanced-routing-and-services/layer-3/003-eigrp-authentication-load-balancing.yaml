lab:
  title: EIGRP Authentication Load Balancing
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# EIGRP Authentication Load Balancing


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-003-eigrp-authentication-load-balancing.md


    Requires IOL-XE named EIGRP. The public CML-LAB-ONLY string is intentionally a disposable exercise
    key, never a production credential. Both links use HMAC-SHA-256; a mismatch must remove only the affected
    adjacency.


    Objectives:

    - Verify two authenticated adjacencies and equal-cost next hops.

    - Introduce one incorrect lab-only HMAC key and observe that adjacency fail.

    - Keep forwarding on the healthy link, then restore both peers.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/1\n\
      \ ip address 198.18.1.1 255.255.255.252\n no shutdown\n exit\nrouter eigrp SECURE\n address-family\
      \ ipv4 unicast autonomous-system 100\n  eigrp router-id 192.0.2.1\n  network 192.0.2.1 0.0.0.0\n\
      \  network 198.18.0.0 0.0.0.3\n  network 198.18.1.0 0.0.0.3\n  af-interface Ethernet0/0\n   authentication\
      \ mode hmac-sha-256 CML-LAB-ONLY\n  exit-af-interface\n  af-interface Ethernet0/1\n   authentication\
      \ mode hmac-sha-256 CML-LAB-ONLY\n  exit-af-interface\n exit-address-family\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.2 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/1\n\
      \ ip address 198.18.1.2 255.255.255.252\n no shutdown\n exit\nrouter eigrp SECURE\n address-family\
      \ ipv4 unicast autonomous-system 100\n  eigrp router-id 192.0.2.2\n  network 192.0.2.2 0.0.0.0\n\
      \  network 198.18.0.0 0.0.0.3\n  network 198.18.1.0 0.0.0.3\n  af-interface Ethernet0/0\n   authentication\
      \ mode hmac-sha-256 CML-LAB-ONLY\n  exit-af-interface\n  af-interface Ethernet0/1\n   authentication\
      \ mode hmac-sha-256 CML-LAB-ONLY\n  exit-af-interface\n exit-address-family\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
- id: l1
  n1: n0
  i1: i2
  n2: n1
  i2: i2
annotations: []
smart_annotations: []
