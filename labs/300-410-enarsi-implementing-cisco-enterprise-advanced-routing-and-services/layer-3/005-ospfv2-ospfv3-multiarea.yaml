lab:
  title: OSPFv2 OSPFv3 Multiarea
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# OSPFv2 OSPFv3 Multiarea


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-005-ospfv2-ospfv3-multiarea.md


    Requires IOL-XE. R2 is the ABR for two independent OSPF processes: OSPFv2 carries IPv4 and OSPFv3
    carries IPv6. Documentation prefixes are used throughout; no redistribution between protocols is configured.


    Objectives:

    - Identify the ABR between backbone area 0 and area 10.

    - Compare IPv4 and IPv6 inter-area routes.

    - Prove bidirectional endpoint forwarding in both address families.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\nipv6 unicast-routing\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n\
      \ exit\ninterface Loopback0\n ipv6 address 2001:db8:1::1/128\n ip ospf 1 area 0\n ipv6 ospf 10 area\
      \ 0\n exit\nrouter ospf 1\n router-id 192.0.2.1\n passive-interface Loopback0\n exit\nipv6 router\
      \ ospf 10\n router-id 192.0.2.1\n passive-interface Loopback0\n exit\ninterface Ethernet0/0\n ip\
      \ address 198.18.0.1 255.255.255.252\n no shutdown\n ipv6 address 2001:db8:12::1/64\n ip ospf 1\
      \ area 0\n ipv6 ospf 10 area 0\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\nipv6 unicast-routing\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n\
      \ exit\ninterface Loopback0\n ipv6 address 2001:db8:2::2/128\n ip ospf 1 area 0\n ipv6 ospf 10 area\
      \ 0\n exit\nrouter ospf 1\n router-id 192.0.2.2\n passive-interface Loopback0\n exit\nipv6 router\
      \ ospf 10\n router-id 192.0.2.2\n passive-interface Loopback0\n exit\ninterface Ethernet0/0\n ip\
      \ address 198.18.0.2 255.255.255.252\n no shutdown\n ipv6 address 2001:db8:12::2/64\n ip ospf 1\
      \ area 0\n ipv6 ospf 10 area 0\n exit\ninterface Ethernet0/1\n ip address 198.18.1.1 255.255.255.252\n\
      \ no shutdown\n ipv6 address 2001:db8:23::2/64\n ip ospf 1 area 10\n ipv6 ospf 10 area 10\n exit\n\
      end\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n2
  label: R3
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R3\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\nipv6 unicast-routing\ninterface Loopback0\n ip address 192.0.2.3 255.255.255.255\n no shutdown\n\
      \ exit\ninterface Loopback0\n ipv6 address 2001:db8:3::3/128\n ip ospf 1 area 10\n ipv6 ospf 10\
      \ area 10\n exit\nrouter ospf 1\n router-id 192.0.2.3\n passive-interface Loopback0\n exit\nipv6\
      \ router ospf 10\n router-id 192.0.2.3\n passive-interface Loopback0\n exit\ninterface Ethernet0/0\n\
      \ ip address 198.18.1.2 255.255.255.252\n no shutdown\n ipv6 address 2001:db8:23::3/64\n ip ospf\
      \ 1 area 10\n ipv6 ospf 10 area 10\n exit\nend\n"
  cpu_limit: 50
  priority: 98
  x: 520
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
