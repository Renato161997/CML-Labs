lab:
  title: VRF Lite Routing Protocols
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# VRF Lite Routing Protocols


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-012-vrf-lite-routing-protocols.md


    Requires IOL-XE. Separate physical links and OSPF processes carry RED and BLUE. Both VRFs deliberately
    reuse the same transit and endpoint IP addresses. No route leaking or MPLS is configured; reachability
    is always qualified by VRF.


    Objectives:

    - Trace independent OSPF adjacencies inside two VRFs.

    - Reuse overlapping addressing without leaking routes.

    - Verify each VRF forwards and the global table does not.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\nip vrf\
      \ RED\n rd 65000:1\n exit\ninterface Ethernet0/0\n ip vrf forwarding RED\n ip address 198.18.0.1\
      \ 255.255.255.252\n no shutdown\n exit\ninterface Loopback10\n ip vrf forwarding RED\n ip address\
      \ 203.0.113.1 255.255.255.255\n exit\nrouter ospf 10 vrf RED\n router-id 192.0.2.1\n network 198.18.0.0\
      \ 0.0.0.3 area 0\n network 203.0.113.1 0.0.0.0 area 0\n passive-interface Loopback10\n exit\nip\
      \ vrf BLUE\n rd 65000:2\n exit\ninterface Ethernet0/1\n ip vrf forwarding BLUE\n ip address 198.18.0.1\
      \ 255.255.255.252\n no shutdown\n exit\ninterface Loopback20\n ip vrf forwarding BLUE\n ip address\
      \ 203.0.113.1 255.255.255.255\n exit\nrouter ospf 20 vrf BLUE\n router-id 198.51.100.1\n network\
      \ 198.18.0.0 0.0.0.3 area 0\n network 203.0.113.1 0.0.0.0 area 0\n passive-interface Loopback20\n\
      \ exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n exit\nip vrf\
      \ RED\n rd 65000:1\n exit\ninterface Ethernet0/0\n ip vrf forwarding RED\n ip address 198.18.0.2\
      \ 255.255.255.252\n no shutdown\n exit\ninterface Loopback10\n ip vrf forwarding RED\n ip address\
      \ 203.0.113.2 255.255.255.255\n exit\nrouter ospf 10 vrf RED\n router-id 192.0.2.2\n network 198.18.0.0\
      \ 0.0.0.3 area 0\n network 203.0.113.2 0.0.0.0 area 0\n passive-interface Loopback10\n exit\nip\
      \ vrf BLUE\n rd 65000:2\n exit\ninterface Ethernet0/1\n ip vrf forwarding BLUE\n ip address 198.18.0.2\
      \ 255.255.255.252\n no shutdown\n exit\ninterface Loopback20\n ip vrf forwarding BLUE\n ip address\
      \ 203.0.113.2 255.255.255.255\n exit\nrouter ospf 20 vrf BLUE\n router-id 198.51.100.2\n network\
      \ 198.18.0.0 0.0.0.3 area 0\n network 203.0.113.2 0.0.0.0 area 0\n passive-interface Loopback20\n\
      \ exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
- id: l1
  n1: n0
  i1: i2
  n2: n1
  i2: i2
annotations: []
smart_annotations: []
