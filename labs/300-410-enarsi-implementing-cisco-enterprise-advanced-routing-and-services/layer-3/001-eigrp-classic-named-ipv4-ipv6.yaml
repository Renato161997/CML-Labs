lab:
  title: EIGRP Classic Named IPv4 IPv6
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# EIGRP Classic Named IPv4 IPv6


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-001-eigrp-classic-named-ipv4-ipv6.md


    Requires IOL-XE. The autonomous-system number must match in each address family even though the configuration
    styles differ. A successful IPv4 adjacency does not prove IPv6 is working.


    Objectives:

    - Compare classic configuration on R1 with named address families on R2.

    - Verify independent IPv4 and IPv6 adjacencies and learned routes.

    - Prove both address families forward between the endpoint loopbacks.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\nipv6 unicast-routing\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n\
      \ exit\ninterface Loopback0\n ipv6 address 2001:db8:1::1/128\n exit\ninterface Ethernet0/0\n ip\
      \ address 198.18.0.1 255.255.255.252\n no shutdown\n ipv6 address 2001:db8:12::1/64\n exit\nrouter\
      \ eigrp 100\n network 198.18.0.0 0.0.0.3\n network 192.0.2.1 0.0.0.0\n passive-interface Loopback0\n\
      \ no auto-summary\n exit\nipv6 router eigrp 100\n eigrp router-id 192.0.2.1\n no shutdown\n exit\n\
      interface Ethernet0/0\n ipv6 eigrp 100\n exit\ninterface Loopback0\n ipv6 eigrp 100\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\nipv6 unicast-routing\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n\
      \ exit\ninterface Loopback0\n ipv6 address 2001:db8:2::2/128\n exit\ninterface Ethernet0/0\n ip\
      \ address 198.18.0.2 255.255.255.252\n no shutdown\n ipv6 address 2001:db8:12::2/64\n exit\nrouter\
      \ eigrp LAB\n address-family ipv4 unicast autonomous-system 100\n  eigrp router-id 192.0.2.2\n \
      \ network 198.18.0.0 0.0.0.3\n  network 192.0.2.2 0.0.0.0\n  af-interface Loopback0\n   passive-interface\n\
      \  exit-af-interface\n exit-address-family\n address-family ipv6 unicast autonomous-system 100\n\
      \  eigrp router-id 192.0.2.2\n  af-interface Ethernet0/0\n   no shutdown\n  exit-af-interface\n\
      \  af-interface Loopback0\n   passive-interface\n   no shutdown\n  exit-af-interface\n  no shutdown\n\
      \ exit-address-family\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
annotations: []
smart_annotations: []
