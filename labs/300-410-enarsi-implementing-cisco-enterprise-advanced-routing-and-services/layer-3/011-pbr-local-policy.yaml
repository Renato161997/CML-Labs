lab:
  title: Policy Based Routing Local Policy
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Policy Based Routing Local Policy


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-011-pbr-local-policy.md


    Requires three IOL-XE nodes. Two separate /30 links join R1 and R2; the normal static route selects
    198.18.0.2, while the PBR next hop is 198.18.1.2. Named receiver ingress ACL counters identify the
    actual request path, not just a configured route-map or successful ping. Return traffic deliberately
    uses the primary link. Clearing only the two disposable observer ACL counters prevents old matches
    from masquerading as a current path measurement. No throughput or physical-failure claim is made.


    Objectives:

    - Compare the ordinary RIB with the ingress path measured on the receiver.

    - Show that interface PBR affects forwarded client traffic but not router-originated traffic.

    - Apply and remove local PBR, verifying the actual path with fresh counters each time.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/1\n\
      \ ip address 198.18.1.1 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/2\n ip address\
      \ 198.18.10.1 255.255.255.0\n no shutdown\n exit\nip route 192.0.2.2 255.255.255.255 198.18.0.2\n\
      ip access-list extended SELECT-LAN\n permit icmp 198.18.10.0 0.0.0.255 host 192.0.2.2\n exit\nroute-map\
      \ PBR permit 10\n match ip address SELECT-LAN\n set ip next-hop 198.18.1.2\n exit\ninterface Ethernet0/2\n\
      \ ip policy route-map PBR\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.2 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/1\n\
      \ ip address 198.18.1.2 255.255.255.252\n no shutdown\n exit\nip route 198.18.10.0 255.255.255.0\
      \ 198.18.0.1\nip access-list extended OBSERVE-PRIMARY\n 10 permit icmp 198.18.10.0 0.0.0.255 host\
      \ 192.0.2.2\n 20 permit ip any any\n exit\ninterface Ethernet0/0\n ip access-group OBSERVE-PRIMARY\
      \ in\n exit\nip access-list extended OBSERVE-POLICY\n 10 permit icmp 198.18.10.0 0.0.0.255 host\
      \ 192.0.2.2\n 20 permit ip any any\n exit\ninterface Ethernet0/1\n ip access-group OBSERVE-POLICY\
      \ in\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n2
  label: CLIENT
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname CLIENT\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Ethernet0/0\n ip address 198.18.10.10 255.255.255.0\n no shutdown\n exit\nip route\
      \ 0.0.0.0 0.0.0.0 198.18.10.1\nend\n"
  cpu_limit: 50
  priority: 98
  x: 520
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
- id: l1
  n1: n0
  i1: i2
  n2: n1
  i2: i2
- id: l2
  n1: n2
  i1: i1
  n2: n0
  i2: i3
annotations: []
smart_annotations: []
