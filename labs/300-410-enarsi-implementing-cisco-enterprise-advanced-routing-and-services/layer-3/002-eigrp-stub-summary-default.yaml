lab:
  title: EIGRP Stub Summary Default
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# EIGRP Stub Summary Default


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-002-eigrp-stub-summary-default.md


    Requires IOL-XE. R1 uses the default from CORE; STUB advertises a /25 summary covering its two endpoint
    networks. The automatic Null0 summary route prevents accidental forwarding loops for unused addresses
    in the aggregate.


    Objectives:

    - Identify a stub peer and explain its query boundary.

    - Observe the /25 aggregate instead of the two endpoint /26s.

    - Use the default advertised to R1 and prove return routing.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.200 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\nrouter eigrp 100\n no\
      \ auto-summary\n network 192.0.2.200 0.0.0.0\n network 198.18.0.0 0.0.0.3\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: CORE
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname CORE\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Ethernet0/0\n ip address 198.18.0.2 255.255.255.252\n no shutdown\n ip summary-address\
      \ eigrp 100 0.0.0.0 0.0.0.0\n exit\ninterface Ethernet0/1\n ip address 198.18.1.1 255.255.255.252\n\
      \ no shutdown\n exit\nrouter eigrp 100\n no auto-summary\n network 198.18.0.0 0.0.0.3\n network\
      \ 198.18.1.0 0.0.0.3\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n2
  label: STUB
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname STUB\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Ethernet0/0\n ip address 198.18.1.2 255.255.255.252\n no shutdown\n ip summary-address\
      \ eigrp 100 192.0.2.0 255.255.255.128\n exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.192\n\
      \ no shutdown\n exit\ninterface Loopback1\n ip address 192.0.2.65 255.255.255.192\n no shutdown\n\
      \ exit\nrouter eigrp 100\n no auto-summary\n network 198.18.1.0 0.0.0.3\n network 192.0.2.0 0.0.0.127\n\
      \ eigrp stub connected summary\n exit\nend\n"
  cpu_limit: 50
