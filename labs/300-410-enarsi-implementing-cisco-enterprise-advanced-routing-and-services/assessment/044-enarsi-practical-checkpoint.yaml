lab:
  title: 'ENARSI Practical: Routing, DNS and Source Policy'
  description: Deliberately broken exercise; diagnose and repair before acceptance.
  notes: '# ENARSI Practical: Routing, DNS and Source Policy


    Deliberately broken: The service-facing OSPF area is mismatched and the source ACL denies the authorized
    loopback; the baseline checks intentionally diagnose both before the staged repairs. No external connector
    or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-044-enarsi-practical-checkpoint.md


    Three IOL-XE nodes provide a deliberately broken two-stage assessment. ABR uses area10 on its service
    link while SERVICE uses area20; no adjacency can form. A separate outbound ICMP rule also denies the
    authorized CLIENT Loopback0 source instead of the intended unauthorized Loopback66. The first repair
    must restore inter-area routing, but service traffic from the authorized source must still fail, resolve
    its actual DNS name and hit the exact ACL deny. A separate transit-source probe must reach the same
    service. The second repair changes only that ACL source selector, recovers authorized named-service
    traffic and still denies the unauthorized loopback with a measured counter. No user workstation, Internet
    DNS or production address is used. This practical checkpoint covers interacting OSPF, DNS and source-policy
    faults, not the entire exam blueprint. Nominal RAM is3GiB.


    Objectives:

    - Diagnose an OSPF area mismatch using working direct IP controls and missing remote service routes.

    - Repair the IGP, then distinguish successful DNS and healthy transit-source traffic from a source-specific
    service ACL failure.

    - Correct the ACL selector while preserving the unauthorized-source denial and verify its actual packet
    counter.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: CLIENT
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname CLIENT\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Loopback66\n ip address 192.0.2.66 255.255.255.255\n no shutdown\n exit\ninterface Ethernet0/0\n\
      \ ip address 198.18.12.1 255.255.255.252\n no shutdown\n exit\nrouter ospf 1\n router-id 192.0.2.1\n\
      \ passive-interface default\n no passive-interface Ethernet0/0\n no passive-interface Loopback0\n\
      \ no passive-interface Loopback66\n exit\ninterface Ethernet0/0\n ip ospf 1 area 0\n ip ospf network\
      \ point-to-point\n exit\ninterface Loopback0\n ip ospf 1 area 0\n ip ospf network point-to-point\n\
      \ exit\ninterface Loopback66\n ip ospf 1 area 0\n ip ospf network point-to-point\n exit\nip domain\
