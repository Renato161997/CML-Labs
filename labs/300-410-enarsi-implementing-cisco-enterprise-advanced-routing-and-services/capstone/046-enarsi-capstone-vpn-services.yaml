lab:
  title: 'ENARSI Capstone: Dual-Tenant MPLS VPN Isolation'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# ENARSI Capstone: Dual-Tenant MPLS VPN Isolation


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-046-enarsi-capstone-vpn-services.md


    Seven IOSv guests implement two actual MPLS L3VPNs with distinct RDs and route targets65000:10(BLUE)
    and65000:20(RED). Each tenant has a real CE at both sites. OSPF and LDP form the provider underlay;
    VPNv4 BGP carries labeled customer /32 routes, with explicit PE-CE static routes and extended communities.
    BLUE1 has an explicit attempted route toward RED2, and RED2 an attempted return toward BLUE1; the
    provider VRFs initially isolate them. Adding the RED import to PE1 BLUE must install the forward route
    but still fail a complete request/reply because PE2 RED lacks the BLUE return route. Adding that second
    import must make actual BLUE1-to-RED2 ICMP succeed. Both legitimate tenant services and the provider
    transport must remain healthy through the leak and repair stages. Removing each extra import must
    recover isolation; the provider core must lack global customer routes and show real labeled-byte forwarding.
    This is a seven-router software VPN policy exercise, not encryption, firewall state, carrier scale
    or a hardware throughput claim. Nominal RAM is3584MiB. The simulated reference images require the
    user own Cisco entitlement; none are redistributed.


    Objectives:

    - Build two real MPLS L3VPN tenants over OSPF, LDP and VPNv4, proving same-tenant traffic and cross-tenant
    isolation.

    - Leak the forward tenant import and prove the new route is insufficient without a matching return
    path.

    - Leak the return import, observe actual unintended cross-tenant replies, then remove both leaks while
    preserving both legitimate VPN services.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: PE1
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname PE1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nno logging console\ninterface Loopback0\n ip address 192.0.2.1\
      \ 255.255.255.255\n no shutdown\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.1 255.255.255.252\n\
      \ no shutdown\n mpls ip\n exit\nmpls label protocol ldp\nmpls ldp router-id Loopback0 force\nrouter\
      \ ospf 1\n router-id 192.0.2.1\n network 192.0.2.1 0.0.0.0 area 0\n network 198.18.0.0 0.0.0.3 area\
      \ 0\n exit\nip vrf BLUE\n rd 65000:110\n route-target both 65000:10\n exit\ninterface GigabitEthernet0/1\n\
      \ ip vrf forwarding BLUE\n ip address 198.18.11.1 255.255.255.252\n no shutdown\n exit\nip route\
      \ vrf BLUE 192.0.2.11 255.255.255.255 198.18.11.2\nip vrf RED\n rd 65000:120\n route-target both\
      \ 65000:20\n exit\ninterface GigabitEthernet0/2\n ip vrf forwarding RED\n ip address 198.18.12.1\
      \ 255.255.255.252\n no shutdown\n exit\nip route vrf RED 192.0.2.21 255.255.255.255 198.18.12.2\n\
      router bgp 65000\n bgp router-id 192.0.2.1\n no bgp default ipv4-unicast\n neighbor 192.0.2.3 remote-as\
      \ 65000\n neighbor 192.0.2.3 update-source Loopback0\n address-family vpnv4\n  neighbor 192.0.2.3\
      \ activate\n  neighbor 192.0.2.3 send-community extended\n exit-address-family\n address-family\
      \ ipv4 vrf BLUE\n  redistribute static\n exit-address-family\n address-family ipv4 vrf RED\n  redistribute\
      \ static\n exit-address-family\n exit\nend\n"
