      \ exit\ninterface Ethernet0/0\n ip address 198.18.12.2 255.255.255.252\n no shutdown\n exit\ninterface\
      \ Ethernet0/1\n ip address 198.18.23.1 255.255.255.252\n no shutdown\n exit\nrouter ospf 1\n router-id\
      \ 192.0.2.2\n passive-interface default\n no passive-interface Ethernet0/0\n no passive-interface\
      \ Ethernet0/1\n exit\ninterface Ethernet0/0\n ip ospf 1 area 10\n ip ospf network point-to-point\n\
      \ exit\ninterface Ethernet0/1\n ip ospf 1 area 0\n ip ospf network point-to-point\n exit\nend\n"
  cpu_limit: 100
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n2
  label: BORDER
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname BORDER\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Ethernet0/0\n ip address 198.18.23.2 255.255.255.252\n no shutdown\n exit\ninterface\
      \ Ethernet0/1\n ip address 198.18.34.1 255.255.255.252\n no shutdown\n exit\nrouter ospf 1\n router-id\
      \ 192.0.2.3\n passive-interface default\n no passive-interface Ethernet0/0\n exit\ninterface Ethernet0/0\n\
      \ ip ospf 1 area 0\n ip ospf network point-to-point\n exit\nip prefix-list CUSTOMERS seq 10 permit\
      \ 192.0.2.1/32\nip prefix-list PROVIDER-SERVICE permit 198.19.0.80/32\nroute-map IGP-TO-BGP permit\
      \ 10\n match ip address prefix-list CUSTOMERS\n exit\nroute-map BGP-TO-IGP permit 10\n match ip\
      \ address prefix-list PROVIDER-SERVICE\n set tag 65001\n exit\nrouter ospf 1\n redistribute bgp\
      \ 65000 metric 20 metric-type 1 subnets route-map BGP-TO-IGP\n exit\nrouter bgp 65000\n bgp router-id\
      \ 192.0.2.3\n neighbor 198.18.34.2 remote-as 65001\n neighbor 198.18.34.2 timers 3 9\n redistribute\
      \ ospf 1 match internal external 1 external 2 route-map IGP-TO-BGP\n exit\nend\n"
  cpu_limit: 100
  priority: 98
  x: 520
  y: 0
  interfaces:
