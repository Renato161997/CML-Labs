lab:
  title: 'ENARSI Capstone: Inter-Area Routing and Selective BGP Export'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# ENARSI Capstone: Inter-Area Routing and Selective BGP Export


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-045-enarsi-capstone-advanced-routing.md


    Four IOL-XE routers integrate an area10 customer, an area10/0 ABR, a border AS65000 and provider AS65001.
    The provider loopback198.19.0.80 is a real local service endpoint, not Internet access. Only that
    service /32 is redistributed into OSPF E1 with tag65001. The border exports the authorized customer192.0.2.1/32
    through an explicit prefix allowlist; the customer also owns203.0.113.66/32, which must remain unexported.
    The provider ingress observer permits and counts actual alternate-source requests while their replies
    lack a return route. Expanding the allowlist must install the unapproved prefix in real provider BGP
    and make those round trips succeed. Removing it must withdraw only that return prefix, recover the
    failed alternate round trip and preserve authorized service. Each policy edit explicitly re-evaluates
    OSPF redistribution into BGP; it does not reset neighbor sessions. The lesson distinguishes routing
    admission from packet filtering and does not promise security from route absence, high availability,
    IPv6 coverage or complete exam readiness. Nominal RAM is4GiB.


    Objectives:

    - Correlate two-area OSPF, selective eBGP redistribution and actual bidirectional service delivery.

    - Prove an unapproved source request reaches the service but lacks a provider return route; avoid
    calling route admission a packet firewall.

    - Broaden the export allowlist, observe the actual BGP route and successful alternate-source traffic,
    then restore the exact prefix policy and legitimate service.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: CUSTOMER
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname CUSTOMER\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Loopback66\n ip address 203.0.113.66 255.255.255.255\n no shutdown\n exit\ninterface Ethernet0/0\n\
      \ ip address 198.18.12.1 255.255.255.252\n no shutdown\n exit\nrouter ospf 1\n router-id 192.0.2.1\n\
      \ passive-interface default\n no passive-interface Ethernet0/0\n no passive-interface Loopback0\n\
      \ no passive-interface Loopback66\n exit\ninterface Ethernet0/0\n ip ospf 1 area 10\n ip ospf network\
      \ point-to-point\n exit\ninterface Loopback0\n ip ospf 1 area 10\n ip ospf network point-to-point\n\
      \ exit\ninterface Loopback66\n ip ospf 1 area 10\n ip ospf network point-to-point\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: ABR
