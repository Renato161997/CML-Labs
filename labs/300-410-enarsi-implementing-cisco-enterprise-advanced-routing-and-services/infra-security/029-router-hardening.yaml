lab:
  title: Router Hardening
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Router Hardening


    Prepared management addressing and access policy; initialize the ephemeral host key in the documented
    setup phase before testing SSH. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-029-router-hardening.md


    IOL-XE is administered by a dedicated Ubuntu OpenSSH client on an isolated point-to-point link. CML-LAB-ONLY
    and the SNMP credentials, when present, are PUBLIC disposable fixtures. The CML serial console stays
    privileged; network viewer sessions start at privilege1. The SSH helper uses an instance-local known-hosts
    file, accepts a new key only in this isolated exercise and rejects changed keys. This is not a production
    host-key enrollment design. Ephemeral RSA2048 key generation is an explicit setup phase. The source
    ACL contains an explicit deny-any entry so removing its only permit cannot turn an empty ACL into
    a permissive policy. Denial evidence distinguishes transport rejection from wrong credentials or changed
    host identity. This case withdraws and restores only the allowed VTY source while IP reachability
    and the actual enabled SSHv2 server remain healthy.


    Objectives:

    - Initialize a fresh SSH host identity and validate actual network authentication, least privilege
    and closed legacy/web services.

    - Measure the intended management-policy failure while keeping independent positive controls healthy.

    - Restore the policy and verify authenticated service recovery using the same per-instance host identity.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\nip domain\
      \ name lab.example\nusername viewer privilege 1 algorithm-type scrypt secret CML-LAB-ONLY\nno ip\
      \ http server\nno ip http secure-server\nip ssh version 2\nip ssh time-out 30\nip ssh authentication-retries\
      \ 1\nsecurity passwords min-length 12\nlogin on-failure log\nip access-list standard MGMT\n permit\
      \ host 198.18.0.2\n exit\nbanner login @\nCML-SSH-LAB\n@\nline console 0\n privilege level 15\n\
      \ exit\nline vty 0 4\n login local\n transport input ssh\n access-class MGMT in\n exec-timeout 5\
      \ 0\n exit\nno logging console\nip access-list standard MGMT\n deny any\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: DEVBOX
  node_definition: ubuntu
  configuration:
  - name: user-data
    content: "#cloud-config\nhostname: DEVBOX\nmanage_etc_hosts: true\nwrite_files:\n- path: /opt/cml-management/ssh_probe.py\n\
      \  permissions: '0644'\n  encoding: b64\n  content: \n\
      - path: /opt/cml-management/askpass.sh\n  permissions: '0700'\n  content: '#!/bin/sh\n\n    printf\
      \ ''%s\\n'' \"$CML_TEST_PASSWORD\"\n\n    '\n- path: /etc/netplan/90-cml-lab.yaml\n  permissions:\
      \ '0600'\n  content: \"network:\\n  version: 2\\n  ethernets:\\n    ens2:\\n      dhcp4: false\\\
      n\\\n    \\      dhcp6: false\\n      accept-ra: false\\n      addresses: [198.18.0.2/30]\\n\"\n\
      - path: /etc/systemd/system/serial-getty@ttyS0.service.d/autologin.conf\n  permissions: '0644'\n\
      \  content: '[Service]\n\n    ExecStart=\n\n    ExecStart=-/sbin/agetty --autologin root --noclear\
      \ %I $TERM\n\n    '\n- path: /root/.bash_profile\n  permissions: '0600'\n  content: 'export PS1=''root@DEVBOX:\\\
      w# ''\n\n    '\n- path: /opt/cml-management/ssh_policy_probe.py\n  permissions: '0644'\n  encoding:\
      \ b64\n  content: \n\
      runcmd:\n- - netplan\n  - apply\n- - systemctl\n  - daemon-reload\n- - sh\n  - -c\n  - echo CML-LABS-READY\
      \ > /dev/ttyS0\n- - systemctl\n  - restart\n  - serial-getty@ttyS0.service\n"
  cpu_limit: 100
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i1
    label: ens2
    type: physical
    slot: 0
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
annotations: []
smart_annotations: []
