    content: "hostname HOST\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.10 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.2 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/1\n\
      \ ip address 198.18.2.2 255.255.255.252\n no shutdown\n exit\nip route 0.0.0.0 0.0.0.0 198.18.0.1\n\
      end\n"
