lab:
  title: ACL And uRPF
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# ACL And uRPF


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-031-acl-uRPF.md


    Three IOL-XE routers form an intentionally asymmetric triangle. HOST service requests enter GW directly,
    while the explicit reverse host route returns through TRANSIT to the second HOST interface. Actual
    successful baseline traffic proves this is not a missing-return-route failure. Strict uRPF on the
    direct ingress must reject the loopback source and increment verification drops, while a source on
    the directly connected ingress subnet still works. Loose uRPF must recover the asymmetric source because
    its reverse route exists. A separate source-prefix ACL then rejects that same otherwise reachable
    source and counts actual denies. Removing the ACL and finally uRPF must restore the original path.
    This is an IPv4 CEF/source-validation exercise, not identity authentication or a claim that strict
    mode is appropriate for asymmetric production routing. Nominal RAM is3GiB.


    Objectives:

    - Prove an actually working asymmetric return path before applying source validation.

    - Compare strict versus loose uRPF with the reverse route still installed.

    - Separate a source-prefix ACL from RIB reachability and restore the original asymmetric baseline.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: HOST
  node_definition: iol-xe
  configuration:
