lab:
  title: Static Edge To Dynamic Routing
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Static Edge To Dynamic Routing


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-043-static-edge-to-dynamic-routing.md


    Requires three IOL-XE nodes. The initial reference uses four explicit static routes, including transit
    return routes. OSPF point-to-point interface mode is prepared but the routing process is enabled only
    during the documented migration. The final state intentionally uses OSPF for both endpoints and the
    transit router. Reachability is sampled after each step; this is not a continuous-loss measurement
    or a zero-downtime guarantee. Stop/wipe the disposable copy to recover the original static baseline.


    Objectives:

    - Verify a genuinely static forward and return path before migration.

    - Establish both OSPF adjacencies and the full LSDB while static routes still win.

    - Withdraw each explicit endpoint/transit static route only after the dynamic path is available.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.12.1 255.255.255.252\n no shutdown\n ip ospf network point-to-point\n\
      \ exit\nip route 192.0.2.3 255.255.255.255 198.18.12.2\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
