lab:
  title: 'IPv6 First-Hop Security: RA Guard and Recovery'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# IPv6 First-Hop Security: RA Guard and Recovery


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-026-ipv6-first-hop-security.md


    One native three-port software frame guard connects a trusted router, an untrusted advertiser and
    a separate Ubuntu client. GUARD eth1 is trusted, eth2 connects CLIENT ens2, and eth3 connects ROGUE
    ens2. The advertisers are actual Ubuntu router VMs with guest IPv6 forwarding enabled, so their kernel
    Neighbor Advertisements retain router status. RAs carry a 1800-second lifetime to cover manual and
    serial-console observation windows. Only the three specified point-to-point links exist; management
    eth0 is unwired. All endpoint IPv6 addresses belong to 2001:db8:1::/64: ROUTER ::1, CLIENT ::2, ROGUE
    ::66. Explicit link-local addresses are fe80::1, fe80::2 and fe80::66. The client kernel is configured
    to process router advertisements and router preferences. Both advertisers send actual checksum-valid
    ICMPv6 RAs with Hop Limit 255 and a source-link-layer option matching their Ethernet source. The trusted
    router has medium preference; the rogue has high preference.


    The guard actually receives and forwards Ethernet frames through packet sockets, learns source locations
    and filters RAs by incoming port and declared trusted link-local source. It does not stand in for
    a Cisco switch ASIC. The bounded IPv6 parser walks up to four supported extension headers, validates
    RA checksum/code/link-local scope/options and rejects fragments, opaque headers and tagged frames
    outside this untagged exercise. The tested rogue RA includes a real Hop-by-Hop header, so fixed-offset
    ICMP inspection cannot establish protection. Ordinary IPv6 data and neighbor discovery between all
    endpoint ports must remain functional.


    Acceptance first installs the actual trusted kernel default route. Fresh untrusted extension-bearing
    RAs must be observed and blocked while a real route lookup still selects fe80::1 and no rogue default
    exists. Withdrawing only the guard policy must forward those packets: the actual client kernel must
    install the rogue RA route and select fe80::66 because of its higher preference. Re-enabling the guard
    does not erase previously learned routing state. Recovery therefore removes only the observed rogue
    RA default on the owned client, verifies the trusted gateway, and repeats the rogue transmission to
    prove no reinstatement. The lookup target 2001:db8:ffff::1 is never contacted; no Internet forwarding
    through either advertiser is claimed. Actual connected IPv6 ping controls remain healthy throughout.
    Nominal RAM is 6656 MiB (one 512 MiB native guard and three 2048 MiB Ubuntu VMs). This is a specific
    RA-guard and routing-state lesson, not general IPv6 first-hop, SEND, DHCPv6 or vendor-platform certification.


    Objectives:

    - Correlate actual trusted/untrusted Ethernet RA traffic, extension-header parsing and real client
    kernel route selection.

    - Withdraw only ingress RA policy and observe a higher-preference rogue default while connected data
    forwarding remains healthy.

    - Restore the guard, explicitly remove the previously learned rogue route and prove new untrusted
    RAs cannot reinstall it.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
