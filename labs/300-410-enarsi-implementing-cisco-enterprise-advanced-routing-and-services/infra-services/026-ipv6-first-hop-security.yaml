lab:
  title: IPv6 First Hop Security
  description: 300-410 ENARSI - Implementing Cisco Enterprise Advanced Routing and Services importable
    CML topology.
  notes: '300-410 ENARSI blueprint lab: IPv6 First Hop Security


    Topics:

    - RA guard

    - DHCPv6 guard

    - ND inspection


    Tasks:

    1. Model rogue RA

    2. Apply first-hop protection

    3. Verify endpoint behavior


    Useful checks:

    - show ip interface brief

    - show running-config

    - show ip route

    - show ip protocols

    - ping and traceroute between endpoints'
  version: 0.3.1
nodes:
- id: n0
  label: EDGE
  node_definition: iosv
  x: 0
  y: -160
  configuration:
  - name: ios_config.txt
    content: "hostname EDGE\nno ip domain-lookup\nbanner motd ^C ENARSI IPv6 First Hop Security ^C\ninterface\
      \ GigabitEthernet0/0\n description ENARSI IPv6 First Hop Security\n ip address 198.51.100.2 255.255.255.252\n\
      \ no shutdown\ninterface GigabitEthernet0/1\n description ENARSI IPv6 First Hop Security\n ip address\
      \ 10.10.10.1 255.255.255.0\n no shutdown\ninterface GigabitEthernet0/2\n description ENARSI IPv6\
      \ First Hop Security\n ip address 10.10.20.1 255.255.255.0\n no shutdown\nend"
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  priority: 100
  tags: []
- id: n1
  label: INSIDE-SW
  node_definition: iosvl2
  x: -220
  y: 80
  configuration:
  - name: ios_config.txt
    content: "hostname INSIDE-SW\nno ip domain-lookup\nbanner motd ^C ENARSI IPv6 First Hop Security ^C\n\
      vlan 10\n name USERS\nvlan 20\n name SERVERS\nvlan 30\n name GUEST\nvlan 99\n name MGMT\ninterface\
      \ range GigabitEthernet0/1-3\n switchport mode access\n spanning-tree portfast\nend"
  interfaces:
  - id: i0
    label: Loopback0
