lab:
  title: NTP Syslog SNMP
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# NTP Syslog SNMP


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-027-ntp-syslog-snmp.md


    Four isolated guests integrate actual IOL-XE NTP, SNMPv3 authPriv via Net-SNMP and UDP syslog-ng reception.
    Native containers use only their eth1 lab data interfaces; eth0 is not cabled. CLOCK explicitly marks
    its simulated calendar valid and operates as a free-running stratum-3 lab master: synchronization
    demonstrates the protocol and does not establish accurate UTC. Polling is fixed to 16 seconds to bound
    exercise convergence; acceptance waits for selected-peer synchronization, not configuration text.
    The public SNMP credentials/engine ID are disposable fixtures; SHA1/AES128 are explicit reference-image
    interoperability choices. SNMP verifies values and wrong-key rejection through actual requests. UDP
    syslog delivery is checked at its receiver after neighbor discovery. The diagnostic fault hides only
    sysName while retaining authenticated uptime, NTP selection and remote logging; then the original
    view is restored. No external clock, SIEM, Internet connector, production credential, hardware throughput
    or secure-syslog transport is claimed.


    Objectives:

    - Wait for actual NTP synchronization and confirm the selected peer and stratum.

    - Query authenticated/encrypted SNMP with an explicit wrong-key negative control.

    - Generate actual remote syslog, isolate one observability failure and verify the other services remain
    healthy.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
