    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\nno logging console\ninterface Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n\
      \ exit\ninterface Ethernet0/1\n ip address 198.18.1.1 255.255.255.252\n no shutdown\n exit\ninterface\
      \ Ethernet0/2\n ip address 198.18.2.1 255.255.255.252\n no shutdown\n exit\nip access-list standard\
      \ SNMP-SOURCES\n permit 198.18.0.2\n exit\nsnmp-server engineID local 8000000903AABBCC000001\nsnmp-server\
      \ view LABVIEW iso included\nsnmp-server view LABVIEW 1.3.6.1.2.1.1.5 included\nsnmp-server group\
      \ LAB v3 priv read LABVIEW access SNMP-SOURCES\nsnmp-server user CML-SNMP LAB v3 auth sha Cml-Snmp-Auth-Only-983\
      \ priv aes 128 Cml-Snmp-Priv-Only-984\nsnmp-server location ISOLATED-CML-LAB\nlogging on\nlogging\
      \ buffered 32768 informational\nlogging trap informational\nlogging source-interface Ethernet0/1\n\
      logging host 198.18.1.2 transport udp port 514\nntp server 198.18.2.2 version 4 maxpoll 4 minpoll\
      \ 4\nend\n"
