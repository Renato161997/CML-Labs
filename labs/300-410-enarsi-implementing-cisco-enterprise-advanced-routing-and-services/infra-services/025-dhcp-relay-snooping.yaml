lab:
  title: DHCP Relay Snooping
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# DHCP Relay Snooping


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-025-dhcp-relay-snooping.md


    An IOSvL2 access switch, IOL-XE DHCP client, separate relay and remote DHCP server exercise actual
    DHCP forwarding. The client VLAN is198.18.10.0/24, the server transport is198.18.0.0/30, the helper
    targets0.2, and the server has an explicit route back to the client VLAN. Only100 is leasable. The
    relay-facing access port is the trusted trusted relay-uplink boundary; option82 insertion is disabled
    to isolate port trust from option82/giaddr policy. Removing snooping trust alone must not invalidate
    already-working IP traffic. Resetting the client DHCP configuration then requires a fresh eligible
    relay path: the client must stay unassigned across two independent unanswered router-probe windows,
    with an actual buffered DHCPDISCOVER event immediately followed by the switch decision that the eligible
    output-port set is empty and the packet is dropped. On the observed image, removing the only trusted
    uplink stops request forwarding before a new server reply can be required; the exercise does not claim
    that a DHCPOFFER was received and dropped. The tested image did not advance its aggregate drop statistic,
    so that counter is not treated as authoritative packet evidence. Packet debugging is enabled only
    for this isolated controlled fault, buffered with console logging disabled, and explicitly turned
    off during repair. Restoring only the switch trust must recover lease/binding and bidirectional routed
    traffic. This tests a single-switch relay trust boundary, not rogue-server authentication, DHCPv6
    or a production NAC deployment. Nominal RAM is3840MiB. Packet-debug and drop-log syntax: https://www.cisco.com/c/en/us/support/docs/ip/dynamic-host-configuration-protocol-dhcp-dhcpv6/217055-operate-and-troubleshoot-dhcp-snooping.html
    .


    Objectives:

    - Acquire a remote-server DHCP lease through an actual helper and correlate the resulting snooping
    binding.

    - Remove only the trusted relay-facing switch port, keep an existing lease working, then reset only
    client DHCP acquisition.

    - Observe sustained failed reacquisition and actual snooping packet-drop decisions, restore trust
    and recover the same routed client service.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: SW
  node_definition: iosvl2
  configuration:
  - name: ios_config.txt
    content: "hostname SW\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\nno logging\
      \ console\nlogging buffered 64000 debugging\nvlan 10\n name RELAY-CLIENTS\n exit\nip dhcp snooping\n\
      ip dhcp snooping vlan 10\nno ip dhcp snooping information option\ninterface GigabitEthernet0/0\n\
      \ switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n ip dhcp snooping\
      \ trust\n no shutdown\n exit\ninterface GigabitEthernet0/1\n switchport mode access\n switchport\
      \ access vlan 10\n spanning-tree portfast\n no shutdown\n exit\nend\n"
