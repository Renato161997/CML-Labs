lab:
  title: BGP Path Selection Local Pref MED
  description: Practice lab with a workbook and explicit verification. Isolated; CML format 0.3.1.
  notes: '# BGP Path Selection Local Pref MED


    Isolated educational topology; no external connector, real credentials or Internet access.

    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/014-bgp-path-selection-local-pref-med.md


    Starting state: A working reference baseline. Read the workbook before making changes.


    Objectives:

    - Verify that two paths to 203.0.113.0/24 exist.

    - Explain why local preference 200 selects R3.

    - Apply a higher preference to R2, refresh inbound routes and verify the change.

    - Explain why MED across these different neighboring ASes is not compared by default.


    Verification:

    - R1: show ip bgp 203.0.113.0

    - R1: show ip route 203.0.113.0

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.1 255.255.255.252\n\
      \ no shutdown\n exit\ninterface GigabitEthernet0/1\n ip address 198.18.0.5 255.255.255.252\n no\
      \ shutdown\n exit\nroute-map PREFER-R3 permit 10\n set local-preference 200\n exit\nrouter bgp 65001\n\
      \ bgp router-id 1.1.1.1\n neighbor 198.18.0.2 remote-as 65002\n neighbor 198.18.0.6 remote-as 65003\n\
      \ neighbor 198.18.0.6 route-map PREFER-R3 in\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
