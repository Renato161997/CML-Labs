lab:
  title: BGP Route Reflector
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# BGP Route Reflector


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-015-bgp-route-reflector.md


    Requires IOL-XE. OSPF point-to-point links carry only transport addresses. Endpoint prefixes 203.0.113.1/32
    and .3/32 depend on iBGP reflection, so an IGP route cannot make the acceptance ping pass. Allow the
    default BGP connection retry to finish. Remove BOTH client roles: client-learned routes can still
    be reflected to a nonclient, so removing only the receiving client role would not test suppression
    between two nonclients.


    Objectives:

    - Explain why clients do not need a full iBGP mesh.

    - Inspect originator and cluster-list attributes on an actual reflected route.

    - Withdraw and restore the client role and observe the route/data-plane effect.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\nrouter\
      \ ospf 1\n router-id 192.0.2.1\n network 192.0.2.1 0.0.0.0 area 0\n network 198.18.0.0 0.0.0.3 area\
      \ 0\n network 198.18.1.0 0.0.0.3 area 0\n exit\ninterface Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n\
      \ no shutdown\n ip ospf network point-to-point\n exit\ninterface Loopback1\n ip address 203.0.113.1\
      \ 255.255.255.255\n no shutdown\n exit\nrouter bgp 65000\n bgp router-id 192.0.2.1\n bgp log-neighbor-changes\n\
      \ neighbor 192.0.2.2 remote-as 65000\n neighbor 192.0.2.2 update-source Loopback0\n network 203.0.113.1\
      \ mask 255.255.255.255\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
