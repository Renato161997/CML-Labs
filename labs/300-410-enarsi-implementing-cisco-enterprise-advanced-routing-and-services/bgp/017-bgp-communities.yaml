lab:
  title: BGP Communities
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# BGP Communities


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-017-bgp-communities.md


    Requires IOL-XE. R3 tags its advertisements with no-export, which R2 must honor at the next eBGP boundary.
    Community 65000:100 has no built-in suppression semantics. Explicitly remove the previous set community
    before setting the replacement: repeated configuration commands can accumulate values. All peers explicitly
    propagate communities; immediate updates are an isolated-lab setting. Allow the default connection
    retry to finish.


    Objectives:

    - Inspect a received standard community rather than a configured string.

    - Compare no-export behavior with an ordinary administrative community.

    - Change the policy, verify reachability, then restore the export boundary.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\nip bgp-community\
      \ new-format\ninterface Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\n\
      router bgp 65001\n bgp router-id 192.0.2.1\n network 192.0.2.1 mask 255.255.255.255\n neighbor 198.18.0.2\
      \ remote-as 65002\n neighbor 198.18.0.2 advertisement-interval 0\n neighbor 198.18.0.2 send-community\n\
      \ exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n exit\nip bgp-community\
      \ new-format\ninterface Ethernet0/0\n ip address 198.18.0.2 255.255.255.252\n no shutdown\n exit\n\
      interface Ethernet0/1\n ip address 198.18.1.1 255.255.255.252\n no shutdown\n exit\nrouter bgp 65002\n\
      \ bgp router-id 192.0.2.2\n network 192.0.2.2 mask 255.255.255.255\n neighbor 198.18.0.1 remote-as\
      \ 65001\n neighbor 198.18.0.1 advertisement-interval 0\n neighbor 198.18.0.1 send-community\n neighbor\
      \ 198.18.1.2 remote-as 65003\n neighbor 198.18.1.2 advertisement-interval 0\n neighbor 198.18.1.2\
      \ send-community\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n2
  label: R3
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R3\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.3 255.255.255.255\n no shutdown\n exit\nip bgp-community\
      \ new-format\ninterface Ethernet0/0\n ip address 198.18.1.2 255.255.255.252\n no shutdown\n exit\n\
      route-map MARK permit 10\n set community no-export\n exit\nrouter bgp 65003\n bgp router-id 192.0.2.3\n\
      \ network 192.0.2.3 mask 255.255.255.255\n neighbor 198.18.1.1 remote-as 65002\n neighbor 198.18.1.1\
      \ advertisement-interval 0\n neighbor 198.18.1.1 send-community\n neighbor 198.18.1.1 route-map\
      \ MARK out\n exit\nend\n"
  cpu_limit: 50
  priority: 98
  x: 520
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
- id: l1
  n1: n1
  i1: i2
  n2: n2
  i2: i1
annotations: []
smart_annotations: []
