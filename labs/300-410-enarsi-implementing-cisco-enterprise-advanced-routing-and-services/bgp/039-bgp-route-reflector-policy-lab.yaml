lab:
  title: BGP Route Reflector Policy Lab
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# BGP Route Reflector Policy Lab


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-039-bgp-route-reflector-policy-lab.md


    Four IOL-XE routers implement two iBGP clients, a real route reflector and an external service AS.
    OSPF supplies only transport between loopbacks. LEAF1 sets next-hop-self toward RR for the external
    service; RR preserves the originating client and adds its cluster ID. LEAF2 has no direct LEAF1 BGP
    session. Its probe-loopback prefix is reflected back to LEAF1 and exported to REMOTE, providing an
    actual learned return path. Removing both reflector-client roles turns RR into ordinary non-transit
    iBGP: established sessions and healthy underlay must remain, but the remote client service must disappear.
    Removing only one client flag would not prove this fault, because client-to-nonclient reflection is
    allowed. A separate LEAF2 import filter tests per-client policy without changing RR service availability.
    All faults are removed. Nominal RAM is4GiB.


    Objectives:

    - Verify actual reflected originator/cluster attributes without an iBGP full mesh.

    - Remove both client roles and distinguish iBGP transit rules from healthy transport and sessions.

    - Apply a client-local import filter, prove its selective effect and recover the route.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: RR
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname RR\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\nrouter\
      \ ospf 10\n router-id 192.0.2.1\n passive-interface Loopback0\n exit\ninterface Loopback0\n ip ospf\
      \ 10 area 0\n exit\ninterface Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n\
      \ ip ospf 10 area 0\n ip ospf hello-interval 2\n ip ospf dead-interval 8\n exit\ninterface Ethernet0/1\n\
      \ ip address 198.18.0.5 255.255.255.252\n no shutdown\n ip ospf 10 area 0\n ip ospf hello-interval\
      \ 2\n ip ospf dead-interval 8\n exit\nrouter bgp 65000\n bgp router-id 192.0.2.1\n bgp cluster-id\
      \ 192.0.2.1\n neighbor 192.0.2.2 remote-as 65000\n neighbor 192.0.2.2 update-source Loopback0\n\
      \ neighbor 192.0.2.2 route-reflector-client\n neighbor 192.0.2.3 remote-as 65000\n neighbor 192.0.2.3\
      \ update-source Loopback0\n neighbor 192.0.2.3 route-reflector-client\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
