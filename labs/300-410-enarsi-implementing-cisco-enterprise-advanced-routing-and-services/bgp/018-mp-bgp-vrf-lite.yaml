lab:
  title: MP-BGP VRF Lite
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# MP-BGP VRF Lite


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/300-410-018-mp-bgp-vrf-lite.md


    Three IOSv reference routers implement two PEs and an actual OSPF/LDP provider transit. Each PE contains
    RED and BLUE VRFs with overlapping customer loopback addresses. Unique per-PE/per-VRF RDs and separate
    route targets preserve both VPNv4 identities. Local VRF loopbacks model customer prefixes; no CE devices
    are instantiated. This extends the VRF-Lite namespace concept with real MP-BGP VPNv4 and labeled transport
    rather than claiming VRF-Lite alone carries VPN labels. Actual per-VRF traffic succeeds while P lacks
    the customer IP route and counts labeled bytes. Removing only BLUE import must withdraw that RIB entry
    before its negative probe; RED, LDP and provider reachability remain healthy. Recovery must restore
    both namespaces. This does not model a full carrier deployment or hardware scale. Nominal RAM is1536MiB.


    Objectives:

    - Separate VRF-local addressing from MP-BGP VPNv4 transport and route-target import.

    - Carry the same customer addresses in two real independent VRFs across labeled transport.

    - Withdraw only BLUE import, keep RED and provider transport healthy, then recover BLUE.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: PE1
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname PE1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nno logging console\ninterface Loopback0\n ip address 192.0.2.1\
      \ 255.255.255.255\n no shutdown\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.1 255.255.255.252\n\
      \ no shutdown\n mpls ip\n exit\nmpls label protocol ldp\nmpls ldp router-id Loopback0 force\nrouter\
      \ ospf 1\n router-id 192.0.2.1\n network 192.0.2.1 0.0.0.0 area 0\n network 198.18.0.0 0.0.0.3 area\
      \ 0\n exit\nip vrf RED\n rd 65000:110\n route-target both 65000:10\n exit\ninterface Loopback10\n\
      \ ip vrf forwarding RED\n ip address 203.0.113.1 255.255.255.255\n exit\nip vrf BLUE\n rd 65000:120\n\
      \ route-target both 65000:20\n exit\ninterface Loopback20\n ip vrf forwarding BLUE\n ip address\
      \ 203.0.113.1 255.255.255.255\n exit\nrouter bgp 65000\n bgp router-id 192.0.2.1\n no bgp default\
      \ ipv4-unicast\n neighbor 192.0.2.3 remote-as 65000\n neighbor 192.0.2.3 update-source Loopback0\n\
      \ address-family vpnv4\n neighbor 192.0.2.3 activate\n neighbor 192.0.2.3 send-community extended\n\
      \ exit-address-family\n address-family ipv4 vrf RED\n network 203.0.113.1 mask 255.255.255.255\n\
      \ exit-address-family\n address-family ipv4 vrf BLUE\n network 203.0.113.1 mask 255.255.255.255\n\
      \ exit-address-family\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
