lab:
  title: Wireless Association and SSID Recovery
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Wireless Association and SSID Recovery


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-006-wireless-architecture-cml.md


    Two Ubuntu24.04 native CML wireless guests use actual hostapd and wpa_supplicant over the CML2.10
    simulated radio medium. Their only exposed Ethernet interface ens2 is deliberately unwired and has
    no address; no wired link or external connector can carry the test data. AP wlan0 is198.18.50.1/24,
    CLIENT wlan0 is198.18.50.2/24, and the distinct exercise SSID isCML-CCNA006. Channel6 is a simulated
    radio setting; displayed signal/bitrate and packet timing do not establish physical RF behavior, coverage
    or throughput. The root-only marker confines this fixture to deliberately prepared disposable guests.
    Cloud-init creates root-owned helper/configuration files, starts the radio daemons and enables the
    classroom root serial console; it creates no external login or production credential. All checked
    commands run after cloud-init reports successful completion and actual UID0 is verified. Nominal RAM
    is4096MiB(two2GiB VMs). These are the April2026 UbuntuWirelessAP/client models, not the separate JunevAP
    image, a Cisco CAPWAP AP or a9800 controller integration. The open WLAN deliberately has no wireless
    authentication or encryption. A correct SSID must lead to wpa_stateCOMPLETED, a matching kernel peer
    and three actual interface-bound ICMP replies. Changing only the client SSID must leave its IP/link
    settings and AP operational control intact, while no kernel association or completed supplicant state
    is seen for a full12-second observation window and the three requests receive zero replies. Restoring
    the declared SSID must recover actual traffic.


    Objectives:

    - Correlate actual AP control, supplicant state, kernel radio peer and interface-bound traffic.

    - Introduce a controlled client SSID mismatch without removing its benchmark IP configuration.

    - Observe the complete negative window and failed traffic, preserve AP control and restore actual
    service.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: AP
  node_definition: wireless-ap
  configuration:
  - name: user-data
    content: "#cloud-config\nhostname: AP\nmanage_etc_hosts: true\nwrite_files:\n- path: /etc/systemd/system/serial-getty@ttyS0.service.d/autologin.conf\n\
      \  permissions: '0644'\n  content: '[Service]\n\n    ExecStart=\n\n    ExecStart=-/sbin/agetty --autologin\
      \ root --noclear %I $TERM\n\n    '\n- path: /root/.bash_profile\n  permissions: '0600'\n  content:\
      \ 'export PS1=''root@AP:~# ''\n\n    '\n- path: /lab/CML-WIRELESS-FIXTURE\n  permissions: '0600'\n\
      \  content: 'CML-WIRELESS-FIXTURE-V1\n\n    '\n- path: /lab/wireless.json\n  permissions: '0600'\n\
      \  content: '{\"role\": \"ap\", \"auth\": \"open\", \"ssid\": \"CML-CCNA006\"}\n\n    '\n- path:\
      \ /lab/w.py\n  permissions: '0644'\n  encoding: b64\n  content: \n\
      runcmd:\n- - systemctl\n  - daemon-reload\n- - python3\n  - /lab/w.py\n  - configure\n- - systemctl\n\
      \  - restart\n  - serial-getty@ttyS0.service\n"
  - name: network-config
    content: "version: 2\nethernets:\n  ens2:\n    dhcp4: false\n    dhcp6: false\n    accept-ra: false\n\
      \    optional: true\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i1
    label: ens2
    type: physical
    slot: 0
  tags: []
  ram: 2048
  cpus: 1
- id: n1
  label: CLIENT
  node_definition: wireless-client
  configuration:
  - name: user-data
    content: "#cloud-config\nhostname: CLIENT\nmanage_etc_hosts: true\nwrite_files:\n- path: /etc/systemd/system/serial-getty@ttyS0.service.d/autologin.conf\n\
      \  permissions: '0644'\n  content: '[Service]\n\n    ExecStart=\n\n    ExecStart=-/sbin/agetty --autologin\
      \ root --noclear %I $TERM\n\n    '\n- path: /root/.bash_profile\n  permissions: '0600'\n  content:\
      \ 'export PS1=''root@CLIENT:~# ''\n\n    '\n- path: /lab/CML-WIRELESS-FIXTURE\n  permissions: '0600'\n\
      \  content: 'CML-WIRELESS-FIXTURE-V1\n\n    '\n- path: /lab/wireless.json\n  permissions: '0600'\n\
      \  content: '{\"role\": \"client\", \"auth\": \"open\", \"ssid\": \"CML-CCNA006\"}\n\n    '\n- path:\
      \ /lab/w.py\n  permissions: '0644'\n  encoding: b64\n  content: \n\
      runcmd:\n- - systemctl\n  - daemon-reload\n- - python3\n  - /lab/w.py\n  - configure\n- - systemctl\n\
      \  - restart\n  - serial-getty@ttyS0.service\n"
  - name: network-config
    content: "version: 2\nethernets:\n  ens2:\n    dhcp4: false\n    dhcp6: false\n    accept-ra: false\n\
      \    optional: true\n"
  cpu_limit: 100
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i1
    label: ens2
    type: physical
    slot: 0
  tags: []
  ram: 2048
  cpus: 1
links: []
annotations: []
smart_annotations: []
