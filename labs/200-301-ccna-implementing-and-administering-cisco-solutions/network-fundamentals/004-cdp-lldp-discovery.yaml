lab:
  title: CDP And LLDP Discovery
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# CDP And LLDP Discovery


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-004-cdp-lldp-discovery.md


    Requires IOL-L2 XE. CDP and LLDP are explicitly enabled on an isolated Layer-2 link. A five-second
    LLDP advertisement interval bounds the exercise waiting time; it is not a production tuning recommendation.
    No physical cable or transceiver behavior is modeled.


    Objectives:

    - Identify the same peer through independent CDP and LLDP tables.

    - Compare discovered port identity with the actual lab wiring.

    - Verify IP reachability separately from discovery.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: SW1
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\ncdp run\nlldp run\nlldp timer 5\nvlan 10\n name DISCOVERY\n\
      interface Vlan10\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/0\n\
      \ switchport mode access\n switchport access vlan 10\n lldp transmit\n lldp receive\n no shutdown\n\
      \ exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: SW2
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname SW2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\ncdp run\nlldp run\nlldp timer 5\nvlan 10\n name DISCOVERY\n\
      interface Vlan10\n ip address 198.18.0.2 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/0\n\
      \ switchport mode access\n switchport access vlan 10\n lldp transmit\n lldp receive\n no shutdown\n\
      \ exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
annotations: []
smart_annotations: []
