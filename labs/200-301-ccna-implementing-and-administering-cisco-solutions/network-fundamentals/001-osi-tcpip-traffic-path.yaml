lab:
  title: OSI TCP/IP Traffic Path
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# OSI TCP/IP Traffic Path


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-001-osi-tcpip-traffic-path.md


    Requires IOL-XE and IOL-L2 XE. Loopbacks represent the IP endpoints, and the intermediate switch forwards
    VLAN 10 without IP routing. A ping alone cannot explain which layer supplied ARP, the forwarding entry
    or the IP next hop: inspect the separate tables. This is a live protocol exercise, not a packet-level
    simulator of every OSI layer.


    Objectives:

    - Trace the endpoint IP route separately from the Ethernet next hop.

    - Observe actual ARP resolution and switch MAC learning.

    - Separate local interface state, Ethernet forwarding and endpoint reachability.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\nip route 192.0.2.2 255.255.255.255\
      \ 198.18.0.2\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: SW1
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nvlan 10\n name TRANSIT\ninterface range Ethernet0/0 -\
      \ 1\n switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n no shutdown\n\
      \ exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n2
  label: R2
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n ip address 198.18.0.2 255.255.255.252\n no shutdown\n exit\nip route 192.0.2.1 255.255.255.255\
      \ 198.18.0.1\nend\n"
  cpu_limit: 50
  priority: 98
  x: 520
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
- id: l1
  n1: n2
  i1: i1
  n2: n1
  i2: i2
annotations: []
smart_annotations: []
