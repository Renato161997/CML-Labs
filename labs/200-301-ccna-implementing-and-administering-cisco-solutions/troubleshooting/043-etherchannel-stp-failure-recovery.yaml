lab:
  title: EtherChannel STP Failure Recovery
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# EtherChannel STP Failure Recovery


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-043-etherchannel-stp-failure-recovery.md


    Three IOL-L2 switches form a real VLAN10 triangle; SW1-SW2 uses two-member LACP and SW3 supplies a
    separate redundant path. Explicit priorities and VLAN costs make expected roles deterministic. A single-member
    shutdown must keep Po1 active. A logical port-channel shutdown must change SW2 root port to the SW3
    path while preserving actual sourced SVI traffic. The test models administrative link failures and
    protocol convergence, not physical cable timing or throughput. Nominal RAM is3GiB.


    Objectives:

    - Validate LACP membership and STP root/alternate roles independently of successful IP traffic.

    - Lose one bundle member without changing the preferred logical path.

    - Shut the logical bundle, prove STP fallback through the third switch, then restore both protocols.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: SW1
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nvlan 10\n name LAB\n exit\nspanning-tree vlan 10 priority\
      \ 4096\ninterface Vlan10\n ip address 198.18.10.1 255.255.255.0\n no shutdown\n exit\nspanning-tree\
      \ mode rapid-pvst\ninterface Ethernet0/0\n switchport trunk encapsulation dot1q\n switchport mode\
      \ trunk\n switchport trunk allowed vlan 10\n spanning-tree vlan 10 cost 4\n no shutdown\n exit\n\
      interface Ethernet0/0\n channel-group 1 mode active\n exit\ninterface Ethernet0/1\n switchport trunk\
      \ encapsulation dot1q\n switchport mode trunk\n switchport trunk allowed vlan 10\n spanning-tree\
      \ vlan 10 cost 4\n no shutdown\n exit\ninterface Ethernet0/1\n channel-group 1 mode active\n exit\n\
      interface Port-channel1\n switchport trunk encapsulation dot1q\n switchport mode trunk\n switchport\
