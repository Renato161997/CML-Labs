lab:
  title: CCNA Capstone Branch Office
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# CCNA Capstone Branch Office


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-049-ccna-capstone-branch-office.md


    Five isolated guests integrate VLAN access/trunking, DHCP address acquisition, local DNS, PAT and
    a guest ingress policy. The ISP is a local router loopback, not Internet access. IOSv routers stand
    in for endpoints: their IP address is acquired by DHCP, while gateway and DNS are explicit model configuration;
    no DHCP-supplied-route/client-OS behavior is claimed. The guest ACL permits DHCP bootstrap, blocks
    the user subnet and permits the remaining guest traffic. The data-plane negative target is the user
    VLAN gateway so no guessed dynamic host address is required. A single-VLAN pruning fault must leave
    user DNS/PAT working. Nominal memory is 4x512+768 MiB; performance and physical WLAN behavior are
    outside scope.


    Objectives:

    - Build VLAN-separated DHCP clients behind router-on-a-stick and an explicit guest ACL.

    - Resolve a local test name and prove PAT to an isolated ISP that has no internal return routes.

    - Prune only the guest VLAN, preserve user service, then restore guest forwarding without losing segmentation.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: EDGE
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname EDGE\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nno logging console\nip dhcp excluded-address 198.18.10.1 198.18.10.9\n\
      ip dhcp excluded-address 198.18.20.1 198.18.20.9\nip dhcp pool USERS\n network 198.18.10.0 255.255.255.0\n\
      \ default-router 198.18.10.1\n dns-server 198.18.10.1\n exit\nip dhcp pool GUESTS\n network 198.18.20.0\
      \ 255.255.255.0\n default-router 198.18.20.1\n dns-server 198.18.20.1\n exit\nip dns server\nip\
      \ host app.example.test 203.0.113.80\nip access-list standard NAT-SOURCES\n permit 198.18.10.0 0.0.0.255\n\
      \ permit 198.18.20.0 0.0.0.255\n exit\nip access-list extended GUEST-IN\n permit udp any eq 68 any\
      \ eq 67\n deny ip 198.18.20.0 0.0.0.255 198.18.10.0 0.0.0.255\n permit ip 198.18.20.0 0.0.0.255\
      \ any\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.1 255.255.255.252\n ip nat outside\n\
      \ no shutdown\n exit\ninterface GigabitEthernet0/1\n no ip address\n no shutdown\n exit\ninterface\
      \ GigabitEthernet0/1.10\n encapsulation dot1Q 10\n ip address 198.18.10.1 255.255.255.0\n ip nat\
      \ inside\n exit\ninterface GigabitEthernet0/1.20\n encapsulation dot1Q 20\n ip address 198.18.20.1\
      \ 255.255.255.0\n ip nat inside\n ip access-group GUEST-IN in\n exit\nip nat inside source list\
      \ NAT-SOURCES interface GigabitEthernet0/0 overload\nip route 0.0.0.0 0.0.0.0 198.18.0.2\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
