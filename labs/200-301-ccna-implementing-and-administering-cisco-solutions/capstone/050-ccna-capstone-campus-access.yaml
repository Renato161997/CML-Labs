lab:
  title: CCNA Capstone Campus Access
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# CCNA Capstone Campus Access


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-050-ccna-capstone-campus-access.md


    Four IOL reference nodes integrate VLAN access, an actual redundant STP triangle, HSRPv2 and an explicit
    endpoint host route. CORE1 and CORE2 each host192.0.2.80/32 on a separate loopback; this deliberately
    models a duplicated lab service identity behind the selected gateway, not an external application
    or a duplicate address on one Ethernet segment. The fault administratively isolates both CORE1 trunks;
    the CML VM itself remains running. CORE2 must become both root and active gateway, and the endpoint
    must still reach the VIP and loopback target. Recovery verifies preferred-role preemption. A separate
    endpoint-route withdrawal must fail only the service probe while the VIP remains healthy. Nominal
    RAM is4GiB.


    Objectives:

    - Validate the real STP root/alternate topology and the active/standby HSRPv2 gateway.

    - Isolate both preferred-core uplinks, prove root and gateway failover and keep actual endpoint traffic
    working.

    - Recover the preferred roles, then distinguish an endpoint route failure from a healthy first hop.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: CORE1
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname CORE1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nvlan 10\n name CAMPUS\n exit\nspanning-tree vlan 10 priority\
      \ 4096\nspanning-tree mode rapid-pvst\ninterface Ethernet0/0\n switchport trunk encapsulation dot1q\n\
      \ switchport mode trunk\n switchport trunk allowed vlan 10\n spanning-tree vlan 10 cost 4\n no shutdown\n\
      \ exit\ninterface Ethernet0/1\n switchport trunk encapsulation dot1q\n switchport mode trunk\n switchport\
      \ trunk allowed vlan 10\n spanning-tree vlan 10 cost 4\n no shutdown\n exit\ninterface Vlan10\n\
      \ ip address 198.18.10.2 255.255.255.0\n standby version 2\n standby 10 ip 198.18.10.1\n standby\
      \ 10 priority 110\n standby 10 preempt\n no shutdown\n exit\ninterface Loopback0\n ip address 192.0.2.80\
