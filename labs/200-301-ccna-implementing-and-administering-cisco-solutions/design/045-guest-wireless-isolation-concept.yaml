lab:
  title: 'Guest WLAN: Service Segmentation and Recovery'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Guest WLAN: Service Segmentation and Recovery


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-045-guest-wireless-isolation-concept.md


    A real native CML Ubuntu Wireless AP and guest use WPA2-PSK/CCMP over the simulated radio. The GUEST
    wlan0 address is 198.18.10.2/24, with AP wlan0 gateway 198.18.10.1/24. Only AP ens2 is wired: its
    198.18.20.1/30 uplink reaches the independent INSIDE net-tools service at 198.18.20.2/30. INSIDE has
    an explicit return route to the guest subnet. An allowed shared HTTP endpoint lives on AP loopback
    192.0.2.80/32. Every HTTP request carries a new nonce; response identity and nonce must match. Guest
    requests bind their actual WLAN source address.


    The AP enables IPv4 forwarding and one exact ingress routing-policy rule: priority 12345, incoming
    wlan0, destination 198.18.20.0/30, action prohibit. The test reads actual kernel rules, including
    the separately reported destination prefix length. Three fresh internal connections must receive explicit
    network-policy rejection; service refusal, timeout or an HTTP authentication error cannot count as
    isolation. Shared service access, completed WPA2 association and CCMP must remain healthy. Separate
    AP-to-internal HTTP/ICMP and internal-server controls prove the protected endpoint is alive. Removing
    only the rule must allow real guest HTTP and three ICMP replies. Restoring it must restore explicit
    denial and preserve all healthy controls.


    This is an IPv4 forwarded-service segmentation exercise using Linux routing policy, not a stateful
    firewall, general NAC, peer-station isolation or Cisco controller implementation. The higher-priority
    local routing table handles addresses on the AP itself; the forwarding rule does not harden AP management
    or host input. IPv6 is outside the asserted policy. The classroom PSK is public. RF performance and
    production security are not claimed. See the ip-rule primary manual for selector/action and local-table
    semantics. Nominal RAM is 4608 MiB (two 2 GiB radio VMs and one 512 MiB server), requiring the reserved
    larger-case mode.


    Objectives:

    - Correlate actual WPA2/CCMP association, allowed shared service and independent internal endpoint
    health.

    - Verify explicit network-policy rejection of forwarded guest traffic without confusing outage or
    bad authentication with isolation.

    - Withdraw only the exact ingress rule, prove actual internal access, then restore scoped IPv4 segmentation.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: AP
  node_definition: wireless-ap
  configuration:
  - name: user-data
    content: "#cloud-config\nhostname: AP\nmanage_etc_hosts: true\nwrite_files:\n- path: /etc/systemd/system/serial-getty@ttyS0.service.d/autologin.conf\n\
      \  permissions: '0644'\n  content: '[Service]\n\n    ExecStart=\n\n    ExecStart=-/sbin/agetty --autologin\
      \ root --noclear %I $TERM\n\n    '\n- path: /root/.bash_profile\n  permissions: '0600'\n  content:\
      \ 'export PS1=''root@AP:~# ''\n\n    '\n- path: /lab/CML-WIRELESS-FIXTURE\n  permissions: '0600'\n\
      \  content: 'CML-WIRELESS-FIXTURE-V1\n\n    '\n- path: /lab/wireless.json\n  permissions: '0600'\n\
      \  content: '{\"role\": \"ap\", \"auth\": \"wpa2\", \"ssid\": \"CML-CCNA045\"}\n\n    '\n- path:\
      \ /lab/guest-role.json\n  permissions: '0600'\n  content: '{\"role\": \"ap\"}\n\n    '\n- path:\
      \ /lab/radio_probe.py\n  permissions: '0644'\n  encoding: b64\n  content: \n\
      - path: /lab/g.py\n  permissions: '0644'\n  encoding: b64\n  content: \n\
      runcmd:\n- - systemctl\n  - daemon-reload\n- - python3\n  - /lab/g.py\n  - configure\n- - systemctl\n\
      \  - restart\n  - serial-getty@ttyS0.service\n"
  - name: network-config
    content: "version: 2\nethernets:\n  ens2:\n    dhcp4: false\n    dhcp6: false\n    accept-ra: false\n\
      \    optional: true\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i1
    label: ens2
    type: physical
    slot: 0
  tags: []
  ram: 2048
  cpus: 1
- id: n1
  label: GUEST
  node_definition: wireless-client
  configuration:
  - name: user-data
    content: "#cloud-config\nhostname: GUEST\nmanage_etc_hosts: true\nwrite_files:\n- path: /etc/systemd/system/serial-getty@ttyS0.service.d/autologin.conf\n\
      \  permissions: '0644'\n  content: '[Service]\n\n    ExecStart=\n\n    ExecStart=-/sbin/agetty --autologin\
      \ root --noclear %I $TERM\n\n    '\n- path: /root/.bash_profile\n  permissions: '0600'\n  content:\
      \ 'export PS1=''root@GUEST:~# ''\n\n    '\n- path: /lab/CML-WIRELESS-FIXTURE\n  permissions: '0600'\n\
      \  content: 'CML-WIRELESS-FIXTURE-V1\n\n    '\n- path: /lab/wireless.json\n  permissions: '0600'\n\
      \  content: '{\"role\": \"client\", \"auth\": \"wpa2\", \"ssid\": \"CML-CCNA045\"}\n\n    '\n- path:\
      \ /lab/guest-role.json\n  permissions: '0600'\n  content: '{\"role\": \"client\"}\n\n    '\n- path:\
      \ /lab/radio_probe.py\n  permissions: '0644'\n  encoding: b64\n  content: \n\
      - path: /lab/g.py\n  permissions: '0644'\n  encoding: b64\n  content: \n\
      runcmd:\n- - systemctl\n  - daemon-reload\n- - python3\n  - /lab/g.py\n  - configure\n- - systemctl\n\
      \  - restart\n  - serial-getty@ttyS0.service\n"
  - name: network-config
    content: "version: 2\nethernets:\n  ens2:\n    dhcp4: false\n    dhcp6: false\n    accept-ra: false\n\
      \    optional: true\n"
  cpu_limit: 100
  priority: 99
