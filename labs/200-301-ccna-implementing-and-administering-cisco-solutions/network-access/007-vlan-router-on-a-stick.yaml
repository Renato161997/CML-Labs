lab:
  title: VLANs And Router On A Stick
  description: Practice lab with a workbook and explicit verification. Isolated; CML format 0.3.1.
  notes: '# VLANs And Router On A Stick


    Isolated educational topology; no external connector, real credentials or Internet access.

    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/007-vlan-router-on-a-stick.md


    Starting state: A working reference baseline. Read the workbook before making changes.


    Objectives:

    - Identify the 802.1Q subinterfaces and the /26 subnets.

    - Verify the trunk carries VLANs 10 and 20.

    - Remove VLAN 20 from the allowed list, prove the VLAN 20 failure, then restore it.


    Verification:

    - SW1: show interfaces trunk

    - SW1: ping 192.0.2.65 source Vlan20 repeat 3

    - SW1: ping 192.0.2.1 source Vlan10 repeat 3

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface GigabitEthernet0/0.10\n encapsulation dot1Q 10\n ip\
      \ address 192.0.2.1 255.255.255.192\n exit\ninterface GigabitEthernet0/0.20\n encapsulation dot1Q\
      \ 20\n ip address 192.0.2.65 255.255.255.192\n exit\ninterface GigabitEthernet0/0\n description\
      \ 802.1Q trunk to SW1\n no ip address\n no shutdown\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: SW1
  node_definition: iosvl2
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nip routing\nvtp mode transparent\nspanning-tree mode rapid-pvst\n\
      vlan 10\n name USERS\nvlan 20\n name SERVICES\ninterface GigabitEthernet0/0\n switchport trunk encapsulation\
      \ dot1q\n switchport mode trunk\n switchport trunk allowed vlan 10,20\n no shutdown\n exit\ninterface\
      \ Vlan10\n ip address 192.0.2.2 255.255.255.192\n no shutdown\n exit\ninterface Vlan20\n ip address\
      \ 192.0.2.66 255.255.255.192\n no shutdown\n exit\nend\n"
  cpu_limit: 100
  priority: 99
  x: 240
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
annotations: []
smart_annotations: []
