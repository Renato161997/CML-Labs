lab:
  title: Layer 2 Security Basics
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Layer 2 Security Basics


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-013-layer2-security.md


    This focused Layer-2 security exercise verifies Root Guard, not every campus security control. ROOT
    is the intended VLAN 10 root. ACCESS Ethernet0/1 is the designated downstream boundary with Root Guard
    enabled. ROGUE initially has a worse bridge priority; changing it to zero generates real superior
    BPDUs. The upstream segment must keep forwarding while the offending downstream segment is blocked.
    Root Guard remains configured throughout recovery. Port security has a separate workbook; DHCP snooping/DAI
    are not claimed here.


    Objectives:

    - Place Root Guard on a designated downstream boundary, not the root-facing uplink.

    - Advertise a superior bridge priority and observe root-inconsistent blocking.

    - Restore the downstream priority and verify automatic recovery without disabling Root Guard.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: ROOT
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname ROOT\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nvlan 10\n name LAB\n exit\nspanning-tree vlan 10 priority\
      \ 4096\ninterface Vlan10\n ip address 198.18.10.1 255.255.255.0\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n switchport trunk encapsulation dot1q\n switchport mode trunk\n switchport trunk\
      \ allowed vlan 10\n spanning-tree vlan 10 cost 4\n no shutdown\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
