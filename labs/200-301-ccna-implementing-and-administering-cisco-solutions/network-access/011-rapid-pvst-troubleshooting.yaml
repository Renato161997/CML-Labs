lab:
  title: Rapid PVST Troubleshooting
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Rapid PVST Troubleshooting


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-011-rapid-pvst-troubleshooting.md


    Requires three IOL-L2 reference switches. All trunks carry only VLAN 10 and use an explicit per-VLAN
    cost of 4. Distinct bridge priorities make the expected alternate port deterministic without relying
    on random virtual MAC addresses. An alternate BLK port is expected loop prevention; a successful ping
    alone cannot establish that the desired root policy is correct. This models logical STP behavior,
    not physical failure timing or throughput.


    Objectives:

    - Identify the root, designated, root-port and alternate roles in a real triangle.

    - Introduce an unintended lower bridge priority and diagnose the changed root even while IP connectivity
    survives.

    - Restore the intended priorities and verify both the root and the alternate blocked port.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: SW1
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nvlan 10\n name LAB\n exit\nspanning-tree vlan 10 priority\
      \ 4096\ninterface Vlan10\n ip address 198.18.10.1 255.255.255.0\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n switchport trunk encapsulation dot1q\n switchport mode trunk\n switchport trunk\
      \ allowed vlan 10\n spanning-tree vlan 10 cost 4\n no shutdown\n exit\ninterface Ethernet0/1\n switchport\
      \ trunk encapsulation dot1q\n switchport mode trunk\n switchport trunk allowed vlan 10\n spanning-tree\
      \ vlan 10 cost 4\n no shutdown\n exit\nend\n"
  cpu_limit: 50
