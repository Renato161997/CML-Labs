lab:
  title: PortFast And BPDU Guard
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# PortFast And BPDU Guard


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-010-portfast-bpduguard.md


    Requires three IOL reference nodes. SW2 deliberately models a switch attached to an edge port, not
    a recommended production design. The initial baseline has no BPDU Guard on that link so its traffic
    can be measured before protection is enabled. CLIENT keeps SW1 VLAN 10 active during the guarded-port
    failure. SW2 is made root after guard activation to produce fresh BPDUs deterministically; this does
    not imply BPDU Guard accepts inferior BPDUs. Recovery disables the guard only to restore this disposable
    baseline; in production remove the unauthorized bridge before re-enabling a protected edge port. No
    BPDU filtering is used to hide the fault.


    Objectives:

    - Distinguish configured PortFast from a suitable endpoint-only topology.

    - Enable explicit interface BPDU Guard and observe real err-disable after a peer BPDU.

    - Verify the authorized local endpoint remains reachable, then restore the disposable baseline.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: SW1
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nvlan 10\n name LAB\n exit\nspanning-tree vlan 10 priority\
      \ 4096\ninterface Vlan10\n ip address 198.18.10.1 255.255.255.0\n no shutdown\n exit\ninterface\
      \ Ethernet0/0\n switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n no\
      \ shutdown\n exit\ninterface Ethernet0/1\n switchport mode access\n switchport access vlan 10\n\
      \ spanning-tree portfast\n no shutdown\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
