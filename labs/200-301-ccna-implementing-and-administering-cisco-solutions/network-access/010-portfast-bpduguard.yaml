lab:
  title: PortFast And BPDU Guard
  description: 200-301 CCNA - Implementing and Administering Cisco Solutions CML lab.
  notes: '200-301 CCNA blueprint lab: PortFast And BPDU Guard


    Topics:

    - PortFast

    - BPDU Guard

    - edge protection


    Suggested tasks:

    1. Enable PortFast on edge ports

    2. Enable BPDU Guard

    3. Review errdisable behavior


    Suggested verification:

    - show ip interface brief

    - show interfaces status

    - show ip route

    - show running-config | section router

    - ping between the lab endpoints'
  version: 0.3.1
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 0
  y: -180
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nbanner motd ^C CCNA PortFast And BPDU Guard ^C\ninterface\
      \ GigabitEthernet0/0\n description CCNA PortFast And BPDU Guard\n ip address 10.0.0.1 255.255.255.252\n\
      \ no shutdown\nend"
  interfaces:
