lab:
  title: 'WLAN Client Mapping: Radio, Bridge and Tagged VLAN'
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# WLAN Client Mapping: Radio, Bridge and Tagged VLAN


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-014-wlan-client-vlan-mapping.md


    A native Ubuntu Wireless AP and client exchange actual frames over the CML simulated radio. Only the
    AP ens2 is wired, to Ethernet0/0 on an IOL-L2 switch. The AP bridges wlan0 to an 802.1Q subinterface;
    neither the WLAN port nor bridge has an IPv4 endpoint. The client 198.18.10.2/24 must reach the actual
    switch VLAN10 SVI 198.18.10.1/24. An independent untagged control subnet connects AP ens2 198.18.0.1/30
    to switch VLAN1 198.18.0.2/30. The switch trunk permits VLANs 1, 10 and 20. VLAN20 deliberately has
    no SVI.


    The controlled fault moves only the WLAN bridge uplink from VLAN10 to VLAN20. Client addressing, completed
    radio association, AP operation and the untagged control path must remain healthy, while fresh client
    ARP/ICMP can no longer reach the VLAN10 SVI. Dynamic MAC learning must be observed on the newly selected
    VLAN. Restoring VLAN10 must recover actual traffic. Neighbor caches are flushed before data tests
    so an old ARP entry cannot hide a wrong VLAN. This is a Linux bridge/trunk teaching model: no Cisco
    controller, CAPWAP tunnel, WPA authentication, RF-performance or production segmentation claim. The
    open WLAN is deliberate. Nominal RAM is 5120 MiB, requiring the explicitly reserved larger-case test
    mode.


    Objectives:

    - Correlate actual radio association, a transparent WLAN bridge, 802.1Q uplink selection and switch
    learning.

    - Introduce an incorrect VLAN mapping while retaining wireless and independent uplink health.

    - Observe failed fresh traffic, restore VLAN10 and prove end-to-end forwarding again.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: AP
  node_definition: wireless-ap
  configuration:
  - name: user-data
    content: "#cloud-config\nhostname: AP\nmanage_etc_hosts: true\nwrite_files:\n- path: /etc/systemd/system/serial-getty@ttyS0.service.d/autologin.conf\n\
      \  permissions: '0644'\n  content: '[Service]\n\n    ExecStart=\n\n    ExecStart=-/sbin/agetty --autologin\
      \ root --noclear %I $TERM\n\n    '\n- path: /root/.bash_profile\n  permissions: '0600'\n  content:\
      \ 'export PS1=''root@AP:~# ''\n\n    '\n- path: /lab/CML-WIRELESS-FIXTURE\n  permissions: '0600'\n\
      \  content: 'CML-WIRELESS-FIXTURE-V1\n\n    '\n- path: /lab/wireless.json\n  permissions: '0600'\n\
      \  content: '{\"role\": \"ap\", \"auth\": \"open\", \"ssid\": \"CML-CCNA014\"}\n\n    '\n- path:\
      \ /lab/radio_probe.py\n  permissions: '0644'\n  encoding: b64\n  content: \n\
      - path: /lab/v.py\n  permissions: '0644'\n  encoding: b64\n  content: \n\
      runcmd:\n- - systemctl\n  - daemon-reload\n- - python3\n  - /lab/v.py\n  - configure\n- - systemctl\n\
      \  - restart\n  - serial-getty@ttyS0.service\n"
  - name: network-config
    content: "version: 2\nethernets:\n  ens2:\n    dhcp4: false\n    dhcp6: false\n    accept-ra: false\n\
      \    optional: true\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i1
    label: ens2
    type: physical
    slot: 0
  tags: []
  ram: 2048
  cpus: 1
- id: n1
  label: CLIENT
  node_definition: wireless-client
  configuration:
  - name: user-data
    content: "#cloud-config\nhostname: CLIENT\nmanage_etc_hosts: true\nwrite_files:\n- path: /etc/systemd/system/serial-getty@ttyS0.service.d/autologin.conf\n\
      \  permissions: '0644'\n  content: '[Service]\n\n    ExecStart=\n\n    ExecStart=-/sbin/agetty --autologin\
      \ root --noclear %I $TERM\n\n    '\n- path: /root/.bash_profile\n  permissions: '0600'\n  content:\
      \ 'export PS1=''root@CLIENT:~# ''\n\n    '\n- path: /lab/CML-WIRELESS-FIXTURE\n  permissions: '0600'\n\
      \  content: 'CML-WIRELESS-FIXTURE-V1\n\n    '\n- path: /lab/wireless.json\n  permissions: '0600'\n\
      \  content: '{\"role\": \"client\", \"auth\": \"open\", \"ssid\": \"CML-CCNA014\"}\n\n    '\n- path:\
      \ /lab/radio_probe.py\n  permissions: '0644'\n  encoding: b64\n  content: \n\
      - path: /lab/v.py\n  permissions: '0644'\n  encoding: b64\n  content: \n\
      runcmd:\n- - systemctl\n  - daemon-reload\n- - python3\n  - /lab/v.py\n  - configure\n- - systemctl\n\
      \  - restart\n  - serial-getty@ttyS0.service\n"
  - name: network-config
    content: "version: 2\nethernets:\n  ens2:\n    dhcp4: false\n    dhcp6: false\n    accept-ra: false\n\
      \    optional: true\n"
  cpu_limit: 100
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i1
    label: ens2
    type: physical
    slot: 0
  tags: []
  ram: 2048
  cpus: 1
- id: n2
  label: SW
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname SW\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nno logging console\nip routing\nvlan 10\n name WLAN\n\
      \ exit\nvlan 20\n name WRONG-MAPPING\n exit\ninterface Ethernet0/0\n switchport trunk encapsulation\
      \ dot1q\n switchport mode trunk\n switchport trunk native vlan 1\n switchport trunk allowed vlan\
      \ 1,10,20\n spanning-tree portfast trunk\n no shutdown\n exit\ninterface Vlan1\n ip address 198.18.0.2\
      \ 255.255.255.252\n no shutdown\n exit\ninterface Vlan10\n ip address 198.18.10.1 255.255.255.0\n\
      \ no shutdown\n exit\nend\n"
  cpu_limit: 50
  priority: 98
  x: 520
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n2
  i2: i1
annotations: []
smart_annotations: []
