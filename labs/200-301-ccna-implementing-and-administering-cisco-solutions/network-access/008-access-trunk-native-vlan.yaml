lab:
  title: Access Trunk Native VLAN
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Access Trunk Native VLAN


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-008-access-trunk-native-vlan.md


    Native VLAN 99 carries no user SVI. VLANs 10 and 20 are tagged, with separate /26 endpoint subnets.
    Removing VLAN 20 from one allowed list must break only that VLAN.


    Objectives:

    - Identify the native VLAN and allowed VLAN list.

    - Verify both tagged user VLANs across the trunk.

    - Prune only VLAN 20, prove the resulting failure, then restore it.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: SW1
  node_definition: iosvl2
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\nvlan 10\n\
      \ name USERS\nvlan 20\n name SERVICES\nvlan 99\n name NATIVE\ninterface GigabitEthernet0/0\n switchport\
      \ trunk encapsulation dot1q\n switchport mode trunk\n switchport trunk native vlan 99\n switchport\
      \ trunk allowed vlan 10,20,99\n no shutdown\n exit\ninterface Vlan10\n ip address 192.0.2.1 255.255.255.192\n\
      \ no shutdown\n exit\ninterface Vlan20\n ip address 192.0.2.65 255.255.255.192\n no shutdown\n exit\n\
      end\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: SW2
  node_definition: iosvl2
  configuration:
  - name: ios_config.txt
    content: "hostname SW2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\nvlan 10\n\
      \ name USERS\nvlan 20\n name SERVICES\nvlan 99\n name NATIVE\ninterface GigabitEthernet0/0\n switchport\
      \ trunk encapsulation dot1q\n switchport mode trunk\n switchport trunk native vlan 99\n switchport\
      \ trunk allowed vlan 10,20,99\n no shutdown\n exit\ninterface Vlan10\n ip address 192.0.2.2 255.255.255.192\n\
      \ no shutdown\n exit\ninterface Vlan20\n ip address 192.0.2.66 255.255.255.192\n no shutdown\n exit\n\
      end\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
annotations: []
smart_annotations: []
