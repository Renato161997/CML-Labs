lab:
  title: EtherChannel LACP
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# EtherChannel LACP


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-012-etherchannel-lacp.md


    Both ends actively negotiate LACP. Identical trunk settings are applied to the members and aggregate.
    The exercise tests membership and continuity, not aggregate throughput on performance-limited virtual
    switches.


    Objectives:

    - Inspect LACP membership and distinguish a bundled port from an individual link.

    - Fail one member while retaining SVI reachability.

    - Restore both members and verify the aggregate is healthy.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: SW1
  node_definition: iosvl2
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\nvlan 10\n\
      \ name USERS\ninterface Vlan10\n ip address 192.0.2.1 255.255.255.192\n no shutdown\n exit\ninterface\
      \ GigabitEthernet0/0\n switchport trunk encapsulation dot1q\n switchport mode trunk\n switchport\
      \ trunk native vlan 1\n switchport trunk allowed vlan 10\n no shutdown\n exit\ninterface GigabitEthernet0/0\n\
      \ channel-group 1 mode active\n lacp rate fast\n exit\ninterface GigabitEthernet0/1\n switchport\
      \ trunk encapsulation dot1q\n switchport mode trunk\n switchport trunk native vlan 1\n switchport\
      \ trunk allowed vlan 10\n no shutdown\n exit\ninterface GigabitEthernet0/1\n channel-group 1 mode\
      \ active\n lacp rate fast\n exit\ninterface Port-channel1\n switchport trunk encapsulation dot1q\n\
      \ switchport mode trunk\n switchport trunk allowed vlan 10\n no shutdown\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: SW2
  node_definition: iosvl2
  configuration:
  - name: ios_config.txt
    content: "hostname SW2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\nvlan 10\n\
      \ name USERS\ninterface Vlan10\n ip address 192.0.2.2 255.255.255.192\n no shutdown\n exit\ninterface\
      \ GigabitEthernet0/0\n switchport trunk encapsulation dot1q\n switchport mode trunk\n switchport\
      \ trunk native vlan 1\n switchport trunk allowed vlan 10\n no shutdown\n exit\ninterface GigabitEthernet0/0\n\
      \ channel-group 1 mode active\n lacp rate fast\n exit\ninterface GigabitEthernet0/1\n switchport\
      \ trunk encapsulation dot1q\n switchport mode trunk\n switchport trunk native vlan 1\n switchport\
      \ trunk allowed vlan 10\n no shutdown\n exit\ninterface GigabitEthernet0/1\n channel-group 1 mode\
      \ active\n lacp rate fast\n exit\ninterface Port-channel1\n switchport trunk encapsulation dot1q\n\
      \ switchport mode trunk\n switchport trunk allowed vlan 10\n no shutdown\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
