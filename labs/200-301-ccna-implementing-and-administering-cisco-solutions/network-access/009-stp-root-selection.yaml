lab:
  title: STP Root Selection
  description: Practice lab with a workbook and explicit verification. Isolated; CML format 0.3.1.
  notes: '# STP Root Selection


    Isolated educational topology; no external connector, real credentials or Internet access.

    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/009-stp-root-selection.md


    Starting state: A working reference baseline. Read the workbook before making changes.


    Objectives:

    - Identify the root bridge and explain its priority.

    - Identify the root port and alternate port on SW2.

    - Shut the root port, verify the alternate forwards, then restore the port.


    Verification:

    - SW1: show spanning-tree vlan 10

    - SW2: show spanning-tree vlan 10

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: SW1
  node_definition: iosvl2
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\nvlan 10\n\
      \ name USERS\nspanning-tree vlan 10 priority 4096\ninterface GigabitEthernet0/0\n switchport trunk\
      \ encapsulation dot1q\n switchport mode trunk\n switchport trunk allowed vlan 10\n no shutdown\n\
      \ exit\ninterface GigabitEthernet0/1\n switchport trunk encapsulation dot1q\n switchport mode trunk\n\
      \ switchport trunk allowed vlan 10\n no shutdown\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: SW2
  node_definition: iosvl2
  configuration:
  - name: ios_config.txt
    content: "hostname SW2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\nvlan 10\n\
      \ name USERS\nspanning-tree vlan 10 priority 32768\ninterface GigabitEthernet0/0\n switchport trunk\
      \ encapsulation dot1q\n switchport mode trunk\n switchport trunk allowed vlan 10\n no shutdown\n\
      \ exit\ninterface GigabitEthernet0/1\n switchport trunk encapsulation dot1q\n switchport mode trunk\n\
      \ switchport trunk allowed vlan 10\n no shutdown\n exit\nend\n"
  cpu_limit: 100
  priority: 99
  x: 240
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
- id: l1
  n1: n0
  i1: i2
  n2: n1
  i2: i2
annotations: []
smart_annotations: []
