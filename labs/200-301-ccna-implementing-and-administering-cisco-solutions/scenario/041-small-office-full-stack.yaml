lab:
  title: Small Office Full Stack
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Small Office Full Stack


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-041-small-office-full-stack.md


    This four-node office integrates an IOSv edge router, IOSvL2 access switch, IOL-XE DHCP client and
    a separate routed service. The router-on-a-stick client VLAN10 carries198.18.10.0/24, DHCP offers
    only100 and its default router, and CLIENT uses a DHCP-dependent static default. The WAN198.18.0.0/30
    leads to SERVER loopback192.0.2.80. SERVER deliberately has no private-client return route, so a successful
    client probe plus an observed ICMP PAT entry proves real source translation. Removing only the inside
    NAT role and clearing disposable translations must break the remote client service while preserving
    the local gateway and GW-to-service reachability. Restoring it must recreate working PAT. A separate
    trunk-pruning fault must instead break client gateway reachability while the WAN remains healthy.
    Recovery requires actual lease, default, local and remote traffic, translation and absent private
    return route. This compact full-stack exercise covers L2, DHCP, routing and PAT; it does not instantiate
    DNS, WiFi, a stateful firewall or an Internet connection. Nominal RAM is3328MiB.


    Objectives:

    - Correlate VLAN access/trunk forwarding, a real DHCP lease/default route and actual PAT-dependent
    remote service.

    - Break only NAT classification while retaining client gateway and WAN service controls.

    - Recover NAT, prune only the client VLAN from the trunk, then restore the complete office path.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: GW
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname GW\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface GigabitEthernet0/1\n ip address 198.18.0.1 255.255.255.252\n\
      \ no shutdown\n ip nat outside\n exit\ninterface GigabitEthernet0/0\n no ip address\n no shutdown\n\
      \ exit\ninterface GigabitEthernet0/0.10\n encapsulation dot1Q 10\n ip address 198.18.10.1 255.255.255.0\n\
      \ ip nat inside\n exit\nip dhcp excluded-address 198.18.10.1 198.18.10.99\nip dhcp excluded-address\
      \ 198.18.10.101 198.18.10.254\nip dhcp pool OFFICE\n network 198.18.10.0 255.255.255.0\n default-router\
      \ 198.18.10.1\n exit\nip access-list standard OFFICE-NAT\n permit 198.18.10.0 0.0.0.255\n exit\n\
      ip nat inside source list OFFICE-NAT interface GigabitEthernet0/1 overload\nip route 0.0.0.0 0.0.0.0\
      \ 198.18.0.2\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: SW
