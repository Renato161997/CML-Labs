      \ name OFFICE\n exit\ninterface GigabitEthernet0/0\n switchport trunk encapsulation dot1q\n switchport\
      \ mode trunk\n switchport trunk allowed vlan 10\n no shutdown\n exit\ninterface GigabitEthernet0/1\n\
      \ switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n no shutdown\n exit\n\
      end\n"
  cpu_limit: 100
  priority: 99
  x: 260
  y: 160
