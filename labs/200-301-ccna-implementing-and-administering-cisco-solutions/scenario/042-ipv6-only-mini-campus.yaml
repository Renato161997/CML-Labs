lab:
  title: IPv6 Only Mini Campus
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# IPv6 Only Mini Campus


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-042-ipv6-only-mini-campus.md


    Four IOL reference nodes implement two access VLANs and an IPv6-only routed data plane. IOL routers
    stand in for endpoints and use explicit static IPv6 addresses and default routes; this exercise does
    not claim SLAAC or Linux-client behavior. No data interface receives an IPv4 address. The switch trunk
    and connected IPv6 routes are separate failure domains: pruning VLAN20 leaves the router subinterface
    and connected prefix present while actual inter-VLAN traffic fails. Recovery must restore both directions
    and the real ND entry. The second fault removes only CLIENT-A default routing while its on-link gateway
    remains reachable. This is an isolated virtual reference, not an IPv6 Internet or throughput test.
    Nominal RAM is4GiB.


    Objectives:

    - Trace real IPv6-only router-on-a-stick forwarding and resolved neighbors across two VLANs.

    - Prune one VLAN and distinguish a still-installed connected route from a broken Layer2 path.

    - Remove and restore an endpoint default route while keeping its on-link gateway healthy.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\nipv6 unicast-routing\ninterface Ethernet0/0\n no shutdown\n exit\ninterface Ethernet0/0.10\n\
      \ encapsulation dot1Q 10\n no ip address\n ipv6 address 2001:db8:10::1/64\n no shutdown\n ipv6 address\
      \ fe80::10 link-local\n exit\ninterface Ethernet0/0.20\n encapsulation dot1Q 20\n no ip address\n\
      \ ipv6 address 2001:db8:20::1/64\n no shutdown\n ipv6 address fe80::20 link-local\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
