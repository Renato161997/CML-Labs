lab:
  title: CCNA Practical Checkpoint Two
  description: Deliberately broken exercise; diagnose and repair before acceptance.
  notes: '# CCNA Practical Checkpoint Two


    Deliberately broken: NAT-SOURCES permits an unused prefix rather than the actual DHCP client network.
    No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-048-ccna-practical-checkpoint-two.md


    The NAT source ACL intentionally matches the wrong subnet. Interface roles, DHCP pool, local DNS and
    default route are otherwise correct. The initial direct-IP probe must fail before changing only the
    ACL prefix. IOL-XE models the endpoint: the address is DHCP-acquired but gateway and resolver are
    explicit fixture configuration, not a claim about DHCP client route installation. The ISP loopback
    is an isolated service target, not Internet access.


    Objectives:

    - Distinguish a working local DHCP/DNS service from failed external forwarding.

    - Find the incorrect source prefix in the PAT classification ACL.

    - Apply a narrow source-prefix repair, inspect the actual translation and verify name-based traffic.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: EDGE
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname EDGE\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\nno logging console\nip dhcp excluded-address 192.0.2.1 192.0.2.9\nip dhcp pool CLIENTS\n\
      \ network 192.0.2.0 255.255.255.0\n default-router 192.0.2.1\n dns-server 192.0.2.1\n exit\nip dns\
      \ server\nip host app.example.test 203.0.113.80\nip access-list standard NAT-SOURCES\n permit 198.18.99.0\
      \ 0.0.0.255\n exit\ninterface Ethernet0/0\n ip address 192.0.2.1 255.255.255.0\n ip nat inside\n\
      \ no shutdown\n exit\ninterface Ethernet0/1\n ip address 198.18.0.1 255.255.255.252\n ip nat outside\n\
      \ no shutdown\n exit\nip nat inside source list NAT-SOURCES interface Ethernet0/1 overload\nip route\
      \ 0.0.0.0 0.0.0.0 198.18.0.2\nend\n"
