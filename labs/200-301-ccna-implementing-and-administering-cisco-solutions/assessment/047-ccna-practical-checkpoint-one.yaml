lab:
  title: CCNA Practical Checkpoint One
  description: Deliberately broken exercise; diagnose and repair before acceptance.
  notes: '# CCNA Practical Checkpoint One


    Deliberately broken: SW1 excludes the user VLAN from the only inter-switch trunk. No external connector
    or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-047-ccna-practical-checkpoint-one.md


    Two IOL-L2 switches and two IOL-XE endpoints form this deliberately broken assessment: SW1 permits
    only VLAN20 while every access endpoint and both management SVIs use VLAN10. The first data-plane
    check must fail before the repair is applied. VTP transparent mode keeps the supplied VLAN database
    in day-0 configuration. Both VLANs already exist, the trunk is statically configured and endpoint
    routes are correct. Repair changes only SW1 allowed VLAN membership. All networks are isolated documentation/benchmark
    ranges; no external connector is needed.


    Objectives:

    - Diagnose a failed routed-endpoint ping without changing correct addressing or default routes.

    - Compare VLAN membership with the allowed VLAN on each end of the trunk.

    - Restore only the missing VLAN and verify access, management and routed traffic.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: SW1
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nno logging console\nvlan 10\n name USERS\n exit\nvlan\
      \ 20\n name UNUSED\n exit\ninterface Ethernet0/0\n switchport trunk encapsulation dot1q\n switchport\
      \ mode trunk\n switchport trunk allowed vlan 20\n no shutdown\n exit\ninterface Ethernet0/1\n switchport\
      \ mode access\n switchport access vlan 10\n spanning-tree portfast\n no shutdown\n exit\ninterface\
      \ Vlan10\n ip address 192.0.2.11 255.255.255.0\n no shutdown\n exit\nend\n"
