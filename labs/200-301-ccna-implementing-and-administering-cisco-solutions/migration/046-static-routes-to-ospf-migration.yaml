lab:
  title: Static Routes To OSPF Migration
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Static Routes To OSPF Migration


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-046-static-routes-to-ospf-migration.md


    Both control planes initially coexist: administrative distance 1 makes the static route win over OSPF
    distance 110. Removing a static route should reveal the already converged dynamic path, not require
    building routing during an outage.


    Objectives:

    - Verify OSPF convergence before withdrawing preferred static routes.

    - Migrate each direction independently while checking reachability.

    - Perform a tested rollback to the original static preference.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n\
      \ no shutdown\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.1 255.255.255.252\n no\
      \ shutdown\n exit\nip route 192.0.2.2 255.255.255.255 198.18.0.2\nrouter ospf 1\n router-id 192.0.2.1\n\
      \ passive-interface Loopback0\n network 198.18.0.0 0.0.0.3 area 0\n network 192.0.2.1 0.0.0.0 area\
      \ 0\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n\
      \ no shutdown\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.2 255.255.255.252\n no\
      \ shutdown\n exit\nip route 192.0.2.1 255.255.255.255 198.18.0.1\nrouter ospf 1\n router-id 192.0.2.2\n\
      \ passive-interface Loopback0\n network 198.18.0.0 0.0.0.3 area 0\n network 192.0.2.2 0.0.0.0 area\
      \ 0\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
annotations: []
smart_annotations: []
