lab:
  title: Controller, Management and Data-Path Independence
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Controller, Management and Data-Path Independence


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-039-controller-based-networking.md


    Three real CML guests separate the application client, local teaching controller and managed CSR1000v.
    The CLIENT net-tools eth1 address 198.18.1.2/30 reaches only the TOOLS eth2 controller listener 198.18.1.1:8080.
    TOOLS eth1 198.18.0.2/30 connects to API GigabitEthernet1 198.18.0.1/30. The destination 192.0.2.42/32
    is an actual TOOLS Linux loopback. IOS CLI, its installed RIB and real ICMP independently establish
    the forwarding outcome. The controller reads real interface facts using certificate-verified RESTCONF
    and changes only that host route through explicitly key-pinned NETCONF. The registered iosxe-api-v1
    preparation creates and serially transfers public trust material for these disposable guests; no private
    key or administrator credential enters the client.


    Northbound HTTP uses a public classroom bearer token on its separate isolated Ethernet segment. It
    demonstrates the stated application contract, not production transport confidentiality or an external
    authorization service. A root-owned local fixture policy separately approves exact request identifiers
    and route intent; a client cannot grant approval with a field in its request. Duplicate JSON fields,
    unknown keys, wrong scalar types, unexpected targets and conflicting request identifiers are rejected.
    A single owned service process serializes concurrent device operations. SQLite WAL retains job state
    and ordered lifecycle events across process restart; completed replay does not perform another write.
    A resumed pending job reads actual device state before deciding whether a write is necessary. This
    is a single-process compensation model, not a distributed transaction or multi-replica service.


    Every mutation observes the before state and confirms actual device readback. An application confirmation
    fault can be enabled only by the fixture CLI; it occurs after a real write/readback and must restore
    the before state through a fresh verified device session. Failed compensation remains explicitly unverified.
    No external connector, personal token, cloud account or existing user lab is used. Nominal RAM is
    4608 MiB, requiring the explicitly reserved larger-case mode. Exact licensed images and fresh results
    are recorded separately. These are local controller/application exercises; the historical Catalyst
    Center concept filenames do not establish integration with that product.


    After the baseline transaction installs the route, the fault stops only the application process. The
    router and Linux loopback remain running. A refused client HTTP connection and independent successful
    device packets must coexist. Restart must expose the durable job and a new actual service PID, retain
    ordered history and replay the completed request without changing the device.


    Objectives:

    - Submit an approved route intent over a real northbound Ethernet link and verify actual device forwarding.

    - Stop only the controller service and prove that its listener is unavailable while the programmed
    RIB and data path continue.

    - Restart the same process state and replay its completed job without another device change.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: API
  node_definition: csr1000v
  configuration:
  - name: iosxe_config.txt
    content: "hostname API\nno ip domain-lookup\nip domain name cml-lab.example\nusername CML-LAB privilege\
      \ 15 secret Cml-lab-only-984\naaa new-model\naaa authentication login default local\naaa authorization\
      \ exec default local\naaa authentication login CONSOLE none\nline console 0\n login authentication\
      \ CONSOLE\n privilege level 15\n exec-timeout 0 0\n logging synchronous\n exit\ninterface GigabitEthernet1\n\
      \ ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\nno ip http server\nno ip http secure-server\n\
      ip http authentication local\nip ssh version 2\nline vty 0 4\n login authentication default\n transport\
      \ input ssh\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet1
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet2
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet3
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet4
    type: physical
    slot: 3
  tags: []
  ram: 3072
  cpus: 2
- id: n1
  label: TOOLS
  node_definition: cml-labs-toolbox
