lab:
  title: First Hop Redundancy HSRP
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# First Hop Redundancy HSRP


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-019-first-hop-redundancy-hsrp.md


    Requires IOL-L2 XE switches and an IOL-XE client. The failure shuts the L3 SVI, not the switch: the
    client can still cross SW1 at Layer 2 to reach SW2. This does not test total chassis loss. IOSvL2
    was not selected for this exercise because one SVI remained down in the observed cold-start tests.


    Objectives:

    - Explain virtual addressing, priority and preemption.

    - Fail only the active SVI while keeping Layer-2 transit alive.

    - Verify standby takeover and gateway continuity, then restore the preferred active peer.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: SW1
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nip routing\nvlan 10\n name CLIENTS\ninterface Ethernet0/0\n\
      \ switchport trunk encapsulation dot1q\n switchport mode trunk\n switchport trunk native vlan 1\n\
      \ switchport trunk allowed vlan 10\n no shutdown\n exit\ninterface Vlan10\n ip address 198.18.10.2\
      \ 255.255.255.0\n no shutdown\n standby 10 ip 198.18.10.1\n standby 10 priority 110\n standby 10\
      \ preempt\n exit\ninterface Ethernet0/1\n switchport mode access\n switchport access vlan 10\n spanning-tree\
      \ portfast\n no shutdown\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: SW2
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname SW2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nip routing\nvlan 10\n name CLIENTS\ninterface Ethernet0/0\n\
      \ switchport trunk encapsulation dot1q\n switchport mode trunk\n switchport trunk native vlan 1\n\
      \ switchport trunk allowed vlan 10\n no shutdown\n exit\ninterface Vlan10\n ip address 198.18.10.3\
      \ 255.255.255.0\n no shutdown\n standby 10 ip 198.18.10.1\n standby 10 priority 100\n standby 10\
      \ preempt\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n2
  label: CLIENT
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname CLIENT\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Ethernet0/0\n ip address 198.18.10.10 255.255.255.0\n no shutdown\n exit\nip route\
      \ 0.0.0.0 0.0.0.0 198.18.10.1\nend\n"
  cpu_limit: 50
  priority: 98
  x: 520
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
- id: l1
  n1: n2
  i1: i1
  n2: n0
  i2: i2
