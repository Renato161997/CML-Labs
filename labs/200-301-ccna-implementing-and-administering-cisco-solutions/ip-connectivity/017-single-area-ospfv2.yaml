lab:
  title: Single Area OSPFv2
  description: Practice lab with a workbook and explicit verification. Isolated; CML format 0.3.1.
  notes: '# Single Area OSPFv2


    Isolated educational topology; no external connector, real credentials or Internet access.

    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/017-single-area-ospfv2.md


    Starting state: A working reference baseline. Read the workbook before making changes.


    Objectives:

    - Explain how the router ID is selected.

    - Verify a FULL adjacency and a learned loopback route.

    - Make GigabitEthernet0/0 passive, observe loss of adjacency, then restore it.


    Verification:

    - R1: show ip ospf neighbor

    - R1: ping 192.0.2.2 source Loopback0 repeat 3

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.1 255.255.255.252\n\
      \ no shutdown\n exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n no shutdown\n\
      \ exit\nrouter ospf 10\n router-id 1.1.1.1\n network 198.18.0.0 0.0.0.3 area 0\n network 192.0.2.1\
      \ 0.0.0.0 area 0\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.2 255.255.255.252\n\
      \ no shutdown\n exit\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n no shutdown\n\
      \ exit\nrouter ospf 10\n router-id 2.2.2.2\n network 198.18.0.0 0.0.0.3 area 0\n network 192.0.2.2\
      \ 0.0.0.0 area 0\nend\n"
  cpu_limit: 100
  priority: 99
  x: 240
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
annotations: []
smart_annotations: []
