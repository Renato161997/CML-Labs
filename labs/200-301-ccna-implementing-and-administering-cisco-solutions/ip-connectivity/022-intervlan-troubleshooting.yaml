lab:
  title: Inter-VLAN Routing Troubleshooting
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Inter-VLAN Routing Troubleshooting


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-022-intervlan-troubleshooting.md


    Requires four IOL reference nodes, nominally 4 GiB in total. SW1 is a Layer-2 switch with no routing
    SVIs; traffic between USERS and SERVICES must actually cross R1. A wrong tag on Ethernet0/0.20 can
    break the service VLAN despite apparently correct IP addresses and an up physical interface. Both
    clients have explicit return/default routes. All addresses and deliberate fault actions are isolated
    to this imported copy.


    Objectives:

    - Trace actual inter-VLAN traffic between two independent clients.

    - Introduce a router encapsulation mismatch while leaving IP addressing and the physical trunk intact.

    - Restore the correct tag and verify forward and return traffic.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Ethernet0/0\n no ip address\n no shutdown\n exit\ninterface Ethernet0/0.10\n encapsulation\
      \ dot1Q 10\n ip address 198.18.10.1 255.255.255.0\n exit\ninterface Ethernet0/0.20\n encapsulation\
      \ dot1Q 20\n ip address 198.18.20.1 255.255.255.0\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
