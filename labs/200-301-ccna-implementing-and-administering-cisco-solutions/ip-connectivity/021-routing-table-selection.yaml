lab:
  title: Routing Table Selection
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Routing Table Selection


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-021-routing-table-selection.md


    R2 and R3 deliberately advertise the same educational loopback on separate routed links. The duplicate
    /32 represents alternative destinations for the forwarding exercise; it is not a duplicate host address
    on one Ethernet segment.


    Objectives:

    - Distinguish prefix-length selection from administrative distance.

    - Withdraw the more-specific /32 and inspect the resulting next hop.

    - Restore the /32 without changing the covering aggregate.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n\
      \ no shutdown\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.1 255.255.255.252\n no\
      \ shutdown\n exit\ninterface GigabitEthernet0/1\n ip address 198.18.1.1 255.255.255.252\n no shutdown\n\
      \ exit\nip route 192.0.2.0 255.255.255.0 198.18.0.2\nip route 192.0.2.100 255.255.255.255 198.18.1.2\n\
      end\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iosv
  configuration:
