      \ 0 0\n logging synchronous\n exit\ninterface Loopback0\n ip address 192.0.2.100 255.255.255.255\n\
      \ no shutdown\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.1.2 255.255.255.252\n no\
      \ shutdown\n exit\nip route 192.0.2.1 255.255.255.255 198.18.1.1\nend\n"
