lab:
  title: IPv6 Static Routing
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# IPv6 Static Routing


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-020-ipv6-static-routing.md


    Documentation prefix 2001:db8::/32 is used exclusively. IPv6 forwarding must be enabled globally;
    successful interface addressing alone does not prove remote routing.


    Objectives:

    - Inspect global and link-local addressing.

    - Explain the IPv6 forward and return static routes.

    - Verify end-to-end ICMPv6 from the source loopback.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n!\nipv6 unicast-routing\n!\ninterface Loopback0\n no ip address\n ipv6\
      \ enable\n ipv6 address 2001:db8:1::1/128\n!\ninterface GigabitEthernet0/0\n no ip address\n ipv6\
      \ enable\n ipv6 address 2001:db8:12::1/64\n no shutdown\n!\nipv6 route 2001:db8:2::2/128 2001:db8:12::2\n\
      end\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n!\nipv6 unicast-routing\n!\ninterface Loopback0\n no ip address\n ipv6\
      \ enable\n ipv6 address 2001:db8:2::2/128\n!\ninterface GigabitEthernet0/0\n no ip address\n ipv6\
      \ enable\n ipv6 address 2001:db8:12::2/64\n no shutdown\n!\nipv6 route 2001:db8:1::1/128 2001:db8:12::1\n\
      end\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
annotations: []
smart_annotations: []
