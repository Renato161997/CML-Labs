lab:
  title: DHCP Snooping And DAI
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# DHCP Snooping And DAI


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-033-dhcp-snooping-dai.md


    Requires IOSvL2 plus three IOL-XE nodes, nominally 3.75 GiB. Cisco documents DHCP snooping and Dynamic
    ARP Inspection for IOSvL2; this scenario still requires its own observed pass. Only the DHCP server
    port is trusted. Option 82 insertion is disabled for this direct, non-relayed DHCP setup. SPOOFER
    deliberately duplicates the first client lease on a different untrusted port, starts administratively
    down and is activated only during the controlled fault. No external connector is present. DAI stays
    enabled throughout; clearing statistics affects only this disposable one-VLAN switch.


    Objectives:

    - Inspect a real trusted-server DHCP lease and its switch binding.

    - Activate an isolated static-IP impersonator on another untrusted access port.

    - Observe DAI drops while the legitimate client keeps forwarding, then remove the impersonator and
    retest with fresh ARP.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: SW1
  node_definition: iosvl2
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range GigabitEthernet0/0 - 3\n shutdown\n exit\nvlan 10\n name CLIENTS\n exit\nip dhcp snooping\n\
      ip dhcp snooping vlan 10\nno ip dhcp snooping information option\nip arp inspection vlan 10\ninterface\
      \ GigabitEthernet0/0\n switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n\
      \ ip dhcp snooping trust\n ip arp inspection trust\n no shutdown\n exit\ninterface GigabitEthernet0/1\n\
      \ switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n no shutdown\n exit\n\
      interface GigabitEthernet0/2\n switchport mode access\n switchport access vlan 10\n spanning-tree\
      \ portfast\n no shutdown\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
