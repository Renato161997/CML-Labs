lab:
  title: Standard And Extended ACLs
  description: Practice lab with a workbook and explicit verification. Isolated; CML format 0.3.1.
  notes: '# Standard And Extended ACLs


    Isolated educational topology; no external connector, real credentials or Internet access.

    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/032-standard-extended-acls.md


    Starting state: A working reference baseline. Read the workbook before making changes.


    Objectives:

    - Prove that the extended ACL blocks only the target echo traffic.

    - Verify other ICMP is allowed.

    - Explain placement and counter behavior; add a temporary explicit test rule and revert it.


    Verification:

    - CLIENT: ping 192.0.2.100 repeat 3

    - CLIENT: ping 198.18.0.2 repeat 3

    - EDGE: show access-lists CLIENT-IN

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: CLIENT
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname CLIENT\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.10.2 255.255.255.0\n\
      \ no shutdown\n exit\nip route 0.0.0.0 0.0.0.0 198.18.10.1\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: EDGE
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname EDGE\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.10.1 255.255.255.0\n\
      \ no shutdown\n ip access-group CLIENT-IN in\n exit\ninterface GigabitEthernet0/1\n ip address 198.18.0.1\
      \ 255.255.255.252\n no shutdown\n exit\nip route 0.0.0.0 0.0.0.0 198.18.0.2\nip access-list extended\
      \ CLIENT-IN\n deny icmp host 198.18.10.2 host 192.0.2.100 echo\n permit ip any any\n exit\nend\n"
  cpu_limit: 100
  priority: 99
  x: 240
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
- id: n2
  label: ISP
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname ISP\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.2 255.255.255.252\n\
      \ no shutdown\n exit\ninterface Loopback0\n ip address 192.0.2.100 255.255.255.255\n no shutdown\n\
      \ exit\nip route 198.18.10.0 255.255.255.0 198.18.0.1\nend\n"
  cpu_limit: 100
  priority: 98
  x: 480
  y: 0
  interfaces:
