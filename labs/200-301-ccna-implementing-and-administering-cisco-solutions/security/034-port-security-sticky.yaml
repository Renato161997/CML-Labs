lab:
  title: Port Security Sticky MAC
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Port Security Sticky MAC


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-034-port-security-sticky.md


    Requires IOL-L2 XE and IOL-XE. Restrict mode drops the violating source while retaining the port.
    The temporary locally administered address exists only on the isolated test link. Restoring no mac-address
    returns the client to its original burned-in address; this does not model physical tampering protection.


    Objectives:

    - Learn one real source MAC with sticky port security.

    - Change the test client MAC and observe actual dropped traffic and violations.

    - Restore the original interface MAC and verify forwarding resumes.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: SW1
  node_definition: ioll2-xe
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range Ethernet0/0 - 3\n shutdown\n exit\nvlan 10\n name USERS\ninterface Vlan10\n ip address 198.18.0.2\
      \ 255.255.255.252\n no shutdown\n exit\ninterface Ethernet0/0\n switchport mode access\n switchport\
      \ access vlan 10\n switchport port-security\n switchport port-security maximum 1\n switchport port-security\
      \ violation restrict\n switchport port-security mac-address sticky\n spanning-tree portfast\n no\
      \ shutdown\n exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n1
  i1: i1
  n2: n0
  i2: i1
annotations: []
smart_annotations: []
