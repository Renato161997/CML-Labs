lab:
  title: Layer 2 Security Stack
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Layer 2 Security Stack


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-044-layer-2-security-stack.md


    One IOSvL2 switch and three IOL-XE routers integrate DHCP snooping, DAI and sticky port security on
    isolated VLAN10. Only the DHCP server port is trusted. The legitimate client uses a public fixed exercise
    MAC and remains a real DHCP client throughout. SPOOFER starts down and duplicates that IP on another
    untrusted port; actual DAI drops and a healthy legitimate client identify the enforcement layer. The
    controlled MAC change restarts the client interface so fresh DHCP frames exercise port security. Acceptance
    requires an actual error-disabled port and nonzero security-violation count, not a failed IPv4 ping
    while DHCP is unavailable. Restoring the original MAC alone must not clear the latched violation.
    After the secured port is reset, the test waits for the real lease and snooping binding before checking
    gateway traffic and fresh ARP. The DHCP server may assign a different address after the interface
    cycle; recovery checks the actual pool lease, restored MAC/port binding and fresh ARP/data rather
    than requiring the initial address. All controls remain enabled. IP Source Guard, physical ASIC behavior
    and production NAC are outside scope. Nominal RAM is3840MiB.


    Objectives:

    - Correlate an actual DHCP lease, snooping binding, sticky source MAC and legitimate ARP/traffic.

    - Activate a duplicate-address sender on another untrusted port and distinguish DAI drops from port-security
    shutdown.

    - Change the protected client MAC, verify a latched port-security violation, then restore the MAC,
    port and actual DHCP binding before retesting traffic.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: SW1
  node_definition: iosvl2
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\nvtp mode transparent\nspanning-tree mode rapid-pvst\ninterface\
      \ range GigabitEthernet0/0 - 3\n shutdown\n exit\nvlan 10\n name CLIENTS\n exit\nip dhcp snooping\n\
      ip dhcp snooping vlan 10\nno ip dhcp snooping information option\nip arp inspection vlan 10\ninterface\
      \ GigabitEthernet0/0\n switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n\
      \ ip dhcp snooping trust\n ip arp inspection trust\n no shutdown\n exit\ninterface GigabitEthernet0/1\n\
      \ switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n switchport port-security\n\
      \ switchport port-security maximum 1\n switchport port-security violation shutdown\n switchport\
      \ port-security mac-address sticky\n no shutdown\n exit\ninterface GigabitEthernet0/2\n switchport\
      \ mode access\n switchport access vlan 10\n spanning-tree portfast\n no shutdown\n exit\nend\n"
  cpu_limit: 100
  priority: 100
  x: 0
  y: 0
