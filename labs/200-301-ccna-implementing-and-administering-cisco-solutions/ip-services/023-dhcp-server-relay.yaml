lab:
  title: DHCP Server And Relay
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# DHCP Server And Relay


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-023-dhcp-server-relay.md


    A router is used as a DHCP client so the console can inspect the lease without an external desktop.
    The server must route replies to the client subnet; the relay uses giaddr to select the USERS pool.


    Objectives:

    - Follow a broadcast request across a routed relay.

    - Verify the client obtains a dynamic address and default route.

    - Inspect the lease on the server and prove routed reachability.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: CLIENT
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname CLIENT\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface GigabitEthernet0/0\n ip address dhcp\n no shutdown\n\
      \ exit\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: RELAY
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname RELAY\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.10.1 255.255.255.0\n\
      \ no shutdown\n ip helper-address 198.18.0.2\n exit\ninterface GigabitEthernet0/1\n ip address 198.18.0.1\
      \ 255.255.255.252\n no shutdown\n exit\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
- id: n2
  label: SERVER
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname SERVER\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.2 255.255.255.252\n\
      \ no shutdown\n exit\nip route 198.18.10.0 255.255.255.0 198.18.0.1\nip dhcp excluded-address 198.18.10.1\
      \ 198.18.10.9\nip dhcp pool USERS\n network 198.18.10.0 255.255.255.0\n default-router 198.18.10.1\n\
      \ exit\nend\n"
  cpu_limit: 50
  priority: 98
  x: 520
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
- id: l1
  n1: n1
  i1: i2
  n2: n2
  i2: i1
