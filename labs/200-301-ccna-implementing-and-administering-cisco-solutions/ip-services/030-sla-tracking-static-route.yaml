lab:
  title: IP SLA Tracking Static Route
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# IP SLA Tracking Static Route


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-030-sla-tracking-static-route.md


    R1 tests the primary peer every three seconds and tracks the result. CML can leave the local virtual
    carrier up when the remote interface shuts; IP SLA detects this condition independently. The untracked
    return routes on R2 follow its own local interface state.


    Objectives:

    - Distinguish local carrier state from end-to-end path health.

    - Fail the far-end primary interface and observe probe-driven route withdrawal.

    - Verify backup data-plane traffic and restore the primary.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface Loopback0\n ip address 192.0.2.1 255.255.255.255\n\
      \ no shutdown\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.1 255.255.255.252\n no\
      \ shutdown\n exit\ninterface GigabitEthernet0/1\n ip address 198.18.1.1 255.255.255.252\n no shutdown\n\
      \ exit\nip sla 1\n icmp-echo 198.18.0.2 source-interface GigabitEthernet0/0\n timeout 1000\n frequency\
      \ 3\n exit\nip sla schedule 1 life forever start-time now\ntrack 1 ip sla 1 reachability\n exit\n\
      ip route 192.0.2.2 255.255.255.255 198.18.0.2 track 1\nip route 192.0.2.2 255.255.255.255 198.18.1.2\
      \ 200\nend\n"
  cpu_limit: 50
  priority: 100
  x: 0
  y: 0
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
- id: n1
  label: R2
  node_definition: iosv
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface Loopback0\n ip address 192.0.2.2 255.255.255.255\n\
      \ no shutdown\n exit\ninterface GigabitEthernet0/0\n ip address 198.18.0.2 255.255.255.252\n no\
      \ shutdown\n exit\ninterface GigabitEthernet0/1\n ip address 198.18.1.2 255.255.255.252\n no shutdown\n\
      \ exit\nip route 192.0.2.1 255.255.255.255 198.18.0.1\nip route 192.0.2.1 255.255.255.255 198.18.1.1\
      \ 200\nend\n"
  cpu_limit: 50
  priority: 99
  x: 260
  y: 160
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet0/3
    type: physical
    slot: 3
  tags: []
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
- id: l1
  n1: n0
  i1: i2
  n2: n1
  i2: i2
annotations: []
smart_annotations: []
