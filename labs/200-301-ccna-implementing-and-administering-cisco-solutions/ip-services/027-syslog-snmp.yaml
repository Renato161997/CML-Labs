lab:
  title: Syslog And SNMP
  description: Working baseline with addressing, tasks, acceptance and recovery. Live status is recorded
    separately.
  notes: '# Syslog And SNMP


    Working isolated reference baseline. No external connector or real credentials.


    Workbook: https://github.com/Renato161997/CML-Labs/blob/main/docs/workbooks/200-301-027-syslog-snmp.md


    An IOL-XE router is queried by the native net-tools image and sends syslog to the dedicated syslog-ng
    reference image. Native eth0 is the CML management interface; only eth1 is cabled to the lab. The
    SNMP helper uses the installed Net-SNMP binary, authenticates and encrypts each request, checks actual
    OID values and rechecks availability after the wrong-key negative control. SHA1/AES128 are explicit
    exercise interoperability choices; the passwords and engine ID are public lab fixtures. A router-to-receiver
    reachability check precedes the first test event so initial neighbor discovery cannot be mistaken
    for verified UDP delivery. The syslog listener uses IP_FREEBIND so it can start before CML applies
    the benchmark-address data interface. It accepts traffic only on that address. UDP delivery and view-based
    access are tested; physical throughput, durable SIEM storage and external time accuracy are not claimed.


    Objectives:

    - Query a real router with SNMPv3 authPriv and reject incorrect authentication.

    - Exclude only sysName from the view while preserving authenticated uptime access.

    - Collect actual router syslog over UDP and verify selective withdrawal and restoration.

    '
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: true
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain-lookup\nno service config\nip cef\nline console 0\n exec-timeout\
      \ 0 0\n logging synchronous\n exit\ninterface range Ethernet0/0 - 3\n no ip address\n shutdown\n\
      \ exit\ninterface Ethernet0/0\n ip address 198.18.0.1 255.255.255.252\n no shutdown\n exit\ninterface\
      \ Ethernet0/1\n ip address 198.18.1.1 255.255.255.252\n no shutdown\n exit\nip access-list standard\
      \ SNMP-SOURCES\n permit 198.18.0.2\n exit\nsnmp-server engineID local 8000000903AABBCC000001\nsnmp-server\
      \ view LABVIEW iso included\nsnmp-server view LABVIEW 1.3.6.1.2.1.1.5 included\nsnmp-server group\
      \ LAB v3 priv read LABVIEW access SNMP-SOURCES\nsnmp-server user CML-SNMP LAB v3 auth sha Cml-Snmp-Auth-Only-983\
      \ priv aes 128 Cml-Snmp-Priv-Only-984\nsnmp-server location ISOLATED-CML-LAB\nlogging on\nlogging\
      \ buffered 32768 informational\nlogging trap informational\nlogging source-interface Ethernet0/1\n\
      logging host 198.18.1.2 transport udp port 514\nend\n"
